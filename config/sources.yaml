# Rosso Market data sources
#
# Each source has an adapter (how it is read) and enabled (whether the daily run uses it).
# Adapters: bringatrailer, browser_json, static_page, static_then_browser, marketcheck, apify, demo
#
# status notes:
#   verified    data feed inspected in a real browser on 2026-10-31, adapter tested against captured responses
#   unverified  configured from the site's general structure; confirm on the first live run (README)
#
# To add another auction house or dealer: copy a browser_json block, change start_urls and label. That is all.

settings:
  db: data/ferrari.db
  raw_dir: data/raw
  site_dir: site
  content_dir: content
  user_agent: "RossoMarketBot/1.0 (+https://rossomarket.example/bot)"   # put your real site and a contact address here
  min_interval_seconds: 4          # per host, between requests
  respect_robots_txt: true
  max_retries: 3
  timeout_seconds: 30
  removal_after_missed_runs: 2     # a listing counts as gone after its source misses it on 2 successful runs
  min_model_confidence: 0.5
  # The owner's CarGurus price tracker (pipeline/tracker.py). Its tabs are stored in config/tracker. When the
  # sheet is shared as "anyone with the link can view", each run reads the latest tabs from it.
  tracker:
    sheet_id: 1MwGU28_yBw4Q8-BijGAgyYDaxrBzGREa2YzSM8jGBDk
    gids: {"599 GTB": 181788763, "F12 Berlinetta": 122642564, "812 Superfast": 535255918, "812 GTS": 636413200,
           "12 Cilindri Coupe": 1845440067, "F430 Coupe": 465802422, "458 Spider": 500835901, "F8 Spider": 963100502,
           "488 Pista": 1820306768, "488 Pista Spider": 544069556, "458 Speciale": 1226250253, "458 Speciale Aperta": 2044092037,
           "599 GTO": 704125155, "F12 TDF": 1573076750, "812 Competizione": 592513894}
  fx_live: true                    # refresh exchange rates each run, falling back to the table below
  fx_url: https://api.frankfurter.app/latest?from=USD
  fx: {USD: 1.0, CAD: 0.73, EUR: 1.08, GBP: 1.27, CHF: 1.12, AUD: 0.66, JPY: 0.0066, AED: 0.2723}

llm_fallback:                      # optional: Claude reads pages where structured data comes back empty
  enabled: false                   # needs ANTHROPIC_API_KEY
  model: claude-haiku-5-5
  max_chars: 60000

news_feeds:                        # headlines and links only, racing news filtered out
  - {name: Motor1, url: https://www.motor1.com/rss/make/ferrari/}   # verified 2026-10-31

classic_com:                       # listing dates for cars no listing site dates (pipeline/classic_com.py)
  enabled: false                   # off: CLASSIC.COM answers automated requests with 403 from GitHub's servers and
                                   # from the Mac alike (checked 2026-11-02), and that refusal is not worked around.
                                   # The reader is kept for a permitted route (their partner data access)
  runner: home
  lookups: 150                     # VINs asked per run (3 s apart, about 8 minutes), each once (again after a week)
  fetch: {min_interval_seconds: 3}

sources:

  # ============================================================ asking prices (dealers and private sellers)

  ferrari_approved:                # verified. Every car at a Ferrari dealer, US ~1,200 and Canada ~100; flags certified cars
    adapter: ferrari_approved      # Refuses GitHub Actions addresses (403, even in a browser), so it runs on the Mac
    enabled: true                  # (workflow "Home sources"). A residential proxy is the alternative.
    runner: home
    fetch: {proxy_env: RESIDENTIAL_PROXY_URL}
    countries: [usa, canada]        # Canada for its hypercars: other Canadian cars are dropped by normalize.outside_market
    max_pages: 200                 # 11 cars per page, ~120 pages, about 8 minutes at 4 seconds per request
    wayback_lookups: 0             # off: ads stopped carrying the VIN in Jan 2026, so the archive dates almost no
                                   # current stock (Fort Lauderdale: 2 of 57 cars, both stale) and its index server
                                   # times out on these queries. Cars take their date from the same car on duPont
                                   # Registry instead. Dealers already looked up stay in kv.

  marketcheck:                     # built, needs a paid key. AutoTrader, Cars.com, CarGurus and dealer sites, US
    adapter: marketcheck
    enabled: false                 # set MARKETCHECK_API_KEY, then true
    channels: [dealer, private]
    countries: [us]
    car_type: used
    max_rows_per_channel: 5000
    fetch: {respect_robots_txt: false, min_interval_seconds: 0.5}

  dupont_registry:                 # verified 2026-11-01. Exotic dealer marketplace, ~1,800 used Ferraris, schema.org data on each page
    adapter: dupont_registry
    enabled: true
    max_pages: 150
    date_pages: 200                # each car's own page is read once for its "Date Listed", then remembered.
                                   # Kept small and at the normal pace: a faster first pass on 2026-11-02 was
                                   # met with 403s, so the rest are dated a few hundred a day.

  dealer_sites:                    # unverified. Add independent dealers' inventory pages; most publish JSON-LD
    adapter: static_page
    enabled: false
    kind: listing
    label: dealer site
    start_urls: []

  # Marketplaces. robots.txt allows general crawlers on these search pages (checked 2026-11-01).
  # They run on the Mac like Ferrari Approved, since big marketplaces refuse data center addresses.
  autotrader_us:                   # off 2026-11-01: answers both plain requests and the Mac's headless browser
    adapter: autotrader            # with "Autotrader - page unavailable" (its bot block). Not worked around.
    enabled: false                 # MarketCheck (marketcheck, paid key) carries AutoTrader inventory under licence
    runner: home
    page_size: 100
    max_pages: 40
  autostoday:                      # off 2026-11-01: ~2,400 used Ferraris, but it answers automated readers with 403,
    adapter: autostoday            # from GitHub's servers and from the Mac alike (plain requests and the browser).
    enabled: false                 # That is a bot block, so it is not worked around. The reader is kept.
    runner: home
    max_pages: 120
  classiccars:                     # verified 2026-11-01. ~180 classic and modern Ferraris from dealers and private sellers
    adapter: classiccars
    enabled: true
    max_pages: 25
    detail_pages: 150              # each listing page is read once, then reused
    wayback_lookups: 40            # archived home page captures read per run to date listing numbers (12 s apart)
  cars_com:                        # off: every page, robots.txt included, sits behind a Cloudflare bot check
    adapter: browser_json
    enabled: false
    kind: listing
    label: cars.com
    start_urls: [https://www.cars.com/shopping/ferrari/]

  # ============================================================ auctions

  bringatrailer:                   # verified. Live lots from the auctions page, results from BaT's results endpoint (~7,000 Ferrari)
    adapter: bringatrailer
    enabled: true
    live_urls: [https://bringatrailer.com/auctions/]
    result_pages: 3                # 36 per page, newest first; raise for a one off history import

  carsandbids:                     # verified. Requests are signed, so the browser captures the page's own feed
    adapter: browser_json
    enabled: true
    kind: auction
    label: Cars & Bids
    start_urls: [https://carsandbids.com/search/ferrari]
    json_url_contains: ["/v2/autos/auctions"]
    url_template: "https://carsandbids.com/auctions/{id}"
    scrolls: 6

  somo:                            # verified. Sotheby's Motorsport listings API (live, preview, sold)
    adapter: somo                  # Refuses GitHub Actions addresses, so it runs on the Mac
    enabled: true
    runner: home
    fetch: {proxy_env: RESIDENTIAL_PROXY_URL}
    sold_pages: 4

  dupont_live:                     # verified. duPont Registry Live listings API. Some results look implausible
    adapter: dupont_live           # (an F12tdf at $2.66M); the outlier guard keeps those out of insights
    enabled: true
    sold_pages: 4

  rmsothebys:                      # verified. Search API, ~3,200 Ferrari results worldwide plus lots on offer
    adapter: rmsothebys
    enabled: true
    result_pages: 3
    on_offer_pages: 1
    date_backfill: 300             # auction pages read per run to date results (cached, so only new auctions cost a request)

  mecum:                           # verified. Algolia index wp_posts_lot (needs Chromium once per run to read the public key)
    adapter: mecum
    enabled: true
    lookback_days: 400

  broadarrow:                      # verified. Sitemap plus one page per lot (robots.txt bars the results search, asks 10 s between requests)
    adapter: broadarrow
    enabled: true
    runner: home                   # answers GitHub's servers with an AWS WAF challenge (HTTP 202)
    lot_pages: 80                  # pages read per run; finished lots and lots with no published price are never read twice
    image_backfill: 30             # stored results without a photo: pages re-read per run to add one
    fetch:
      min_interval_seconds: 10

  gooding:                         # verified. GraphQL getVehicles at cdn.goodingco.com, ~940 Ferrari lots
    adapter: gooding
    enabled: true

  bonhams:                         # verified. Typesense search proxy (public key read from the site's own script), ~1,800 Ferrari car lots
    adapter: bonhams
    enabled: true
    # the public search only key every visitor's browser receives; used only when it cannot be read from the site
    api_key: 7YZqOyG0twgst4ACc2VuCyZxpGAYzM0weFTLCC20FQY

  pcarmarket:                      # verified. Server rendered search plus one page per car lot (robots.txt allows; no AI training)
    adapter: pcarmarket
    enabled: true
    runner: home                   # Cloudflare answers GitHub's servers with 403
    result_pages: 3                # newest results pages read each run (24 a page)
    history_pages: 70              # until every results page has been read once (~60 pages, ~4 s each)
    lot_pages: 60

  # ============================================================ managed backups (paid, maintained by others)
  apify_bringatrailer:
    adapter: apify
    enabled: false
    kind: auction
    label: Bring a Trailer
    actor: jongoose/bring-a-trailer-scraper
    input: {startUrls: [{url: "https://bringatrailer.com/ferrari/"}], maxItems: 500}
    fetch: {respect_robots_txt: false}
  apify_carsandbids:
    adapter: apify
    enabled: false
    kind: auction
    label: Cars & Bids
    actor: solidcode/carsandbids-com-scraper
    input: {searchQueries: ["Ferrari"], auctionStatus: all, maxResults: 500}
    fetch: {respect_robots_txt: false}
