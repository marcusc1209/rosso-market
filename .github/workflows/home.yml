name: Home sources

# Ferrari Approved and SOMO refuse GitHub's servers, so they run on the owner's Mac
# (a self hosted runner). If the Mac is asleep at the scheduled time, GitHub keeps the
# job queued and it starts when the Mac wakes (up to 24 hours).
on:
  schedule:
    - cron: "37 14 * * *"     # 7:37 am Pacific
  workflow_dispatch: {}

permissions:
  contents: write     # save the database to the market-data branch
  issues: write       # open an issue when a source breaks
  actions: write      # ask the daily workflow to republish the site

concurrency: { group: market-home, cancel-in-progress: false }

jobs:
  home:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # actions/setup-python installs into /Users/runner, which only exists on GitHub's own
      # Macs. uv puts Python 3.12 in the user's home folder instead: no admin rights needed.
      - name: Python 3.12
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv --python 3.12 --allow-existing "$HOME/.rosso-venv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.rosso-venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          uv pip install -q --python "$HOME/.rosso-venv/bin/python" -r requirements.txt
          python -m playwright install chromium

      - name: Restore database
        run: |
          mkdir -p data
          git fetch --depth 1 origin market-data
          git show origin/market-data:ferrari.db > data/ferrari.db
          git rev-parse origin/market-data > data/base.sha

      - name: Run home sources
        run: python -m pipeline.run --where home --report data/report.json
        env:
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}

      - name: Save database
        if: always()
        run: |
          [ -s data/ferrari.db ] || exit 0
          sqlite3 data/ferrari.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          # the other workflow may have saved since we started: merge its rows in first
          git fetch -q --depth 1 origin market-data 2>/dev/null || true
          if [ -f data/base.sha ] && [ "$(git rev-parse origin/market-data 2>/dev/null)" != "$(cat data/base.sha)" ]; then
            git show origin/market-data:ferrari.db > data/remote.db
            python -m pipeline.merge data/remote.db --where home
          fi
          tmp=$(mktemp -d); cp data/ferrari.db "$tmp/"
          cd "$tmp" && git init -q -b market-data && git add ferrari.db
          git -c user.name="rosso-market-bot" -c user.email="bot@users.noreply.github.com" commit -qm "Market data $(date -u +%F) (home)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data
          rm -rf "$tmp"

      - name: Alert on broken sources
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('data/report.json')) return;
            const bad = JSON.parse(fs.readFileSync('data/report.json')).filter(r => r.state !== 'ok');
            if (!bad.length) return;
            const title = `Data source problem: ${bad.map(b => b.source).join(', ')}`;
            const body = bad.map(b => `- **${b.source}**: ${b.state}. ${b.detail || ''}`).join('\n') + '\n\nThis ran on the Mac (Home sources workflow).';
            const open = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'data-source'});
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, body, labels: ['data-source']});

      - name: Republish the site
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'daily.yml', ref: 'main',
              inputs: {publish_only: 'true'}});
