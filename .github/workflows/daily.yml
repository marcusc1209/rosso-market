name: Daily market run

on:
  schedule:
    - cron: "17 11 * * *"     # 11:17 UTC daily (4:17 am Pacific), after MarketCheck's daily refresh
  workflow_dispatch:
    inputs:
      history:
        description: "Import extra auction history this run (first run only)"
        type: boolean
        default: false
      publish_only:
        description: "Only rebuild and publish the site from the saved data"
        type: boolean
        default: false

permissions:
  contents: write     # push the database to the market-data branch
  issues: write       # open an issue when a source breaks
  pages: write
  id-token: write

concurrency: { group: market-cloud, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
        if: ${{ inputs.publish_only != true }}

      # The database is the market's memory. It lives on its own branch so it survives
      # cache eviction, and each run replaces it (no history bloat on that branch).
      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth 1 origin market-data 2>/dev/null; then
            git show origin/market-data:ferrari.db > data/ferrari.db
            git rev-parse origin/market-data > data/base.sha
            echo "restored $(du -h data/ferrari.db | cut -f1)"
          else
            echo "no market-data branch yet: first run"
          fi

      - run: python -m pytest -q tests

      - name: Run pipeline
        run: |
          if [ "${{ inputs.publish_only }}" = "true" ]; then python -m pipeline.run --export-only; exit 0; fi
          if [ "${{ inputs.history }}" = "true" ]; then export FM_HISTORY=1; fi
          python -m pipeline.run --where cloud --report data/report.json
        env:
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}

      - name: Save database
        if: ${{ always() && inputs.publish_only != true }}
        run: |
          [ -f data/ferrari.db ] || exit 0
          sqlite3 data/ferrari.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          # the other workflow may have saved since we started: merge its rows in first
          git fetch -q --depth 1 origin market-data 2>/dev/null || true
          if [ -f data/base.sha ] && [ "$(git rev-parse origin/market-data 2>/dev/null)" != "$(cat data/base.sha)" ]; then
            git show origin/market-data:ferrari.db > data/remote.db
            python -m pipeline.merge data/remote.db --where cloud
          fi
          tmp=$(mktemp -d); cp data/ferrari.db "$tmp/"
          cd "$tmp" && git init -q -b market-data && git add ferrari.db
          git -c user.name="rosso-market-bot" -c user.email="bot@users.noreply.github.com" commit -qm "Market data $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data

      - name: Alert on broken sources
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('data/report.json')) return;
            const bad = JSON.parse(fs.readFileSync('data/report.json')).filter(r => r.state !== 'ok');
            if (!bad.length) return;
            const title = `Data source problem: ${bad.map(b => b.source).join(', ')}`;
            const body = bad.map(b => `- **${b.source}**: ${b.state}. ${b.detail || ''}`).join('\n') +
              `\n\nRaw pages from this run are attached to the workflow run as "raw-pages". See README, "When a source breaks".`;
            const open = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'data-source'});
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, body, labels: ['data-source']});

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: raw-pages, path: data/raw, retention-days: 14 }

      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
