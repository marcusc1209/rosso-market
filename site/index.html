<title>Rosso Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Daily asking prices, auction results and market trends for every Ferrari for sale in the US and Canada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a race timing sheet. One dark "timing screen" hero carries the market index,
   everything below is quiet paper with tabular figures, ranked like positions. */
:root {
  --bg: #f3f4f5;
  --surface: #ffffff;
  --ink: #15171a;
  --muted: #5b6168;
  --line: #d9dce0;
  --chip: #eaecee;
  --rosso: #c4161c;
  --giallo: #f2c200;
  --up: #17734a;
  --down: #b3261e;
  --hero-bg: #111316;
  --hero-fg: #f1f2f3;
  --hero-muted: #98a0a9;
  --hero-line: #2a2e33;
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --wrap: 1180px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f11; --surface: #15181b; --ink: #e8eaec; --muted: #99a0a8; --line: #2a2f34; --chip: #1e2226;
    --rosso: #ef4a4f; --up: #48c08b; --down: #f0676b; --hero-bg: #07080a; --hero-line: #23272c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f11; --surface: #15181b; --ink: #e8eaec; --muted: #99a0a8; --line: #2a2f34; --chip: #1e2226;
  --rosso: #ef4a4f; --up: #48c08b; --down: #f0676b; --hero-bg: #07080a; --hero-line: #23272c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rosso); outline-offset: 2px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 700 clamp(26px, 3.4vw, 36px)/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase; }
h3 { font: 600 17px/1.3 var(--f-body); }

/* ---------- header */
.site-head { background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
.head-row { display: flex; align-items: center; gap: 24px; min-height: 64px; flex-wrap: wrap; padding-block: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-mark { width: 30px; height: 30px; display: grid; place-items: center; background: var(--giallo); color: #111; font: 800 15px/1 var(--f-display); letter-spacing: .02em; }
.logo-word { font: 800 21px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.logo-word span { color: var(--rosso); }
nav.main { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; }
nav.main a, nav.main summary { padding: 8px 10px; text-decoration: none; font-weight: 500; font-size: 14px; color: var(--muted); cursor: pointer; border-radius: 2px; list-style: none; }
nav.main summary::-webkit-details-marker { display: none; }
nav.main a:hover, nav.main summary:hover, nav.main a[aria-current="page"] { color: var(--ink); }
nav.main a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--rosso); }
details.models { position: static; }
details.models summary::after { content: " \25BE"; font-size: 11px; }
.menu { position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 18px 30px rgba(0,0,0,.08); }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px 28px; padding-block: 22px 26px; }
.menu-grid h4 { margin: 0 0 8px; font: 600 11px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.menu-grid a { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; text-decoration: none; font-size: 14px; }
.menu-grid a:hover span:first-child { color: var(--rosso); }
.menu-grid a span:last-child { color: var(--muted); font-size: 12px; }

.sample-bar { background: var(--giallo); color: #1a1a1a; font-size: 13px; }
.sample-bar .wrap { padding-block: 8px; }

/* ---------- hero */
.hero { background: var(--hero-bg); color: var(--hero-fg); position: relative; overflow: hidden; }
.hero .wrap { position: relative; padding-block: 56px 40px; display: grid; gap: 18px; }
.hero-chart { position: absolute; inset: 0; opacity: .9; pointer-events: none; }
.hero-chart svg { width: 100%; height: 100%; display: block; }
.hero .eyebrow { color: var(--hero-muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--giallo); display: inline-block; }
.hero h1 { font: 800 clamp(54px, 10vw, 128px)/.86 var(--f-display); letter-spacing: .005em; text-transform: uppercase; }
.hero h1 span { color: #e8262d; }
.hero p.lede { max-width: 58ch; color: #c9ced4; font-size: 17px; margin: 0; }
.hero-index { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 8px; }
.hero-index div { display: grid; gap: 2px; }
.hero-index b { font: 500 22px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.hero-index small { color: var(--hero-muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

/* ---------- jump menu */
.jump { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); }
.jump-scroll { overflow-x: auto; scrollbar-width: none; }
.jump-scroll::-webkit-scrollbar { display: none; }
.jump-row { display: flex; gap: 4px; padding-block: 6px; white-space: nowrap; }
.jump button { border: 0; background: none; padding: 8px 12px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
.jump button:hover, .jump button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--rosso); }

/* ---------- sections */
section.block { padding-block: 56px; border-bottom: 1px solid var(--line); scroll-margin-top: 52px; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.sec-head .eyebrow { margin-bottom: 8px; color: var(--rosso); }
.link-more { font-size: 14px; font-weight: 500; text-decoration: none; color: var(--rosso); white-space: nowrap; }
.link-more:hover { text-decoration: underline; }

/* brief */
.brief { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; }
.brief h2 { font-size: clamp(28px, 4vw, 44px); margin-bottom: 22px; text-transform: none; }
.changes { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
.changes li { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.changes li b { font-weight: 600; }
.stats { display: grid; gap: 0; align-content: start; border-top: 2px solid var(--ink); }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.stat b { font: 500 34px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; text-align: right; }
.stat em { display: block; font-style: normal; font-size: 12px; }

/* movers */
.movers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mover { background: var(--surface); border: 1px solid var(--line); padding: 18px 18px 14px; text-decoration: none; display: grid; gap: 10px; transition: border-color .15s; }
.mover:hover { border-color: var(--ink); }
.mover-top { display: flex; justify-content: space-between; align-items: center; }
.pos { font: 700 15px/1 var(--f-display); background: var(--ink); color: var(--surface); padding: 5px 7px; }
.mover h3 { font: 700 26px/1 var(--f-display); text-transform: uppercase; }
.mover .big { font: 500 30px/1 var(--f-mono); }
.mover .meta { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.spark { width: 100%; height: 54px; display: block; }
.all-movers { margin-top: 18px; }
.all-movers summary { cursor: pointer; font-weight: 500; color: var(--rosso); list-style: none; display: inline-block; padding: 6px 0; }
.all-movers summary::-webkit-details-marker { display: none; }
.rule { color: var(--muted); font-size: 13px; max-width: 80ch; margin-top: 16px; }

/* tables (timing sheet) */
.tbl-wrap { overflow-x: auto; border-top: 2px solid var(--ink); }
table.sheet { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.sheet th { text-align: left; font: 600 11px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sheet td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.sheet td.r, .sheet th.r { text-align: right; }
.sheet td.num, .sheet td .num { white-space: nowrap; }
.sheet tr.click { cursor: pointer; }
.sheet tr.click:hover td { background: var(--chip); }
.sheet .name { font-weight: 600; }
.sheet .name a { text-decoration: none; }
.sheet .name a:hover { color: var(--rosso); }
.sheet .p { font: 700 14px/1 var(--f-display); color: var(--muted); width: 32px; }

/* families */
.families { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.family { background: var(--surface); border: 1px solid var(--line); padding: 18px; display: grid; gap: 8px; align-content: start; text-decoration: none; }
.family:hover { border-color: var(--ink); }
.family h3 { font: 700 22px/1.05 var(--f-display); text-transform: uppercase; }
.family .n { color: var(--muted); font-size: 13px; }
.family .sig { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.family .go { color: var(--rosso); font-weight: 500; font-size: 14px; }

/* insights */
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 32px; }
.insight { padding: 18px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.tag { display: inline-block; justify-self: start; font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 7px; background: var(--chip); color: var(--muted); }
.insight p { margin: 0; color: var(--muted); }
.insight a { font-size: 14px; font-weight: 500; color: var(--rosso); text-decoration: none; }


/* news */
.date { color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
.news { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.news a { text-decoration: none; display: grid; gap: 6px; }
.news a:hover h3 { color: var(--rosso); }
.empty { border: 1px dashed var(--line); padding: 26px; color: var(--muted); }

/* auctions and listings: photo cards, like classic.com */
.lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.lot { background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; text-decoration: none; overflow: hidden; transition: border-color .15s; }
.lot:hover { border-color: var(--ink); }
.lot:hover .ph img { transform: scale(1.03); }
.lot .body { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.lot h3 { font-size: 15px; line-height: 1.3; }
.ph { position: relative; aspect-ratio: 4 / 3; background: var(--chip); overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
.ph.none::after { content: "Photo unavailable"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 600 10px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; }
.ph .chips { position: absolute; left: 10px; top: 10px; right: 10px; min-height: 0; z-index: 1; }
.ph .chip { background: var(--surface); }
.lot .specs { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.thumb { width: 76px; padding: 6px 10px 6px 0 !important; }
.thumb .ph { width: 76px; border: 1px solid var(--line); }
.thumb .ph.none::after { content: ""; }
.sec-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: -8px 0 14px; }
.sort { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sort select { font: 500 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 6px 28px 6px 10px; border-radius: 0; cursor: pointer; }
.view-switch { display: inline-flex; border: 1px solid var(--line); }
.view-switch button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.view-switch button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.insight .ph { margin-bottom: 4px; aspect-ratio: 16 / 9; }
.lot .house { color: var(--muted); font-size: 13px; }
.lot .bid { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.lot .bid b { font: 500 20px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.lot .bid span { color: var(--muted); font-size: 12px; text-align: right; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 21px; }
.chip { font: 600 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 5px 7px; border: 1px solid var(--line); color: var(--muted); }
.chip.hot { border-color: var(--rosso); color: var(--rosso); }
.chip.sold { border-color: var(--up); color: var(--up); }
.chip.unsold { border-color: var(--down); color: var(--down); }

/* car page, like a classic.com vehicle page */
.gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; aspect-ratio: 16 / 7; margin-top: 18px; }
.gallery button { all: unset; cursor: zoom-in; position: relative; overflow: hidden; background: var(--chip); }
.gallery button:first-child { grid-row: span 2; }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
.gallery button:hover img { transform: scale(1.03); }
.gallery .count { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.72); color: #fff; font: 600 12px/1 var(--f-body); padding: 8px 10px; letter-spacing: .04em; }
.gallery .count.m { display: none; }
.gallery.one { grid-template-columns: 1fr; grid-template-rows: 1fr; aspect-ratio: 16 / 8; }
.gallery.none { aspect-ratio: 16 / 6; display: grid; place-items: center; background: var(--chip); color: var(--muted); font: 600 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; }
.lightbox { position: fixed; inset: 0; z-index: 100; background: #0b0c0d; display: grid; grid-template-rows: auto 1fr auto; color: #fff; }
.lightbox[hidden] { display: none; }
.lb-top { display: flex; justify-content: space-between; align-items: center; padding: 14px max(16px, env(safe-area-inset-left, 0px)); font-size: 14px; }
.lb-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 56px; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lightbox button { background: rgba(255,255,255,.12); border: 0; color: #fff; cursor: pointer; font-size: 22px; width: 44px; height: 44px; display: grid; place-items: center; }
.lightbox button:hover { background: rgba(255,255,255,.24); }
.lb-prev, .lb-next { position: absolute; top: 50%; transform: translateY(-50%); }
.lb-prev { left: 8px; } .lb-next { right: 8px; }
.lb-strip { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 16px; scrollbar-width: thin; }
.lb-strip img { height: 58px; aspect-ratio: 4 / 3; object-fit: cover; opacity: .55; cursor: pointer; flex: none; }
.lb-strip img.on { opacity: 1; outline: 2px solid var(--giallo); }
.car-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; align-items: start; }
.car-title { font: 800 clamp(32px, 4.4vw, 52px)/1 var(--f-display); text-transform: uppercase; margin: 22px 0 10px; }
.car-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14px; }
.car-box { position: sticky; top: 64px; background: var(--surface); border: 1px solid var(--line); padding: 20px; display: grid; gap: 12px; margin-top: 22px; }
.car-box .big { font: 500 34px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.car-box .btn { display: block; text-align: center; background: var(--ink); color: var(--surface); text-decoration: none; padding: 12px; font-weight: 600; font-size: 14px; }
.car-box .btn:hover { background: var(--rosso); }
.car-box .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.car-box .row span:first-child { color: var(--muted); }
.status { display: inline-block; justify-self: start; font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px; background: var(--ink); color: var(--surface); }
.status.sold { background: var(--up); color: #fff; } .status.unsold { background: var(--down); color: #fff; }
.status.live { background: var(--rosso); color: #fff; } .status.off_market { background: var(--muted); color: #fff; }
.specs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); border-top: 2px solid var(--ink); }
.specs-grid div { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 3px; }
.specs-grid span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.specs-grid b { font-weight: 500; overflow-wrap: anywhere; }
.car-sec { margin-top: 40px; }
.car-sec h2 { font-size: 26px; margin-bottom: 14px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--line); display: grid; gap: 18px; }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -29px; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.timeline li.sold::before { background: var(--up); border-color: var(--up); }
.timeline li.unsold::before { border-color: var(--down); }
.timeline li.listed::before, .timeline li.live::before { background: var(--ink); border-color: var(--ink); }
.ev { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 14px; align-items: start; }
.ev .when { font: 12px var(--f-mono); color: var(--muted); }
.ev h3 { font-size: 15px; margin: 4px 0; }
.ev .pr { font-weight: 600; }
.ev .sub { color: var(--muted); font-size: 13px; }
.ev a { color: var(--rosso); font-size: 13px; font-weight: 500; text-decoration: none; }
.ev .ph { border: 1px solid var(--line); }
.ev .n { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.7); color: #fff; font: 600 11px/1 var(--f-body); padding: 4px 6px; z-index: 1; }
.ev details { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.ev summary { cursor: pointer; color: var(--rosso); font-weight: 500; }

/* market chart, with a card for the listing under the pointer */
.mkt-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.mkt-stats div { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 4px; }
.mkt-stats span { font-size: 12px; color: var(--muted); }
.mkt-stats b { font: 500 18px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.mkt-controls { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { border: 0; background: var(--surface); padding: 6px 11px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { border: 1px solid var(--line); background: var(--surface); padding: 5px 10px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.keys button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.k { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.k-s { background: var(--rosso); } .k-u { border: 1.5px solid var(--rosso); } .k-f { background: var(--ink); } .k-a { background: #9aa1a8; }
.mkt { position: relative; }
.mkt svg { touch-action: pan-y; cursor: crosshair; }
.tip { position: absolute; z-index: 5; width: 230px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 12px 28px rgba(0,0,0,.18); pointer-events: none; font-size: 13px; }
.tip[hidden] { display: none; }
.tip .ph { aspect-ratio: 16 / 10; }
.tip .tb { padding: 10px 12px 12px; display: grid; gap: 3px; }
.tip b.t { font-weight: 600; font-size: 13px; line-height: 1.3; }
.tip .pr { font: 500 17px/1.2 var(--f-mono); }
.tip .sub { color: var(--muted); }
.tip .go { color: var(--rosso); font-weight: 500; }

/* model + sub pages */
.page-head { padding-block: 40px 28px; border-bottom: 1px solid var(--line); background: var(--surface); }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.crumbs a { text-decoration: none; color: var(--muted); }
.crumbs a:hover { color: var(--rosso); }
.page-head h1 { font: 800 clamp(44px, 7vw, 84px)/.9 var(--f-display); text-transform: uppercase; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin-top: 28px; border-top: 2px solid var(--ink); }
.kpi { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.kpi b { font: 500 24px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi > span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.chart-box { background: var(--surface); border: 1px solid var(--line); padding: 18px 12px 8px; }
.chart-box svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot-sold, .dot-unsold { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot-sold { background: var(--rosso); }
.dot-unsold { border: 1.5px solid var(--muted); }
.line-med { width: 18px; height: 2px; background: var(--ink); display: inline-block; }
.axis { fill: var(--muted); font: 11px var(--f-mono); }
.grid-line { stroke: var(--line); stroke-width: 1; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.prose { max-width: 66ch; font-size: 17px; }
.prose p { margin: 0 0 1em; }
.prose h3 { font: 700 22px/1.1 var(--f-display); text-transform: uppercase; margin: 1.6em 0 .5em; }
.prose h3:first-child { margin-top: 0; }

/* footer */
footer { padding-block: 40px 60px; color: var(--muted); font-size: 13px; }
.foot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
.foot nav { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.foot a { text-decoration: none; }
.foot a:hover { color: var(--ink); }
.health { display: grid; gap: 6px; }
.health div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.state { font: 600 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; }
.state.ok { color: var(--up); border: 1px solid var(--up); }
.state.degraded { color: #a06b00; border: 1px solid #a06b00; }
.state.down { color: var(--down); border: 1px solid var(--down); }

.loading { padding: 80px 0; color: var(--muted); }

@media (max-width: 860px) {
  .brief, .foot, .car-layout { grid-template-columns: minmax(0, 1fr); }
  .car-box { position: static; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; aspect-ratio: auto; gap: 4px; margin-left: -16px; margin-right: -16px; }
  .gallery button { flex: 0 0 88%; aspect-ratio: 4 / 3; scroll-snap-align: start; }
  .gallery.one button { flex-basis: 100%; }
  .gallery .count { display: none; }
  .gallery .count.m { display: block; }
  .ev { grid-template-columns: minmax(0, 1fr) 96px; }
  .lb-stage { padding: 0 8px; }
  .lb-prev, .lb-next { display: none !important; }
  .movers { grid-template-columns: minmax(0, 1fr); }
  .changes li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

<header class="site-head">
  <div class="wrap head-row">
    <a class="logo" href="#overview" aria-label="Rosso Market home">
      <span class="logo-mark" aria-hidden="true">RM</span>
      <span class="logo-word">Rosso <span>Market</span></span>
    </a>
    <nav class="main" aria-label="Main">
      <a href="#overview" data-nav="overview">Overview</a>
      <details class="models" id="models-menu">
        <summary>Models</summary>

      </details>

<div class="sample-bar" id="sample-bar" hidden><div class="wrap">Sample data. These figures come from the pipeline's demo source so you can see the layout. Live prices appear once the real sources are switched on.</div></div>
<main id="app"><div class="wrap loading">Loading market data</div></main>
<footer><div class="wrap foot" id="foot"></div></footer>
<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photos">
  <div class="lb-top"><span id="lb-count"></span><button type="button" id="lb-close" aria-label="Close photos">✕</button></div>
  <div class="lb-stage"><button type="button" class="lb-prev" id="lb-prev" aria-label="Previous photo">‹</button><img id="lb-img" alt="" referrerpolicy="no-referrer"><button type="button" class="lb-next" id="lb-next" aria-label="Next photo">›</button></div>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<script>
(() => {
  const app = document.getElementById("app");
  let D = null;
  const modelCache = {};
  const byId = {};

  // ------------------------------------------------------------ formatting
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => n == null ? "n/a" : "$" + Math.round(n).toLocaleString("en-US");
  const short = n => n == null ? "n/a" : n >= 1e6 ? "$" + (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M" : "$" + Math.round(n / 1e3) + "k";
  const miles = n => n == null ? "" : Math.round(n).toLocaleString("en-US") + " mi";
  const chg = (c, words) => {
    if (c == null) return '<span class="flat">steady</span>';
    if (Math.abs(c) < 0.05) return '<span class="flat">flat</span>';
    const dn = c < 0;
    return `<span class="${dn ? "down" : "up"} num">${dn ? "▼" : "▲"} ${Math.abs(c).toFixed(1)}%${words ? (dn ? " lower" : " higher") : ""}</span>`;
  };
  const dateLong = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  const endET = iso => {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
  };
  const plural = (n, w) => `${n.toLocaleString("en-US")} ${w}${n === 1 ? "" : "s"}`;

  // ------------------------------------------------------------ charts
  function spark(values, color) {
    if (!values || values.length < 2) return "";
    const w = 240, h = 54, min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const pts = values.map((v, i) => [i / (values.length - 1) * (w - 6) + 3, h - 6 - (v - min) / span * (h - 12)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${line}L${last[0]} ${h}L3 ${h}Z" fill="${color}" opacity=".08"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
  }

  function niceTicks(min, max, count) {
    const span = max - min || max || 1, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= count) || mag * 10;
    const out = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(v);
    return out;
  }

  function lineChart(points, opts = {}) {
    // points: [[isoDay, value], ...]
    if (!points || points.length < 2) return '<p class="flat">Not enough history yet. The chart fills in as daily runs accumulate.</p>';
    const W = 900, H = 300, L = 64, R = 18, T = 14, B = 34;
    const vals = points.map(p => p[1]);
    let min = Math.min(...vals), max = Math.max(...vals);
    const pad = (max - min) * 0.12 || max * 0.05;
    min -= pad; max += pad;
    const ticks = niceTicks(min, max, 4);
    min = Math.min(min, ticks[0]); max = Math.max(max, ticks[ticks.length - 1]);
    const t0 = Date.parse(points[0][0]), t1 = Date.parse(points[points.length - 1][0]);
    const x = d => L + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (W - L - R);
    const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
    const line = points.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
    const fmt = opts.fmt || short;
    const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("");
    const months = [];
    const d0 = new Date(t0);
    for (let d = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + 1)) months.push(d.toISOString().slice(0, 10));
    const xt = months.map(m => `<line class="grid-line" x1="${x(m)}" x2="${x(m)}" y1="${H - B}" y2="${H - B + 5}"/><text class="axis" x="${x(m)}" y="${H - 10}" text-anchor="middle">${new Date(m + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", timeZone: "UTC" })}</text>`).join("");
    const last = points[points.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Price history")}">
      ${grid}${xt}
      <path d="${line}L${x(last[0])} ${H - B}L${L} ${H - B}Z" fill="var(--rosso)" opacity=".07"/>
      <path d="${line}" fill="none" stroke="var(--rosso)" stroke-width="2"/>
      <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="var(--rosso)"/>
    </svg>`;
  }

  function heroChart(index) {
    if (!index || index.length < 2) return "";
    const W = 1200, H = 420, vals = index.map(p => p[1]);
    const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
    const pts = index.map((p, i) => [i / (index.length - 1) * W, 120 + (1 - (p[1] - min) / span) * (H - 190)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const rows = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="var(--hero-line)" stroke-width="1"/>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${rows}
      <path d="${line}L${W} ${H}L0 ${H}Z" fill="var(--giallo)" opacity=".06"/>
      <path d="${line}" fill="none" stroke="var(--giallo)" stroke-width="2" vector-effect="non-scaling-stroke" opacity=".85"/></svg>`;
  }

  // ------------------------------------------------------------ pieces
  const modelLink = id => `#model-${id}`;
  const familyName = f => f;

  function moverCard(m, i) {
    return `<a class="mover" href="${modelLink(m.id)}">
      <div class="mover-top"><span class="pos">P${i + 1}</span><span class="eyebrow">7 day move</span></div>
      <h3>${esc(m.name)}</h3>
      <div class="big">${chg(m.change_7d)}</div>
      ${spark((byId[m.id] || m).spark, m.direction === "down" ? "var(--down)" : "var(--up)")}
      <div class="meta"><span>Median ask <b class="num">${money(m.median)}</b></span><span>${plural(m.listings, "listing")}</span></div>
    </a>`;
  }

  // One photo per car, loaded from the source's own CDN. No referrer is sent (some CDNs refuse
  // other sites' referrers), and a broken or missing photo turns into a quiet placeholder.
  function photo(url, alt, chips) {
    const over = chips ? `<div class="chips">${chips}</div>` : "";
    if (!url) return `<div class="ph none">${over}</div>`;
    return `<div class="ph"><img src="${esc(url)}" alt="${esc(alt || "")}" loading="lazy" decoding="async" referrerpolicy="no-referrer"
      onerror="this.parentNode.classList.add('none');this.remove()">${over}</div>`;
  }

  let VIEW = "photos";
  try { VIEW = localStorage.getItem("rm-view") || "photos"; } catch (e) {}
  // Photo grid by default, a table one tap away. Lists can also offer a sort menu.
  // Both choices are remembered on this device.
  function switchable(el, items, cards, table, opts = {}) {
    const sorts = opts.sorts || [];
    let sortKey = sorts.length ? sorts[0][0] : null;
    try { const saved = localStorage.getItem("rm-sort-" + (opts.id || "")); if (sorts.some(x => x[0] === saved)) sortKey = saved; } catch (e) {}
    const draw = () => {
      const sorter = sorts.find(x => x[0] === sortKey);
      const list = sorter ? [...items].sort(sorter[2]) : items;
      el.innerHTML = `<div class="sec-tools">
        ${sorts.length ? `<label class="sort">Sort by <select aria-label="Sort listings">${sorts.map(([k, l]) => `<option value="${k}"${k === sortKey ? " selected" : ""}>${l}</option>`).join("")}</select></label>` : "<span></span>"}
        <div class="view-switch" role="group" aria-label="View">
        <button type="button" data-v="photos" aria-pressed="${VIEW === "photos"}">Photos</button><button type="button" data-v="table" aria-pressed="${VIEW === "table"}">Table</button></div></div>`
        + (VIEW === "table" ? table(list) : `<div class="lots">${list.map(cards).join("")}</div>`)
        + (opts.note ? `<p class="flat" style="font-size:13px;margin-top:14px">${opts.note}</p>` : "");
      el.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
        VIEW = b.dataset.v; try { localStorage.setItem("rm-view", VIEW); } catch (e) {}
        draw();
      }));
      const sel = el.querySelector(".sort select");
      if (sel) sel.addEventListener("change", () => {
        sortKey = sel.value; try { localStorage.setItem("rm-sort-" + (opts.id || ""), sortKey); } catch (e) {}
        draw(); el.querySelector(".sort select").focus();
      });
    };
    draw();
  }

  // Missing values (no mileage published, say) always sort to the end.
  const by = (f, dir = 1) => (a, b) => { const x = f(a), y = f(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return x < y ? -dir : x > y ? dir : 0; };
  const LISTING_SORTS = [
    ["price-asc", "Lowest price", by(l => l.price_usd)],
    ["price-desc", "Highest price", by(l => l.price_usd, -1)],
    ["newest", "Newest listing", by(l => l.first_seen, -1)],
    ["oldest", "Longest on the market", by(l => l.first_seen)],
    ["miles-asc", "Lowest mileage", by(l => l.mileage_mi)],
    ["miles-desc", "Highest mileage", by(l => l.mileage_mi, -1)],
  ];
  const daysListed = l => l.first_seen ? Math.max(0, Math.round((Date.parse(D.as_of) - Date.parse(l.first_seen)) / 864e5)) : null;

  // Cards and rows open our own car page. Only records without one go straight to the source.
  const carLink = l => l.car ? `href="#car-${l.car}"` : `href="${esc(l.url)}" target="_blank" rel="noopener"`;

  function listingCard(l) {
    const chips = l.certified ? '<span class="chip sold">Ferrari Approved</span>' : "";
    return `<a class="lot" ${carLink(l)}>
      ${photo(l.image, l.title, chips)}
      <div class="body"><h3>${esc(l.title)}</h3>
        <div class="specs">${[miles(l.mileage_mi), l.exterior_color].filter(Boolean).map(esc).join(" · ")}</div>
        <div class="house">${esc(l.dealer_name || l.marketplace || "")}${l.location ? ", " + esc(l.location) : ""}</div>
        <div class="bid"><div><div class="eyebrow">Asking</div><b>${money(l.price_usd)}</b></div><span>${l.first_seen ? "Listed " + dateLong(l.first_seen) : ""}<br>${esc(l.marketplace || "")}</span></div>
      </div></a>`;
  }

  function lotCard(l) {
    const chips = [];
    if (l.ending_soon) chips.push('<span class="chip hot">Ending soon</span>');
    if (l.no_reserve) chips.push('<span class="chip">No reserve</span>');
    if (l.status === "sold") chips.push('<span class="chip sold">Sold</span>');
    if (l.status === "unsold") chips.push('<span class="chip unsold">Not sold</span>');
    if (l.status === "upcoming") chips.push('<span class="chip">Upcoming</span>');
    let label, value;
    if (l.status === "live") { label = "Current bid"; value = money(l.price_usd); }
    else if (l.status === "upcoming") { label = "Estimate"; value = l.estimate_low_usd ? `${short(l.estimate_low_usd)} to ${short(l.estimate_high_usd)}` : "On request"; }
    else if (l.status === "sold") { label = "Sold for"; value = money(l.price_usd); }
    else { label = "High bid"; value = money(l.price_usd); }
    const est = l.status === "live" && l.estimate_low_usd ? ` Est. ${short(l.estimate_low_usd)} to ${short(l.estimate_high_usd)}` : "";
    const done = l.status === "sold" || l.status === "unsold";
    const when = !l.ends_at ? "" : done ? dateLong(l.ends_at.slice(0, 10)) : "Ends " + endET(l.ends_at);
    const vs = l.status === "sold" && l.vs_ask_pct != null ? `<div style="font-size:12px">${chg(l.vs_ask_pct)} vs median ask</div>` : "";
    return `<a class="lot" ${carLink(l)}>
      ${photo(l.image, l.title, chips.join(""))}
      <div class="body"><h3>${esc(l.title)}</h3>
      <div class="house">${esc(l.auction_house)}${l.location ? ", " + esc(l.location) : ""}${l.lot_number ? ", lot " + esc(l.lot_number) : ""}</div>
      ${l.mileage_mi ? `<div class="specs">${miles(l.mileage_mi)}</div>` : ""}
      <div class="bid"><div><div class="eyebrow">${label}</div><b>${value}</b></div><span>${when}${est}${vs}</span></div>
      </div></a>`;
  }

  function modelsTable(models, opts = {}) {
    return `<div class="tbl-wrap"><table class="sheet">
      <thead><tr>${opts.rank ? '<th class="p">Pos</th>' : ""}<th>Model</th><th class="r">For sale</th><th class="r">Median ask</th><th class="r">7 days</th><th class="r">Sold, 12 mo</th><th class="r">Median sold</th><th class="r">vs last year</th><th class="r">Sell through</th></tr></thead>
      <tbody>${models.map((m, i) => `<tr class="click" data-href="${modelLink(m.id)}">
        ${opts.rank ? `<td class="p">P${i + 1}</td>` : ""}
        <td class="name"><a href="${modelLink(m.id)}">${esc(m.name)}</a></td>
        <td class="r num">${m.listings || ""}</td><td class="r num">${m.median ? money(m.median) : ""}</td>
        <td class="r">${m.listings ? chg(m.change_7d) : ""}</td>
        <td class="r num">${(m.auction || {}).sold_12m || ""}</td><td class="r num">${(m.auction || {}).median_sold_12m ? money(m.auction.median_sold_12m) : ""}</td>
        <td class="r">${(m.auction || {}).change_yoy != null ? chg(m.auction.change_yoy) : ""}</td>
        <td class="r num">${(m.auction || {}).sell_through_12m != null ? m.auction.sell_through_12m + "%" : ""}</td></tr>`).join("")}</tbody></table></div>`;
  }

  // ------------------------------------------------------------ views
  function viewOverview(scrollTo) {
    const b = D.brief;
    const mv = D.movers;
    const nModels = D.models.length;
    const live = D.auctions.live;
    const ix = D.index;
    const ixLast = ix.length ? ix[ix.length - 1][1] : null;
    const ixChange = ix.length > 1 ? (ixLast / ix[0][1] - 1) * 100 : null;
    const ix30 = ix.length > 30 ? (ixLast / ix[ix.length - 31][1] - 1) * 100 : null;

    app.innerHTML = `
    <section class="hero">
      <div class="hero-chart">${heroChart(ix)}</div>
      <div class="wrap">
        <div class="eyebrow"><span class="dot"></span>As of ${dateLong(D.as_of)}, ${esc(D.region)}</div>
        <h1>Rosso<br><span>Market</span></h1>
        <p class="lede">Daily asking prices, auction results and market intelligence for every Ferrari for sale in the US and Canada, from the 308 to the SF90.</p>
        <div class="hero-index">
          <div><b>${ixLast ? ixLast.toFixed(1) : "n/a"}</b><small>Ask index, 90 days ago = 100</small></div>
          <div><b>${ix30 == null ? "n/a" : (ix30 < 0 ? "▼ " : "▲ ") + Math.abs(ix30).toFixed(1) + "%"}</b><small>Last 30 days</small></div>
          <div><b>${b.tracked_listings.toLocaleString("en-US")}</b><small>Ferraris tracked today</small></div>
        </div>
      </div>
    </section>
    <div class="jump"><div class="wrap jump-scroll"><div class="jump-row" role="navigation" aria-label="Sections">
      ${[["brief", "Market Brief"], ["movers", "Market Movers"], ["families", "Models"], ["insights", "Insights"], ["news-sec", "News"], ["auctions-sec", "Auctions"]]

  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // ------------------------------------------------------------ market chart
  // Every sale, high bid and asking price for a model on one chart, like classic.com.
  // Hover (or tap) a dot to see which car it is. Click it to open that car.
  const KINDS = { s: ["Sold", "k-s"], u: ["High bid", "k-u"], f: ["For sale", "k-f"], a: ["Last asking price", "k-a"] };
  function marketChart(el, points, opts = {}) {
    if (!points.length) { el.innerHTML = '<div class="empty">No dated sales or asking prices yet.</div>'; return; }
    const span = (Date.parse(points[points.length - 1][0]) - Date.parse(points[0][0])) / 864e5;
    let range = span > 3 * 365 ? "3y" : "all";
    const shown = { s: true, u: true, f: true, a: true };
    const have = new Set(points.map(p => p[2]));
    el.innerHTML = `<div class="mkt-stats" id="ms"></div>
      <div class="mkt-controls">
        <div class="seg" role="group" aria-label="Time range">${[["1y", "1 year"], ["3y", "3 years"], ["5y", "5 years"], ["all", "All"]].map(([k, l]) => `<button type="button" data-r="${k}">${l}</button>`).join("")}</div>
        <div class="keys" role="group" aria-label="Show">${Object.entries(KINDS).filter(([k]) => have.has(k)).map(([k, [l, c]]) => `<button type="button" data-k="${k}" aria-pressed="true"><i class="k ${c}"></i>${l}</button>`).join("")}<span class="legend" style="align-self:center"><span><i class="line-med"></i>Median sold</span></span></div>
      </div>
      <div class="chart-box mkt"><div class="cv"></div><div class="tip" hidden></div></div>`;
    const cv = el.querySelector(".cv"), tip = el.querySelector(".tip"), box = el.querySelector(".mkt");
    let vis = [], pos = [], sel = -1, svg = null;
    const W = 900, H = 340, L = 64, R = 18, T = 14, B = 34;

    function draw() {
      el.querySelectorAll("[data-r]").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === range));
      const last = points[points.length - 1][0];
      const cut = range === "all" ? "" : (() => { const d = new Date(last + "T12:00:00Z"); d.setUTCFullYear(d.getUTCFullYear() - +range[0]); return d.toISOString().slice(0, 10); })();
      vis = points.filter(p => p[0] >= cut && shown[p[2]]);
      const sold = vis.filter(p => p[2] === "s").map(p => p[1]).sort((a, b) => a - b);
      const med = sold.length ? sold[Math.floor(sold.length / 2)] : null;
      const lastSold = [...vis].reverse().find(p => p[2] === "s");
      el.querySelector("#ms").innerHTML = [["Median sold", med ? money(med) : "n/a"], ["Sales", sold.length], ["Lowest sale", sold.length ? money(sold[0]) : "n/a"],
        ["Top sale", sold.length ? money(sold[sold.length - 1]) : "n/a"], ["Most recent", lastSold ? money(lastSold[1]) : "n/a"],
        ["For sale now", vis.filter(p => p[2] === "f").length]].map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
      if (!vis.length) { cv.innerHTML = '<p class="flat" style="padding:20px">Nothing to show for this range.</p>'; pos = []; return; }
      const prices = vis.map(p => p[1]).sort((a, b) => a - b);
      const lo = prices[Math.floor(prices.length * 0.02)], hi = prices[Math.min(prices.length - 1, Math.ceil(prices.length * 0.98) - 1)];
      const ticks = niceTicks(lo * 0.9, hi * 1.08, 4);
      const min = Math.min(ticks[0], lo * 0.9), max = Math.max(ticks[ticks.length - 1], hi * 1.08);
      const t0 = Date.parse(vis[0][0]), t1 = Math.max(Date.parse(vis[vis.length - 1][0]), t0 + 864e5 * 30);
      const x = d => L + (Date.parse(d) - t0) / (t1 - t0) * (W - L - R);
      const y = v => T + (1 - (Math.min(Math.max(v, min), max) - min) / (max - min)) * (H - T - B);
      const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
      const days = (t1 - t0) / 864e5, xt = [];
      if (days > 500) { for (let yr = new Date(t0).getUTCFullYear() + 1; Date.UTC(yr, 0, 1) <= t1; yr++) xt.push([`${yr}-01-01`, yr]); }
      else { const d0 = new Date(t0); for (let d = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + (days > 200 ? 2 : 1))) { const iso = d.toISOString().slice(0, 10); xt.push([iso, d.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }) + (d.getUTCMonth() === 0 ? " " + d.getUTCFullYear() : "")]); } }
      const xg = xt.map(([d, l]) => `<line class="grid-line" x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H - B}"/><text class="axis" x="${x(d)}" y="${H - 10}" text-anchor="middle">${l}</text>`).join("");
      pos = vis.map(p => [x(p[0]), y(p[1])]);
      const order = { a: 0, u: 1, f: 2, s: 3 };
      const idx = vis.map((p, i) => i).sort((i, j) => order[vis[i][2]] - order[vis[j][2]]);
      const dots = idx.map(i => {
        const p = vis[i], [cx, cy] = pos[i], me = opts.highlight && p[3] === opts.highlight;
        const r = me ? 7 : 4.2;
        const style = p[2] === "s" ? 'fill="var(--rosso)" fill-opacity=".8"' : p[2] === "u" ? 'fill="var(--surface)" stroke="var(--rosso)" stroke-width="1.6"'
          : p[2] === "f" ? 'fill="var(--ink)" fill-opacity=".85"' : 'fill="#9aa1a8" fill-opacity=".8"';
        return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" ${style}${me ? ' stroke="var(--giallo)" stroke-width="3"' : ""}/>`;
      }).join("");
      const sp = vis.map((p, i) => [p, i]).filter(([p]) => p[2] === "s");
      let path = "";
      if (sp.length >= 6) {
        const m = a => { const q = [...a].sort((u, v) => u - v); return q[Math.floor(q.length / 2)]; };
        path = sp.map(([p], i) => [p[0], m(sp.slice(Math.max(0, i - 8), i + 1).map(([q]) => q[1]))]).slice(4)
          .map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
      }
      cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Market")}">${grid}${xg}
        ${path ? `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-opacity=".75"/>` : ""}${dots}<circle class="ring" r="9" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg>`;
      svg = cv.querySelector("svg");
      sel = -1; tip.hidden = true;
    }

    function nearest(e) {
      if (!svg || !pos.length) return -1;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = -1, bd = 1e9;
      pos.forEach(([px, py], i) => { const d = (px - q.x) ** 2 + (py - q.y) ** 2; if (d < bd) { bd = d; best = i; } });
      return bd < 22 * 22 ? best : -1;
    }
    function show(i) {
      sel = i;
      const ring = svg.querySelector(".ring");
      if (i < 0) { tip.hidden = true; ring.style.display = "none"; return; }
      const p = vis[i], [cx, cy] = pos[i];
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.style.display = "";
      tip.innerHTML = `${p[5] ? photo(p[5], p[4]) : ""}<div class="tb"><b class="t">${esc(p[4] || "")}</b><span class="pr">${money(p[1])}</span>
        <span class="sub">${KINDS[p[2]][0]}${p[6] ? ", " + esc(p[6]) : ""}</span><span class="sub">${dateLong(p[0])}</span>${p[3] ? '<span class="go">Open this car →</span>' : ""}</div>`;
      tip.hidden = false;
      const sr = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
      const px = sr.left - br.left + cx / W * sr.width, py = sr.top - br.top + cy / H * sr.height;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = px + 16, top = py - h / 2;
      if (left + w > br.width - 4) left = px - w - 16;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, Math.min(top, br.height - h - 4)) + "px";
    }
    cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const i = nearest(e); if (i !== sel) show(i); } });
    cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(-1); });
    cv.addEventListener("click", e => {
      const i = nearest(e);
      if (i < 0) return show(-1);
      // mouse: the card is already showing, so a click opens the car. Touch: first tap shows it.
      if (i === sel && vis[i][3]) location.hash = "car-" + vis[i][3];
      else show(i);
    });
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { range = b.dataset.r; draw(); }));
    el.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
      shown[b.dataset.k] = !shown[b.dataset.k]; b.setAttribute("aria-pressed", shown[b.dataset.k]); draw();
    }));
    draw();
  }

  // ------------------------------------------------------------ photos viewer
  let LB = { list: [], i: 0 };

  // ------------------------------------------------------------ car page
  const STATUS = { for_sale: "For sale", live: "Live auction", upcoming: "Upcoming auction", sold: "Sold", unsold: "Not sold", off_market: "Off market" };
  async function viewCar(id) {
    app.innerHTML = '<div class="wrap loading">Loading this car</div>';
    let c;
    try { const r = await fetch(`data/cars/${id}.json`); if (!r.ok) throw 0; c = await r.json(); }
    catch (e) { return notFound(); }
    if (location.hash !== "#car-" + id) return;
    const m = byId[c.model.id] || {};
    const ph = c.photos || [];
    const gal = !ph.length ? '<div class="gallery none">No photos for this car</div>'
      : `<div class="gallery${ph.length < 3 ? " one" : ""}">${ph.slice(0, ph.length < 3 ? 1 : 5).map((u, i) => `<button type="button" data-p="${i}" aria-label="Open photo ${i + 1}"><img src="${esc(u)}" alt="${i ? "" : esc(c.title)}" ${i ? 'loading="lazy"' : ""} referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">${i === Math.min(4, ph.length - 1) && ph.length > 1 ? `<span class="count">${ph.length} photos</span>` : ""}${i === 0 && ph.length > 1 ? `<span class="count m">${ph.length} photos</span>` : ""}</button>`).join("")}</div>`;
    const priceTxt = c.status === "upcoming" && c.estimate ? `${short(c.estimate[0])} to ${short(c.estimate[1])}` : c.price ? money(c.price) : "Not published";
    const when = c.status === "live" || c.status === "upcoming" ? (c.ends_at ? "Ends " + endET(c.ends_at) : "") : c.date ? dateLong(c.date) : "";
    const ext = c.url ? `<a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">${c.status === "for_sale" ? "Contact seller on" : "View lot on"} ${esc(c.where || "source")} ↗</a>` : "";
    const ask = c.market && c.market.median_ask;
    const vsAsk = ask && c.price && c.status !== "upcoming" ? chg((c.price / ask - 1) * 100) : "";
    app.innerHTML = `<div class="page-head" style="padding-block:24px 30px"><div class="wrap">
        <div class="crumbs"><a href="#overview">Overview</a> / ${m.family ? `<a href="#family-${slug(m.family)}">${esc(m.family)}</a> / ` : ""}<a href="#model-${esc(c.model.id)}">${esc(c.model.name)}</a></div>
        ${gal}
        <div class="car-layout"><div>
          <h1 class="car-title">${esc(c.title)}</h1>
          <div class="car-meta">${c.vin ? `<span>VIN <span class="num">${esc(c.vin)}</span></span>` : ""}${c.location ? `<span>${esc(c.location)}</span>` : ""}${when ? `<span>${when}</span>` : ""}</div>
        </div>
        <aside class="car-box">
          <span class="status ${c.status}">${STATUS[c.status] || c.status}</span>
          <div><div class="eyebrow">${esc(c.price_label || "")}</div><div class="big">${priceTxt}</div>${vsAsk ? `<div style="font-size:13px;margin-top:4px">${vsAsk} vs median ask</div>` : ""}</div>
          ${c.no_reserve ? '<span class="chip" style="justify-self:start">No reserve</span>' : ""}${c.certified ? '<span class="chip sold" style="justify-self:start">Ferrari Approved</span>' : ""}
          <div class="row"><span>${c.status === "for_sale" || c.status === "off_market" ? "Seller" : "Auction house"}</span><span>${esc(c.seller || "")}</span></div>
          ${ask ? `<div class="row"><span>Median ask, ${esc(c.model.name)}</span><span class="num">${money(ask)}</span></div>` : ""}
          ${(m.auction || {}).median_sold_12m ? `<div class="row"><span>Median sold, 12 months</span><span class="num">${money(m.auction.median_sold_12m)}</span></div>` : ""}
          ${ext}
          <a class="link-more" href="#model-${esc(c.model.id)}">All ${esc(c.model.name)} prices →</a>
        </aside></div>
      </div></div>
      <section class="block" style="padding-top:36px"><div class="wrap car-layout"><div>
        <div class="car-sec" style="margin-top:0"><h2>Key specs</h2><div class="specs-grid">${c.specs.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div></div>
        <div class="car-sec"><h2>Vehicle history</h2><p class="flat" style="margin:-6px 0 16px;font-size:14px">Every time we have seen this car${c.vin ? ", matched by VIN" : ""}.</p>
          <ol class="timeline">${c.history.map(e => {
            const p = e.kind === "upcoming" && e.estimate ? `${short(e.estimate[0])} to ${short(e.estimate[1])}` : e.price ? money(e.price) : "not published";
            const seen = (e.seen_on || []).length > 1 ? `<details><summary>Seen on ${e.seen_on.length} sites</summary>${e.seen_on.map(x => `<div><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.where)} ↗</a></div>`).join("")}</details>` : "";
            const changes = (e.changes || []).length > 1 ? `<details><summary>${e.changes.length - 1} price change${e.changes.length > 2 ? "s" : ""}</summary>${e.changes.map(([d, v]) => `<div><span class="num">${dateLong(d)}</span> &nbsp; <b class="num">${money(v)}</b></div>`).join("")}</details>` : "";
            return `<li class="${e.kind}"><div class="ev"><div>
              <div class="when">${e.date ? dateLong(e.date) : "Date not published"}${e.end ? " to " + dateLong(e.end) : ""}</div>
              <h3>${esc(e.label)}</h3><div><span class="sub">${esc(e.price_label)}:</span> <span class="pr num">${p}</span></div>
              <div class="sub">${[e.mileage ? miles(e.mileage) : "", e.location || "", e.lot_number ? "lot " + e.lot_number : "", e.bids ? e.bids + " bids" : ""].filter(Boolean).map(esc).join(" · ")}</div>
              ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">View source ↗</a>` : ""}</div>
              <div style="position:relative">${photo(e.photo, "")}${e.n_photos > 1 ? `<span class="n">${e.n_photos}</span>` : ""}</div>${seen}${changes}</div></li>`;
          }).join("")}</ol></div>
        <div class="car-sec"><h2>${esc(c.model.name)} market</h2><p class="flat" style="margin:-6px 0 16px;font-size:14px">This car is ringed in yellow. Hover a dot to see which car it is.</p><div id="car-mkt"><p class="flat">Loading the market</p></div></div>
        ${c.comps.length ? `<div class="car-sec"><h2>Recent ${esc(c.model.name)} sales</h2><div class="lots">${c.comps.map(x => `<a class="lot" ${carLink({ car: x.id, url: "#" })}>${photo(x.image, x.title, '<span class="chip sold">Sold</span>')}
          <div class="body"><h3>${esc(x.title)}</h3><div class="house">${esc(x.house || "")}</div>${x.mileage ? `<div class="specs">${miles(x.mileage)}</div>` : ""}
          <div class="bid"><div><div class="eyebrow">Sold for</div><b>${money(x.price)}</b></div><span>${dateLong(x.date)}</span></div></div></a>`).join("")}</div></div>` : ""}
      </div><div></div></div></section>`;
    app.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => openPhotos(ph, +b.dataset.p)));
    window.scrollTo(0, 0);
    let detail = modelCache[c.model.id];
    if (!detail) { try { detail = modelCache[c.model.id] = await (await fetch(`data/models/${c.model.id}.json`)).json(); } catch (e) { detail = null; } }
    if (location.hash !== "#car-" + id) return;
    const mk = document.getElementById("car-mkt");
    if (detail) marketChart(mk, detail.points || [], { highlight: c.id, label: `${c.model.name} market` });
    else mk.innerHTML = '<p class="flat">Could not load the market for this model.</p>';
  }

  function viewFamily(s) {
    const f = D.families.find(x => x.slug === s);
    if (!f) return notFound();
    const models = f.models.map(id => byId[id]).filter(Boolean)
      .sort((a, b) => (b.listings - a.listings) || (((b.auction || {}).sold_12m || 0) - ((a.auction || {}).sold_12m || 0)));
    const med = models.reduce((a, m) => a + m.listings, 0);
    app.innerHTML = pageHead(esc(f.name), esc(f.name), esc(f.signal) + ".", [[med, "For sale now"], [f.sold_12m || 0, "Auction sales, 12 months"], [models.length, "Models"]])
      + `<section class="block"><div class="wrap">${modelsTable(models)}</div></section>`;
    wireRows(); window.scrollTo(0, 0);
  }

  function viewAuctions() {
    const a = D.auctions;
    const tabs = [["live", "Live", a.live], ["upcoming", "Upcoming", a.upcoming], ["results", "Results, 90 days", a.results]];
    const houses = Object.entries(a.houses).sort((x, y) => (y[1].live + y[1].results_30d) - (x[1].live + x[1].results_30d));
    const sold = a.results.filter(r => r.status === "sold"), closed = a.results.filter(r => r.ends_at && r.ends_at.slice(0, 10) > daysAgo(30));
    const rate = closed.length ? Math.round(closed.filter(r => r.status === "sold").length / closed.length * 100) + "%" : "n/a";
    app.innerHTML = pageHead("Auctions", "Auctions", "Live and recent Ferrari lots from Bring a Trailer, Cars &amp; Bids, PCARMARKET, Sotheby's Motorsport, duPont Registry Live, RM Sotheby's, Gooding Christie's, Bonhams, Broad Arrow and Mecum. Photos link to the original lot. Times are US Eastern.",
      [[a.live.length, "Live now"], [a.upcoming.length, "Upcoming"], [sold.length, "Sold, 90 days"], [rate, "Sell through, 30 days"]])
      + `<section class="block"><div class="wrap">
        <div class="tabs" role="tablist">${tabs.map(([k, l, arr], i) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${i === 0}" data-tab="${k}">${l} (${arr.length})</button>`).join("")}</div>
        <div id="tab-body"></div></div></section>
        <section class="block"><div class="wrap"><div class="sec-head"><div><div class="eyebrow">By house</div><h2>Where Ferraris are selling</h2></div></div>
        <div class="tbl-wrap"><table class="sheet"><thead><tr><th>Auction house</th><th class="r">Live now</th><th class="r">Results, 30 days</th></tr></thead><tbody>
        ${houses.map(([h, v]) => `<tr><td class="name">${esc(h)}</td><td class="r num">${v.live}</td><td class="r num">${v.results_30d}</td></tr>`).join("")}</tbody></table></div></div></section>`;
    const show = k => {
      app.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === k));
      const arr = tabs.find(t => t[0] === k)[2];
      const body = document.getElementById("tab-body");
      const table = items => `<div class="tbl-wrap"><table class="sheet"><thead><tr><th></th><th>Lot</th><th>House</th><th>${k === "results" ? "Closed" : "Ends"}</th><th>Result</th><th class="r">Price</th><th class="r">vs median ask</th></tr></thead><tbody>
          ${items.map(r => `<tr><td class="thumb">${photo(r.image, "")}</td><td class="name"><a ${carLink(r)}>${esc(r.title)}</a></td><td>${esc(r.auction_house)}</td><td class="num">${r.ends_at ? dateLong(r.ends_at.slice(0, 10)) : ""}</td>
          <td>${r.status === "sold" || r.status === "unsold" ? `<span class="chip ${r.status}">${r.status === "sold" ? "Sold" : "Not sold"}</span>` : `<span class="chip">${r.status === "live" ? "Live" : "Upcoming"}</span>`}</td>
          <td class="r num">${r.status === "upcoming" ? (r.estimate_low_usd ? short(r.estimate_low_usd) + " to " + short(r.estimate_high_usd) : "") : money(r.price_usd)}</td><td class="r">${r.status === "sold" ? chg(r.vs_ask_pct) : ""}</td></tr>`).join("")}</tbody></table></div>`;
      if (!arr.length) body.innerHTML = '<div class="empty">Nothing here right now.</div>';
      else switchable(body, arr, lotCard, table);
    };
    app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
    show("live"); window.scrollTo(0, 0);
  }
  const daysAgo = n => { const d = new Date(D.as_of + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); };

  function viewNews() {
    app.innerHTML = pageHead("News", "News", "Ferrari headlines from the outlets we follow. Every story links to the original.")
      + `<section class="block"><div class="wrap">${newsList(D.news)}</div></section>`;
    window.scrollTo(0, 0);
  }

  function viewMethodology() {
    const r = D.rules;
    app.innerHTML = pageHead("Methodology", "How we count", "Where the numbers come from and what each one means.")
      + `<section class="block"><div class="wrap"><div class="prose">
        <h3>Sources</h3>
        <p>Asking prices come from the Ferrari dealer network's own used inventory, including cars certified under Ferrari Approved, and from dealer marketplaces: AutoTrader in the US and Canada and duPont Registry. Auction results come from Bring a Trailer, Cars &amp; Bids, Sotheby's Motorsport, duPont Registry Live, RM Sotheby's and Mecum. We collect once a day.</p>
        <h3>One car, one count</h3>
        <p>The same car is often listed on several sites at once. We match cars by VIN, then by chassis number for older cars, then by model, year, mileage, colour and seller. Each physical car moves the numbers once. When one car shows two prices, the selling dealer's own price wins.</p>
        <h3>Median ask</h3>
        <p>The middle asking price of every tracked car of a model on a given day. Cars listed as price on request are left out. A listing counts as gone after two successful daily checks in a row without it.</p>
        <h3>Market movers</h3>
        <p>A model whose median ask moved ${r.mover_min_pct}% or more against a week earlier, with at least ${r.mover_min_cars} cars for sale on both days, and where the cars listed on both days mostly repriced in the same direction. A batch of cheaper cars arriving does not count as a move.</p>
        <h3>Auction results</h3>
        <p>Houses report prices differently. Bring a Trailer, Cars &amp; Bids, Sotheby's Motorsport and duPont Registry Live show the winning bid. RM Sotheby's and Mecum include the buyer's premium. Prices in pounds, euros or francs are converted to US dollars at the day's rate. A result far outside the model's asking range is kept on its model page but left out of the headline insights, because it is more often a data error than a real sale.</p>
        <h3>What these numbers are not</h3>
        <p>Asking prices are what sellers hope to get. They are not appraisals or offers, and individual cars vary with mileage, history and specification.</p>
      </div></div></section>`;
    window.scrollTo(0, 0);
  }

  function viewPrivacy() {
    app.innerHTML = pageHead("Privacy", "Privacy", "")
      + `<section class="block"><div class="wrap"><div class="prose">
        <p>Rosso Market does not ask you for an account and does not collect personal information. We do not use advertising or tracking cookies.</p>
        <p>Our host keeps standard server logs, such as IP address and pages requested, for security and to keep the site running. If we add privacy friendly visitor counts later, this page will say so.</p>
        <p>Listings and auction results shown here are about cars, gathered from public pages and licensed data. We do not publish sellers' or buyers' personal details. Links take you to the original listing, where that site's own privacy policy applies.</p>
      </div></div></section>`;
    window.scrollTo(0, 0);
  }

  function notFound() {
    app.innerHTML = `<section class="block"><div class="wrap"><h2>Page not found</h2><p><a class="link-more" href="#overview">Back to the overview</a></p></div></section>`;
  }

  function wireRows() {
    app.querySelectorAll("tr[data-href]").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a")) location.hash = tr.dataset.href.slice(1); }));
  }

  // ------------------------------------------------------------ chrome
  function buildMenu() {
    document.getElementById("menu-grid").innerHTML = D.families.map(f => `<div><h4>${esc(f.name)}</h4>
      ${f.models.map(id => byId[id]).filter(Boolean).map(m => `<a href="${modelLink(m.id)}"><span>${esc(m.name)}</span><span class="num">${m.listings || (m.auction || {}).sold_12m || ""}</span></a>`).join("")}</div>`).join("");
  }

  function buildFooter() {
    const h = D.health || [];
    document.getElementById("foot").innerHTML = `<div>
      <a class="logo" href="#overview"><span class="logo-mark" aria-hidden="true">RM</span><span class="logo-word">Rosso <span>Market</span></span></a>
      <nav aria-label="Footer"><a href="#overview">Overview</a><a href="#auctions">Auctions</a><a href="#news">News</a><a href="#methodology">Methodology</a><a href="#privacy">Privacy</a></nav>
      <p style="margin-top:18px;max-width:60ch">Rosso Market is independent and is not affiliated with or endorsed by Ferrari S.p.A. Prices are asking prices and auction results gathered from public sources and licensed data feeds. They can contain errors and are not an offer or a valuation.</p>
      <p>Data as of ${dateLong(D.as_of)}.</p></div>
      <div><div class="eyebrow" style="margin-bottom:10px">Data sources, last run</div><div class="health">
      ${h.map(s => `<div><span>${esc(s.source)}${s.accepted != null ? ` <span class="num">(${s.accepted})</span>` : ""}</span><span class="state ${s.state}">${s.state}</span></div>`).join("") || "<div>No runs yet</div>"}</div></div>`;
  }

  function route() {
    const h = location.hash.slice(1) || "overview";
    document.getElementById("models-menu").open = false;
    document.querySelectorAll("nav.main [data-nav]").forEach(a => a.dataset.nav === h ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    if (h === "overview") return viewOverview();
    if (h.startsWith("model-")) return viewModel(h.slice(6));
    if (h.startsWith("car-")) return viewCar(h.slice(4));
    if (h.startsWith("family-")) return viewFamily(h.slice(7));
    if (h === "auctions") return viewAuctions();
    if (h === "news") return viewNews();
    if (h === "methodology") return viewMethodology();
    if (h === "privacy") return viewPrivacy();
    notFound();
  }

  document.addEventListener("click", e => {
    const menu = document.getElementById("models-menu");
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });
  document.addEventListener("keydown", e => {
    if (!lb().hidden) {
      if (e.key === "Escape") closePhotos();
      if (e.key === "ArrowRight") showPhoto(LB.i + 1);
      if (e.key === "ArrowLeft") showPhoto(LB.i - 1);
      return;
    }
    if (e.key === "Escape") document.getElementById("models-menu").open = false;
  });
  document.getElementById("lb-close").addEventListener("click", closePhotos);
  document.getElementById("lb-prev").addEventListener("click", () => showPhoto(LB.i - 1));
  document.getElementById("lb-next").addEventListener("click", () => showPhoto(LB.i + 1));
  document.getElementById("lb-strip").addEventListener("click", e => { if (e.target.dataset.j) showPhoto(+e.target.dataset.j); });
  document.getElementById("lb-img").addEventListener("click", () => showPhoto(LB.i + 1));
  let sx = null;
  lb().addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  lb().addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) showPhoto(LB.i + (dx < 0 ? 1 : -1)); sx = null; });
  window.addEventListener("hashchange", () => { if (!lb().hidden) closePhotos(); });

  fetch("data/site.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    D = data;
    D.models.forEach(m => byId[m.id] = m);
    document.getElementById("sample-bar").hidden = !D.sample;
    buildMenu(); buildFooter();
    window.addEventListener("hashchange", route);
    route();
  }).catch(() => {
    app.innerHTML = '<div class="wrap loading">Market data could not be loaded. Run the pipeline to create data/site.json, then serve this folder over HTTP.</div>';
  });
})();
</script>
