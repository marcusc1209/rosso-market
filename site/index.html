<title>Rosso Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Daily asking prices for every Ferrari for sale in the US and every hypercar for sale worldwide, with auction results from around the world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a race timing sheet. One dark "timing screen" hero carries the market index,
   everything below is quiet paper with tabular figures, ranked like positions. */
:root {
  --bg: #f3f4f5;
  --surface: #ffffff;
  --ink: #15171a;
  --muted: #5b6168;
  --line: #d9dce0;
  --chip: #eaecee;
  --rosso: #c4161c;
  --giallo: #f2c200;
  --ask: #1d6fd6;
  --up: #17734a;
  --down: #b3261e;
  --hero-bg: #111316;
  --hero-fg: #f1f2f3;
  --hero-muted: #98a0a9;
  --hero-line: #2a2e33;
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --wrap: 1600px;
  --gutter: clamp(16px, 3.2vw, 56px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f11; --surface: #15181b; --ink: #e8eaec; --muted: #99a0a8; --line: #2a2f34; --chip: #1e2226;
    --rosso: #ef4a4f; --up: #48c08b; --down: #f0676b; --hero-bg: #07080a; --hero-line: #23272c; --ask: #5ea4ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f11; --surface: #15181b; --ink: #e8eaec; --muted: #99a0a8; --line: #2a2f34; --chip: #1e2226;
  --rosso: #ef4a4f; --up: #48c08b; --down: #f0676b; --hero-bg: #07080a; --hero-line: #23272c; --ask: #5ea4ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rosso); outline-offset: 2px; }
.wrap { max-width: calc(var(--wrap) + 2 * var(--gutter)); margin: 0 auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 700 clamp(26px, 3.4vw, 36px)/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase; }
h3 { font: 600 17px/1.3 var(--f-body); }

/* ---------- header */
.site-head { background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
.head-row { display: flex; align-items: center; gap: 24px; min-height: 64px; flex-wrap: wrap; padding-block: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-mark { width: 30px; height: 30px; display: grid; place-items: center; background: var(--giallo); color: #111; font: 800 15px/1 var(--f-display); letter-spacing: .02em; }
.logo-word { font: 800 21px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.logo-word span { color: var(--rosso); }
nav.main { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; }
nav.main a, nav.main summary { padding: 8px 10px; text-decoration: none; font-weight: 500; font-size: 14px; color: var(--muted); cursor: pointer; border-radius: 2px; list-style: none; }
nav.main summary::-webkit-details-marker { display: none; }
nav.main a:hover, nav.main summary:hover, nav.main a[aria-current="page"] { color: var(--ink); }
nav.main a[aria-current="page"], nav.main summary.current, details.models[open] summary { box-shadow: inset 0 -2px 0 var(--rosso); color: var(--ink); }
details.models { position: static; }
details.models summary::after { content: " \25BE"; font-size: 11px; }
.menu { position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 18px 30px rgba(0,0,0,.08); }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px 28px; padding-block: 22px 26px; }
.menu-grid h4 { margin: 0 0 8px; font: 600 11px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.menu-grid a { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; text-decoration: none; font-size: 14px; }
.menu-grid a:hover span:first-child { color: var(--rosso); }
.menu-grid a span:last-child { color: var(--muted); font-size: 12px; }

.search { position: relative; margin-left: auto; flex: 0 1 290px; }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 9px 12px; font: 14px/1.2 var(--f-body); border-radius: 2px; }
.search input:focus { outline: 2px solid var(--rosso); outline-offset: -1px; border-color: transparent; }
.sres { position: absolute; right: 0; top: calc(100% + 6px); width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); box-shadow: 0 18px 30px rgba(0,0,0,.14); z-index: 30; max-height: 70vh; overflow: auto; }
.sres a { display: grid; gap: 2px; padding: 10px 14px; text-decoration: none; border-bottom: 1px solid var(--line); }
.sres a:last-child { border-bottom: 0; }
.sres a:hover, .sres a.on { background: var(--chip); }
.sres b { font-weight: 600; font-size: 14px; }
.sres span { font-size: 12px; color: var(--muted); }
.sres .vin { font-family: var(--f-mono); color: var(--ink); }
.sres .vin mark { background: var(--giallo); color: #111; }
.sres p { margin: 0; padding: 12px 14px; font-size: 13px; color: var(--muted); }
@media (max-width: 860px) {
  /* phone and tablet: logo and search share the first row, the menu scrolls sideways under them */
  .head-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; min-height: 0; padding-block: 10px 0; }
  .logo { grid-row: 1; grid-column: 1; }
  .search { margin-left: 0; flex: none; grid-row: 1; grid-column: 2; justify-self: end; width: 100%; max-width: 380px; }
  .sres { left: auto; right: 0; width: min(420px, calc(100vw - 2 * var(--gutter))); }
  nav.main { grid-row: 2; grid-column: 1 / -1; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter)); padding-inline: calc(var(--gutter) - 10px); }
  nav.main::-webkit-scrollbar { display: none; }
  nav.main a, nav.main summary { white-space: nowrap; padding: 11px 10px; }
}
@media (max-width: 400px) { .logo-word { font-size: 18px; } .logo { gap: 8px; } }

.sample-bar { background: var(--giallo); color: #1a1a1a; font-size: 13px; }
.sample-bar .wrap { padding-block: 8px; }

/* ---------- hero */
.hero { background: var(--hero-bg); color: var(--hero-fg); position: relative; overflow: hidden; }
.hero .wrap { position: relative; padding-block: 56px 40px; display: grid; gap: 18px; }
.hero-chart { position: absolute; inset: 0; opacity: .9; pointer-events: none; }
.hero-chart svg { width: 100%; height: 100%; display: block; }
.hero .eyebrow { color: var(--hero-muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--giallo); display: inline-block; }
.hero h1 { font: 800 clamp(54px, 10vw, 128px)/.86 var(--f-display); letter-spacing: .005em; text-transform: uppercase; }
.hero h1 span { color: #e8262d; }
.hero p.lede { max-width: 58ch; color: #c9ced4; font-size: 17px; margin: 0; }
.hero-index { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 8px; }
.hero-index div { display: grid; gap: 2px; }
.hero-index b { font: 500 22px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.hero-index small { color: var(--hero-muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

/* ---------- jump menu */
.jump { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); }
.jump-scroll { overflow-x: auto; scrollbar-width: none; }
.jump-scroll::-webkit-scrollbar { display: none; }
.jump-row { display: flex; gap: 4px; padding-block: 6px; white-space: nowrap; }
.jump button { border: 0; background: none; padding: 8px 12px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
.jump button:hover, .jump button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--rosso); }

/* ---------- sections */
section.block { padding-block: 56px; border-bottom: 1px solid var(--line); scroll-margin-top: 52px; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.sec-head .eyebrow { margin-bottom: 8px; color: var(--rosso); }
.link-more { font-size: 14px; font-weight: 500; text-decoration: none; color: var(--rosso); white-space: nowrap; }
.link-more:hover { text-decoration: underline; }

/* brief */
.brief { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; }
.brief h2 { font-size: clamp(28px, 4vw, 44px); margin-bottom: 22px; text-transform: none; }
.changes { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
.changes li { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.changes li b { font-weight: 600; }
.stats { display: grid; gap: 0; align-content: start; border-top: 2px solid var(--ink); }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.stat b { font: 500 34px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; text-align: right; }
.stat em { display: block; font-style: normal; font-size: 12px; }

/* movers */
.movers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mover { background: var(--surface); border: 1px solid var(--line); text-decoration: none; display: grid; grid-template-rows: auto 1fr; overflow: hidden; transition: border-color .15s; }
.mover .mb { padding: 16px 18px 16px; display: grid; gap: 8px; align-content: start; }
.mover:hover .ph img { transform: scale(1.03); }
.mover .ph { aspect-ratio: 16 / 9; }
.mover .why { color: var(--muted); font-size: 13px; }
.mover .split { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.mover .split b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.mover:hover { border-color: var(--ink); }
.mover-top { display: flex; justify-content: space-between; align-items: center; }
.pos { font: 700 15px/1 var(--f-display); background: var(--ink); color: var(--surface); padding: 5px 7px; }
.mover h3 { font: 700 26px/1 var(--f-display); text-transform: uppercase; }
.mover .big { font: 500 30px/1 var(--f-mono); }
.mover .meta { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.spark { width: 100%; height: 54px; display: block; }
.all-movers { margin-top: 18px; }
.all-movers summary { cursor: pointer; font-weight: 500; color: var(--rosso); list-style: none; display: inline-block; padding: 6px 0; }
.all-movers summary::-webkit-details-marker { display: none; }
.rule { color: var(--muted); font-size: 13px; max-width: 80ch; margin-top: 16px; }

/* tables (timing sheet) */
.tbl-wrap { overflow-x: auto; border-top: 2px solid var(--ink); }
table.sheet { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.sheet th { text-align: left; font: 600 11px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sheet td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.sheet td.r, .sheet th.r { text-align: right; }
.sheet td.num, .sheet td .num { white-space: nowrap; }
.sheet tr.click { cursor: pointer; }
.sheet tr.click:hover td { background: var(--chip); }
.sheet .name { font-weight: 600; }
.sheet .name a { text-decoration: none; }
.sheet .name a:hover { color: var(--rosso); }
.sheet .p { font: 700 14px/1 var(--f-display); color: var(--muted); width: 32px; }

/* colour premiums against red (pipeline/colors.py): drawn as one chart panel, like the market chart */
.paint { background: var(--surface); border: 1px solid var(--line); padding: 8px 20px 14px; }
.paint-row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 120px 170px; gap: 18px; align-items: center; padding: 11px 0; }
.paint-row + .paint-row { border-top: 1px solid var(--chip); }
.paint-row.base .paint-name { color: var(--rosso); }
.paint-name { display: flex; gap: 12px; align-items: center; font-weight: 600; min-width: 0; }
.paint-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paint-name > div { min-width: 0; }
.swatch { flex: none; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.12); }
.paint-track { position: relative; height: 26px; }
.paint-track::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: var(--chip); border-radius: 2px; }
.paint-track .zero { position: absolute; top: 2px; bottom: 2px; width: 2px; margin-left: -1px; background: var(--rosso); opacity: .55; }
.paint-track .rng { position: absolute; top: 8px; height: 10px; border-radius: 5px; background: var(--muted); opacity: .22; }
.paint-track .rng.premium { background: var(--up); opacity: .28; } .paint-track .rng.discount { background: var(--down); opacity: .28; }
.paint-track .dot { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 1px 3px rgba(0,0,0,.25); }
.paint-val { text-align: right; display: grid; gap: 1px; justify-items: end; }
.paint-val b { font: 500 18px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.paint-val b.premium { color: var(--up); } .paint-val b.discount { color: var(--down); }
.paint-val small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.paint-days { text-align: right; display: grid; gap: 1px; justify-items: end; }
.paint-days b { font: 500 16px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.paint-days small { font-size: 12px; color: var(--muted); white-space: nowrap; }
.paint-axis { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) 120px 170px; gap: 18px; border-top: 1px solid var(--line); padding-top: 6px; }
.paint-axis div { position: relative; height: 18px; font: 12px/1 var(--f-mono); color: var(--muted); }
.paint-axis span { position: absolute; transform: translateX(-50%); top: 3px; white-space: nowrap; }
.paint-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; margin: 26px 0 10px; }
.paint-head h3 { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; }
.paint-head span { font-size: 13px; color: var(--muted); }
.paint-notes { font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 90ch; }
.paint-notes p { margin: 4px 0 0; }
@media (max-width: 640px) {
  .paint { padding: 4px 12px 10px; }
  .paint-row, .paint-axis { grid-template-columns: minmax(0, 1fr) 78px 92px; gap: 6px 10px; }
  .paint-val small, .paint-days small { white-space: normal; text-align: right; }
  .paint-name small { display: none; }
  .paint-row .paint-track, .paint-axis div { grid-column: 1 / -1; grid-row: 2; }
  .paint-axis > :not(:nth-child(2)) { display: none; }
}

/* top movers */
.top-moves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 32px; margin-top: 26px; }
.top-moves.one { grid-template-columns: minmax(0, 1fr); }
.mv-h { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; margin-bottom: 10px; }
table.sheet.mv { min-width: 0; }
@media (max-width: 860px) { .top-moves { grid-template-columns: minmax(0, 1fr); } }

/* families */
.families { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.family { background: var(--surface); border: 1px solid var(--line); padding: 18px; display: grid; gap: 8px; align-content: start; text-decoration: none; }
.family:hover { border-color: var(--ink); }
.family h3 { font: 700 22px/1.05 var(--f-display); text-transform: uppercase; }
.family .n { color: var(--muted); font-size: 13px; }
.family .sig { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
.family .go { color: var(--rosso); font-weight: 500; font-size: 14px; }

/* insights */
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 32px; }
.insight { padding: 18px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.tag { display: inline-block; justify-self: start; font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 7px; background: var(--chip); color: var(--muted); }
.insight p { margin: 0; color: var(--muted); }
.insight a { font-size: 14px; font-weight: 500; color: var(--rosso); text-decoration: none; }


/* news */
.date { color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
.news { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.news a { text-decoration: none; display: grid; gap: 8px; align-content: start; }
.news .ph { aspect-ratio: 16 / 10; border: 1px solid var(--line); }
.news a:hover h3 { color: var(--rosso); }
.empty { border: 1px dashed var(--line); padding: 26px; color: var(--muted); }

/* auctions and listings: photo cards, like classic.com */
.lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.lot { background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; text-decoration: none; overflow: hidden; transition: border-color .15s; }
.lot:hover { border-color: var(--ink); }
.lot:hover .ph img { transform: scale(1.03); }
.lot .body { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; }
.lot h3 { font-size: 15px; line-height: 1.3; }
.ph { position: relative; aspect-ratio: 4 / 3; background: var(--chip); overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
.ph.none::after { content: "Photo unavailable"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 600 10px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; }
.ph .chips { position: absolute; left: 10px; top: 10px; right: 10px; min-height: 0; z-index: 1; }
.ph .chip { background: var(--surface); }
.lot .specs { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.thumb { width: 76px; padding: 6px 10px 6px 0 !important; }
.thumb .ph { width: 76px; border: 1px solid var(--line); }
.thumb .ph.none::after { content: ""; }
.sec-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: -8px 0 14px; }
.sort { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sort select { font: 500 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 6px 28px 6px 10px; border-radius: 0; cursor: pointer; }
.view-switch { display: inline-flex; border: 1px solid var(--line); }
.view-switch button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.view-switch button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.insight .ph { margin-bottom: 4px; aspect-ratio: 16 / 9; }
.lot .house { color: var(--muted); font-size: 13px; }
.more-row { display: flex; justify-content: center; margin-top: 18px; }
.load-more { border: 1px solid var(--ink); background: var(--surface); color: var(--ink); padding: 10px 22px; font: 600 14px/1 var(--f-body); cursor: pointer; }
.load-more:hover { background: var(--ink); color: var(--surface); }
.lot .sale, .timeline .sale { font-size: 13px; font-weight: 500; }
.sale-link, .sale a, .row a { color: var(--rosso); text-decoration: none; cursor: pointer; }
.sale-link:hover, .sale a:hover, .row a:hover { text-decoration: underline; }
.lot .country, .timeline .country { font-size: 13px; color: var(--ink); letter-spacing: .02em; }
.lot .bid { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }

.car-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "head side" "rest side"; column-gap: 40px; align-items: start; }

.ev { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 14px; align-items: start; }

/* market chart, with a card for the listing under the pointer */

.tip[hidden] { display: none; }
.tip .ph { aspect-ratio: 16 / 10; }
.tip .tb { padding: 10px 12px 12px; display: grid; gap: 3px; }
.tip b.t { font-weight: 600; font-size: 13px; line-height: 1.3; }
.tip .pr { font: 500 17px/1.2 var(--f-mono); }

/* model + sub pages */
.page-head { padding-block: 40px 28px; border-bottom: 1px solid var(--line); background: var(--surface); }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.crumbs a { text-decoration: none; color: var(--muted); }
.crumbs a:hover { color: var(--rosso); }
.page-head h1 { font: 800 clamp(44px, 7vw, 84px)/.9 var(--f-display); text-transform: uppercase; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin-top: 28px; border-top: 2px solid var(--ink); }
.kpi { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot-sold, .dot-unsold { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot-sold { background: var(--rosso); }
.dot-unsold { border: 1.5px solid var(--muted); }
.line-med { width: 18px; height: 2px; background: var(--ink); display: inline-block; }
.pc { grid-column: 1 / -1; margin-top: 4px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
.pc-head { font-weight: 600; margin-bottom: 6px; }
.pc-row { display: grid; grid-template-columns: 9.5em 1fr auto 5.5em; gap: 10px; padding: 3px 0; align-items: baseline; }
.pc-row .dn { color: var(--down); text-align: right; } .pc-row .up { color: var(--up); text-align: right; }

.line-ask { width: 18px; height: 3px; border-radius: 2px; background: var(--ask); display: inline-block; vertical-align: middle; margin-right: 6px; }
.band { width: 18px; height: 10px; background: var(--ink); opacity: .14; display: inline-block; }
.axis { fill: var(--muted); font: 11px var(--f-mono); }
.grid-line { stroke: var(--line); stroke-width: 1; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.auc-search { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.auc-search input { flex: 0 1 420px; min-width: 0; width: 100%; border: 1px solid var(--line); background: var(--surface); padding: 11px 14px; font: inherit; font-size: 15px; color: var(--ink); }
.auc-search input:focus { outline: 2px solid var(--ink); outline-offset: 0; }
.auc-count { font-size: 14px; color: var(--muted); }
/* market panel on a model page */
.mp-top { display: flex; justify-content: space-between; align-items: center; gap: 10px 20px; flex-wrap: wrap; margin-bottom: 14px; }
.mp-tabs { margin: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.mp-tabs::-webkit-scrollbar { display: none; }
.mp-tabs button { white-space: nowrap; }
.mp-stats[hidden] { display: none; }
.mp-stats { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.mp-body { min-height: 200px; }
.mp-body .mkt-controls { margin-bottom: 10px; }
.tick-s, .tick-a { width: 16px; height: 3px; border-radius: 2px; display: inline-block; background: var(--rosso); }
.tick-a { background: var(--ask); }
.vk { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: 0; }

.bar-s, .bar-u, .bar-f { width: 12px; height: 12px; display: inline-block; background: var(--rosso); }

/* years: price range, middle half, median, average */

.yc.hot .yr-box { fill: #5f8bbd; } .yc.hot .yr-range { fill: #b3b6ba; }

.yk-box { background: #7fa3cc; } .yk-avg { background: #4f8a4a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .yr-range { fill: #4a4e54; } :root:not([data-theme="light"]) .yk-range { background: #4a4e54; } }
:root[data-theme="dark"] .yr-range { fill: #4a4e54; } :root[data-theme="dark"] .yk-range { background: #4a4e54; }
/* this car, marked in every view of the market panel on a car page */
.me-k { background: var(--giallo); box-shadow: inset 0 0 0 2px var(--ink); }
.me-dot { fill: var(--giallo); stroke: var(--ink); stroke-width: 2.5; }

.loc-row.me span { font-weight: 700; } .loc-row.me i { background: var(--giallo); opacity: 1; box-shadow: inset 0 0 0 1px var(--ink); }
.paint-row.me { background: color-mix(in srgb, var(--giallo) 16%, transparent); margin-inline: -20px; padding-inline: 20px; }

@media (max-width: 640px) { .paint-row.me { margin-inline: -12px; padding-inline: 12px; } }
/* numbers on hover for bars, boxes and lines */
.htip { position: absolute; z-index: 6; pointer-events: none; background: var(--ink); color: var(--surface); padding: 8px 10px; font-size: 13px; line-height: 1.35; display: grid; gap: 1px; white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.htip[hidden] { display: none; }

.chart-box g.bar.hot rect[fill="var(--rosso)"] { fill-opacity: 1; }
.chart-box [data-tip] { cursor: default; }
.locs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px 28px; }
.loc { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; }
.loc-h { font: 700 18px/1.1 var(--f-display); text-transform: uppercase; margin: 0 0 12px; }
.loc-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 40px; gap: 10px; align-items: center; padding: 4px 0; font-size: 14px; }

@media (max-width: 640px) { .mp-top { align-items: stretch; } .mp-top .seg { align-self: flex-start; } .mp-tabs { margin-inline: calc(-1 * var(--gutter, 16px)); padding-inline: var(--gutter, 16px); } }
.tabs button { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.prose { max-width: 66ch; font-size: 17px; }

/* footer */
footer { padding-block: 40px 60px; color: var(--muted); font-size: 13px; }
.foot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }

.state { font: 600 10px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; }
.state.ok { color: var(--up); border: 1px solid var(--up); }

.loading { padding: 80px 0; color: var(--muted); }

@media (max-width: 860px) {
  .foot { grid-template-columns: minmax(0, 1fr); }

  .car-layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "side" "rest"; }
  .car-box { position: static; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; aspect-ratio: auto; gap: 4px; margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter)); }
  .gallery button { flex: 0 0 88%; aspect-ratio: 4 / 3; scroll-snap-align: start; }

  .gallery .count.m { display: block; }

}

@media (min-width: 1500px) {

}
.car-bar { display: none; }

@media (max-width: 860px) {
  .car-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.08);
    padding: 10px max(var(--gutter), env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px)); }
  .car-bar[hidden] { display: none; }
  .car-bar b { font: 500 20px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; display: block; }
  .car-bar small { color: var(--muted); font-size: 12px; }

}
@media (max-width: 700px) { .brief { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  section.block { padding-block: 36px; }

  .lot .bid .eyebrow { white-space: nowrap; letter-spacing: .06em; }
  .sec-head { margin-bottom: 18px; }
  .page-head { padding-block: 24px 20px; }
  /* movers swipe sideways, one and a bit cards in view */
  .movers { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); scrollbar-width: none; }
  .movers::-webkit-scrollbar { display: none; }
  .mover { flex: 0 0 82%; scroll-snap-align: start; }

  /* cards: photo beside the text, so a phone screen holds three or four cars, not one */

  /* stat strips swipe instead of stacking seven boxes */
  .mkt-stats { display: flex; overflow-x: auto; gap: 8px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scrollbar-width: none; }
  .mkt-stats::-webkit-scrollbar { display: none; }
  .mkt-stats div { flex: 0 0 auto; min-width: 118px; padding: 10px 12px; }
  .mkt-stats b { font-size: 16px; }
  .kpis { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  .kpi { padding: 10px 10px 10px 0; }
  .kpi b { font-size: 18px; }
  .kpi > span { font-size: 10.5px; }
  .chart-box { padding: 10px 4px 4px; margin-inline: calc(-1 * var(--gutter) + 6px); }
  .mkt-controls { gap: 8px; }
  .keys { gap: 4px; }
  .stat b { font-size: 28px; }
  .car-title { margin-top: 16px; }
  .ev { grid-template-columns: minmax(0, 1fr) 84px; padding: 12px; }
  .tip { width: 200px; }
}
/* fingers, not a mouse: bigger targets */
@media (pointer: coarse) {
  .seg button, .view-switch button, .tabs button, .keys button { min-height: 40px; padding-inline: 12px; }
  .jump button { padding-block: 12px; }
  .sort select { min-height: 40px; }
  .load-more { padding: 14px 26px; }
  .search input { padding-block: 11px; font-size: 16px; }   /* 16px keeps iOS from zooming in */
  .menu-grid a { padding: 9px 0; }
  .lb-strip img { height: 64px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="site-head">
  <div class="wrap head-row">
    <a class="logo" href="#overview" aria-label="Rosso Market home">
      <span class="logo-mark" aria-hidden="true">RM</span>
      <span class="logo-word">Rosso <span>Market</span></span>
    </a>
    <nav class="main" aria-label="Main">

        <summary>Models</summary>

      </details>
      <a href="#family-hypercars-and-limited-series" data-nav="family-hypercars-and-limited-series">Hypercars</a>

             autocomplete="off" spellcheck="false" aria-controls="sres" aria-expanded="false">

  <div class="lb-stage"><button type="button" class="lb-prev" id="lb-prev" aria-label="Previous photo">‹</button><img id="lb-img" alt="" referrerpolicy="no-referrer"><button type="button" class="lb-next" id="lb-next" aria-label="Next photo">›</button></div>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<script>
(() => {
  const app = document.getElementById("app");
  let D = null;
  const modelCache = {};
  const byId = {};

  // ------------------------------------------------------------ formatting
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => n == null ? "n/a" : "$" + Math.round(n).toLocaleString("en-US");
  const short = n => n == null ? "n/a" : n >= 1e6 ? "$" + (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M" : "$" + Math.round(n / 1e3) + "k";
  const miles = n => n == null ? "" : Math.round(n).toLocaleString("en-US") + " mi";
  // A change always shows as a signed percentage, however small (0.04% shows as 0.04%).
  const chg = (c, words) => {
    if (c == null) return '<span class="flat">n/a</span>';
    if (c === 0) return '<span class="flat num">0.00%</span>';
    const dn = c < 0, a = Math.abs(c);
    return `<span class="${dn ? "down" : "up"} num">${dn ? "▼" : "▲"} ${a.toFixed(a < 1 ? 2 : 1)}%${words ? (dn ? " lower" : " higher") : ""}</span>`;
  };
  // Until a week of prices exists the "7 days" change runs from the first day we have.
  const weekLabel = () => {
    const since = (D.models.find(m => m.change_7d_since) || {}).change_7d_since;
    if (!since) return "7 days";
    const days = Math.round((Date.parse(D.as_of) - Date.parse(since)) / 864e5);
    return days >= 7 ? "7 days" : "Since " + new Date(since + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  };
  const dateLong = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  const endET = iso => {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
  };
  const plural = (n, w) => `${n.toLocaleString("en-US")} ${w}${n === 1 ? "" : "s"}`;

  // ------------------------------------------------------------ charts
  function spark(values, color) {
    if (!values || values.length < 2) return "";
    const w = 240, h = 54, min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const pts = values.map((v, i) => [i / (values.length - 1) * (w - 6) + 3, h - 6 - (v - min) / span * (h - 12)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${line}L${last[0]} ${h}L3 ${h}Z" fill="${color}" opacity=".08"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
  }

  function niceTicks(min, max, count) {
    const span = max - min || max || 1, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= count) || mag * 10;
    const out = [];
    for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(v);
    return out;
  }

  function lineChart(points, opts = {}) {
    // points: [[isoDay, value], ...]
    if (!points || points.length < 2) return '<p class="flat">Not enough history yet. The chart fills in as daily runs accumulate.</p>';
    const W = 900, H = 300, L = 64, R = 18, T = 14, B = 34;
    const vals = points.map(p => p[1]);
    let min = Math.min(...vals), max = Math.max(...vals);
    const pad = (max - min) * 0.12 || max * 0.05;
    min -= pad; max += pad;
    const ticks = niceTicks(min, max, 4);
    min = Math.min(min, ticks[0]); max = Math.max(max, ticks[ticks.length - 1]);
    const t0 = Date.parse(points[0][0]), t1 = Date.parse(points[points.length - 1][0]);
    const x = d => L + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (W - L - R);
    const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
    const line = points.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
    const fmt = opts.fmt || short;
    const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`).join("");
    const months = [];
    const d0 = new Date(t0);
    for (let d = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + 1)) months.push(d.toISOString().slice(0, 10));
    const xt = months.map(m => `<line class="grid-line" x1="${x(m)}" x2="${x(m)}" y1="${H - B}" y2="${H - B + 5}"/><text class="axis" x="${x(m)}" y="${H - 10}" text-anchor="middle">${new Date(m + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", timeZone: "UTC" })}</text>`).join("");
    const last = points[points.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Price history")}">
      ${grid}${xt}
      <path d="${line}L${x(last[0])} ${H - B}L${L} ${H - B}Z" fill="var(--rosso)" opacity=".07"/>
      <path d="${line}" fill="none" stroke="var(--rosso)" stroke-width="2"/>
      <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="var(--rosso)"/>
    </svg>`;
  }

  function heroChart(index) {
    if (!index || index.length < 2) return "";
    const W = 1200, H = 420, vals = index.map(p => p[1]);
    const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
    const pts = index.map((p, i) => [i / (index.length - 1) * W, 120 + (1 - (p[1] - min) / span) * (H - 190)]);
    const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const rows = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}" stroke="var(--hero-line)" stroke-width="1"/>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${rows}
      <path d="${line}L${W} ${H}L0 ${H}Z" fill="var(--giallo)" opacity=".06"/>
      <path d="${line}" fill="none" stroke="var(--giallo)" stroke-width="2" vector-effect="non-scaling-stroke" opacity=".85"/></svg>`;
  }

  // ------------------------------------------------------------ pieces
  const modelLink = id => `#model-${id}`;
  const familyName = f => f;

  // Market Movers: the biggest gainer and decliner by asking price, and the most active model.
  function moverCard(kind, m, since) {
    if (!m) {
      const msg = kind === "gainer" ? "No model's asking prices rose" : kind === "decliner" ? "No model's asking prices fell" : "No listings added or removed";
      return `<div class="mover"><div class="ph none"></div><div class="mb"><div class="eyebrow">${{ gainer: "Biggest gainer", decliner: "Biggest decline", active: "Most active" }[kind]}</div><p class="why" style="margin:0">${msg} since ${dateLong(since)}.</p></div></div>`;
    }
    const label = { gainer: "Biggest gainer", decliner: "Biggest decline", active: "Most active" }[kind];
    const body = kind === "active"
      ? `<div class="big num">${m.total}</div><div class="why">cars changed hands or hit the market since ${dateLong(since)}</div>
         <div class="split"><span>New <b>${m.new}</b></span><span>Gone <b>${m.removed}</b></span><span>Sold at auction <b>${m.sold}</b></span></div>`
      : `<div class="big">${chg(m.change)}</div><div class="why">Median ask by model year, this week against the week of ${dateLong(since)}. ${m.cars_now} cars now, ${m.cars_last} a week earlier.</div>
         ${m.median_last ? `<div class="split"><span>Median now <b>${short(m.median)}</b></span><span>Week earlier <b>${short(m.median_last)}</b></span></div>` : ""}`;
    return `<a class="mover" href="${modelLink(m.id)}">${photo(m.image, m.name, `<span class="chip" style="background:var(--surface)">${label}</span>`)}
      <div class="mb"><h3>${esc(m.name)}</h3>${body}
      <div class="meta"><span>${m.median ? "Median ask <b class=\"num\">" + money(m.median) + "</b>" : ""}</span><span>${plural(m.listings || 0, "listing")}</span></div></div></a>`;
  }

  // One photo per car, loaded from the source's own CDN. No referrer is sent (some CDNs refuse
  // other sites' referrers), and a broken or missing photo turns into a quiet placeholder.
  function photo(url, alt, chips) {
    const over = chips ? `<div class="chips">${chips}</div>` : "";
    if (!url) return `<div class="ph none">${over}</div>`;
    return `<div class="ph"><img src="${esc(url)}" alt="${esc(alt || "")}" loading="lazy" decoding="async" referrerpolicy="no-referrer"
      onerror="this.parentNode.classList.add('none');this.remove()">${over}</div>`;
  }

  // Charts draw at their box's real width, so labels keep their size on a phone and on a wide monitor,
  // and redraw when the box changes width (a rotated phone, a resized window).
  function chartSize(cv) {
    const W = Math.max(300, Math.min(1800, Math.round(cv.clientWidth || 900)));
    const H = W < 520 ? Math.round(W * 0.8) : W < 900 ? Math.round(W * 0.48) : Math.max(340, Math.min(500, Math.round(W * 0.34)));
    return { W, H, L: W < 520 ? 58 : 64, R: W < 520 ? 10 : 18, r: W < 520 ? 3.4 : 4.2 };
  }
  // every page view can leave watchers behind; the next view clears them
  const PAGE_CLEANUP = [];
  function cleanupPage() { while (PAGE_CLEANUP.length) { try { PAGE_CLEANUP.pop()(); } catch (e) {} } }
  function onWidth(el, fn) {
    if (!("ResizeObserver" in window)) return;
    let last = el.clientWidth, t = 0;
    const ro = new ResizeObserver(() => { const w = el.clientWidth; if (Math.abs(w - last) < 8) return; last = w; clearTimeout(t); t = setTimeout(fn, 120); });
    ro.observe(el); PAGE_CLEANUP.push(() => ro.disconnect());
  }
  // A card grid shows whole rows: as many cards as fill `rows` rows at this width (at least `min`).
  const gridCols = g => getComputedStyle(g).gridTemplateColumns.split(" ").filter(Boolean).length || 1;
  function fitRows(root = document) {
    root.querySelectorAll(".lots[data-rows]").forEach(g => {
      const cols = gridCols(g), n = Math.max(+g.dataset.min || 4, cols * +g.dataset.rows);
      [...g.children].forEach((c, i) => { c.hidden = i >= n; });
    });
  }
  window.addEventListener("resize", () => { clearTimeout(fitRows.t); fitRows.t = setTimeout(() => fitRows(), 150); });

  let VIEW = "photos";
  try { VIEW = localStorage.getItem("rm-view") || "photos"; } catch (e) {}
  // Photo grid by default, a table one tap away. Lists can also offer a sort menu.
  // Both choices are remembered on this device.
  function switchable(el, items, cards, table, opts = {}) {
    const sorts = opts.sorts || [];
    let sortKey = sorts.length ? sorts[0][0] : null;
    try { const saved = localStorage.getItem("rm-sort-" + (opts.id || "")); if (sorts.some(x => x[0] === saved)) sortKey = saved; } catch (e) {}
    // the rest wait behind "Load more": two full rows of cards at this width, at least eight
    const cardsPerPage = () => { const cols = Math.max(1, Math.floor((el.clientWidth + 18) / (250 + 18))); return cols >= 4 ? cols * 2 : 8; };
    let limit = opts.limit ?? cardsPerPage();
    let open = false;
    if (opts.limit == null) onWidth(el, () => { const n = cardsPerPage(); if (n !== limit && !open) { limit = n; draw(); } });
    const draw = () => {
      const sorter = sorts.find(x => x[0] === sortKey);
      const sorted = sorter ? [...items].sort(sorter[2]) : items;
      const list = open || sorted.length <= limit ? sorted : sorted.slice(0, limit);
      const more = sorted.length - list.length;
      el.innerHTML = `<div class="sec-tools">
        ${sorts.length ? `<label class="sort">Sort by <select aria-label="Sort listings">${sorts.map(([k, l]) => `<option value="${k}"${k === sortKey ? " selected" : ""}>${l}</option>`).join("")}</select></label>` : "<span></span>"}
        <div class="view-switch" role="group" aria-label="View">
        <button type="button" data-v="photos" aria-pressed="${VIEW === "photos"}">Photos</button><button type="button" data-v="table" aria-pressed="${VIEW === "table"}">Table</button></div></div>`
        + (VIEW === "table" ? table(list) : `<div class="lots">${list.map(cards).join("")}</div>`)
        + (more > 0 ? `<div class="more-row"><button type="button" class="load-more">Load more (${more})</button></div>` : "")
        + (opts.note ? `<p class="flat" style="font-size:13px;margin-top:14px">${opts.note}</p>` : "");
      const lm = el.querySelector(".load-more");
      if (lm) lm.addEventListener("click", () => { open = true; draw(); });
      el.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
        VIEW = b.dataset.v; try { localStorage.setItem("rm-view", VIEW); } catch (e) {}
        draw();
      }));
      const sel = el.querySelector(".sort select");
      if (sel) sel.addEventListener("change", () => {
        sortKey = sel.value; try { localStorage.setItem("rm-sort-" + (opts.id || ""), sortKey); } catch (e) {}
        draw(); el.querySelector(".sort select").focus();
      });
    };
    draw();
  }

  // Missing values (no mileage published, say) always sort to the end.
  const by = (f, dir = 1) => (a, b) => { const x = f(a), y = f(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return x < y ? -dir : x > y ? dir : 0; };
  const LISTING_SORTS = [
    ["price-asc", "Lowest price", by(l => l.price_usd)],
    ["price-desc", "Highest price", by(l => l.price_usd, -1)],
    ["newest", "Newest listing", by(l => l.first_seen, -1)],
    ["oldest", "Longest on the market", by(l => l.first_seen)],
    ["miles-asc", "Lowest mileage", by(l => l.mileage_mi)],
    ["miles-desc", "Highest mileage", by(l => l.mileage_mi, -1)],
  ];
  const daysListed = l => l.first_seen ? Math.max(0, Math.round((Date.parse(D.as_of) - Date.parse(l.first_seen)) / 864e5)) : null;

  // Cards and rows open our own car page. Only records without one go straight to the source.
  const carLink = l => l.car ? `href="#car-${l.car}"` : `href="${esc(l.url)}" target="_blank" rel="noopener"`;
  // Where a car was offered: the sale by name (linked to the sale's own page) and the country.
  // Inside a card, which is itself a link, the sale opens through data-sale.
  const countryOf = l => l.country || (l.online ? "Online" : "");
  const saleLink = (l, inCard) => !l.sale ? "" : !l.sale_url ? esc(l.sale)
    : inCard ? `<span class="sale-link" role="link" tabindex="0" data-sale="${esc(l.sale_url)}">${esc(l.sale)} ↗</span>`
    : `<a href="${esc(l.sale_url)}" target="_blank" rel="noopener">${esc(l.sale)} ↗</a>`;
  const salePlace = (l, inCard) => (l.sale || countryOf(l)) ? `<div class="sale">${saleLink(l, inCard)}</div>${countryOf(l) ? `<div class="country">${esc(countryOf(l))}</div>` : ""}` : "";
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-sale]");
    if (!t) return;
    e.preventDefault(); e.stopPropagation();
    window.open(t.dataset.sale, "_blank", "noopener");
  }, true);
  document.addEventListener("keydown", e => {
    const t = e.target.closest && e.target.closest("[data-sale]");
    if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); window.open(t.dataset.sale, "_blank", "noopener"); }
  });

  function listingCard(l) {
    const chips = l.certified ? '<span class="chip sold">Ferrari Approved</span>' : "";
    return `<a class="lot" ${carLink(l)}>
      ${photo(l.image, l.title, chips)}
      <div class="body"><h3>${esc(l.title)}</h3>
        <div class="specs">${[miles(l.mileage_mi), l.exterior_color].filter(Boolean).map(esc).join(" · ")}</div>
        <div class="house">${esc(l.dealer_name || l.marketplace || "")}${l.location ? ", " + esc(l.location) : ""}</div>
        ${l.country ? `<div class="country">${esc(l.country)}</div>` : ""}
        <div class="bid"><div><div class="eyebrow">Asking</div><b>${money(l.price_usd)}</b></div><span>${l.first_seen ? "Listed " + dateLong(l.first_seen) : ""}<br>${esc(l.marketplace || "")}</span></div>
      </div></a>`;
  }

  function lotCard(l) {
    const chips = [];
    if (l.ending_soon) chips.push('<span class="chip hot">Ending soon</span>');
    if (l.no_reserve) chips.push('<span class="chip">No reserve</span>');
    if (l.status === "sold") chips.push('<span class="chip sold">Sold</span>');
    if (l.status === "unsold") chips.push('<span class="chip unsold">Not sold</span>');
    if (l.status === "upcoming") chips.push('<span class="chip">Upcoming</span>');
    let label, value;
    if (l.status === "live") { label = "Current bid"; value = money(l.price_usd); }
    else if (l.status === "upcoming") { label = "Estimate"; value = l.estimate_low_usd ? `${short(l.estimate_low_usd)} to ${short(l.estimate_high_usd)}` : "On request"; }
    else if (l.status === "sold") { label = "Sold for"; value = money(l.price_usd); }
    else { label = "High bid"; value = money(l.price_usd); }
    const est = l.status === "live" && l.estimate_low_usd ? ` Est. ${short(l.estimate_low_usd)} to ${short(l.estimate_high_usd)}` : "";
    const done = l.status === "sold" || l.status === "unsold";
    const when = !l.ends_at ? "" : done ? dateLong(l.ends_at.slice(0, 10)) : "Ends " + endET(l.ends_at);
    const vs = l.status === "sold" && l.vs_ask_pct != null ? `<div style="font-size:12px">${chg(l.vs_ask_pct)} vs median ask</div>` : "";
    return `<a class="lot" ${carLink(l)}>
      ${photo(l.image, l.title, chips.join(""))}
      <div class="body"><h3>${esc(l.title)}</h3>
      ${salePlace(l, true)}
      <div class="house">${esc(l.auction_house)}${!l.sale && l.location ? ", " + esc(l.location) : ""}${l.lot_number ? ", lot " + esc(l.lot_number) : ""}</div>
      ${l.mileage_mi ? `<div class="specs">${miles(l.mileage_mi)}</div>` : ""}
      <div class="bid"><div><div class="eyebrow">${label}</div><b>${value}</b></div><span>${when}${est}${vs}</span></div>
      </div></a>`;
  }

  function modelsTable(models, opts = {}) {
    return `<div class="tbl-wrap"><table class="sheet">
      <thead><tr>${opts.rank ? '<th class="p">Pos</th>' : ""}<th>Model</th><th class="r">For sale</th><th class="r">Median ask</th><th class="r">${weekLabel()}</th><th class="r">Sold, 12 mo</th><th class="r">Median sold</th><th class="r">vs last year</th><th class="r">Sell through</th></tr></thead>
      <tbody>${models.map((m, i) => `<tr class="click" data-href="${modelLink(m.id)}">
        ${opts.rank ? `<td class="p">P${i + 1}</td>` : ""}
        <td class="name"><a href="${modelLink(m.id)}">${esc(m.name)}</a></td>
        <td class="r num">${m.listings || ""}</td><td class="r num">${m.median ? money(m.median) : ""}</td>
        <td class="r">${m.listings ? chg(m.change_7d) : ""}</td>
        <td class="r num">${(m.auction || {}).sold_12m || ""}</td><td class="r num">${(m.auction || {}).median_sold_12m ? money(m.auction.median_sold_12m) : ""}</td>

        <td class="r num">${(m.auction || {}).sell_through_12m != null ? m.auction.sell_through_12m + "%" : ""}</td></tr>`).join("")}</tbody></table></div>`;
  }

  // The week's top movers: five gainers and five declines, or ten of one kind when every model moved the same way.
  function topMoves(all) {
    const up = all.filter(x => x.change > 0).sort((a, b) => b.change - a.change);
    const dn = all.filter(x => x.change < 0).sort((a, b) => a.change - b.change);
    const lists = up.length && dn.length ? [["Top gainers", up.slice(0, 5)], ["Top declines", dn.slice(0, 5)]]
      : up.length ? [["Top gainers", up.slice(0, 10)]] : dn.length ? [["Top declines", dn.slice(0, 10)]] : [];

    return `<div class="top-moves${lists.length === 1 ? " one" : ""}">${lists.map(([t, r]) => table(t, r)).join("")}</div>`;
  }
