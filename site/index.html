  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // ------------------------------------------------------------ market chart
  // Every sale and high bid for a model, the cars for sale now, and the median ask over time, on one
  // chart, like classic.com. Hover (or tap) a dot to see which car it is. Click it to open that car.
  // Asking dots are cars listed now only: past asks are carried by the median ask line (opts.ask:
  // [[day, median, cars], ...] from the daily snapshots).
  const KINDS = { s: ["Sold", "k-s"], u: ["High bid", "k-u"], f: ["For sale now", "k-f"] };
  function marketChart(el, points, opts = {}) {
    points = points.filter(p => KINDS[p[2]]);
    const ask = (opts.ask || []).filter(p => p[1]).map(p => [p[0], p[1], p[2]]);
    if (!points.length && !ask.length) { el.innerHTML = '<div class="empty">No dated sales or asking prices yet.</div>'; return; }
    const ends = [...points.map(p => p[0]), ...ask.map(p => p[0])].sort();
    const first = ends[0], last = ends[ends.length - 1];
    const span = (Date.parse(last) - Date.parse(first)) / 864e5;
    let range = opts.range || (span > 3 * 365 ? "3y" : "all");
    const shown = { s: true, u: true, f: true, m: true };
    const have = new Set(points.map(p => p[2]));
    el.innerHTML = `${opts.bare ? "" : '<div class="mkt-stats" id="ms"></div>'}
      <div class="mkt-controls">
        ${opts.bare ? "" : `<div class="seg" role="group" aria-label="Time range">${[["1y", "1 year"], ["3y", "3 years"], ["5y", "5 years"], ["all", "All"]].map(([k, l]) => `<button type="button" data-r="${k}">${l}</button>`).join("")}</div>`}
        <div class="keys" role="group" aria-label="Show">${Object.entries(KINDS).filter(([k]) => have.has(k)).map(([k, [l, c]]) => `<button type="button" data-k="${k}" aria-pressed="true"><i class="k ${c}"></i>${l}</button>`).join("")}${ask.length ? '<button type="button" data-k="m" aria-pressed="true"><i class="line-ask"></i>Median ask</button>' : ""}<span class="legend" style="align-self:center"><span><i class="line-med"></i>Median sold</span></span></div>
      </div>
      <div class="chart-box mkt"><div class="cv"></div><div class="tip" hidden></div></div>`;
    const cv = el.querySelector(".cv"), tip = el.querySelector(".tip"), box = el.querySelector(".mkt");
    let vis = [], pos = [], sel = -1, svg = null;
    let W = 900, H = 340, L = 64, R = 18, rad = 4.2;
    const T = 14, B = 34;

    function draw() {
      ({ W, H, L, R, r: rad } = chartSize(cv));
      el.querySelectorAll("[data-r]").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === range));
      const cut = range === "all" ? "" : (() => { const d = new Date(last + "T12:00:00Z"); d.setUTCFullYear(d.getUTCFullYear() - +range[0]); return d.toISOString().slice(0, 10); })();
      vis = points.filter(p => p[0] >= cut && shown[p[2]]);
      const av = shown.m ? ask.filter(p => p[0] >= cut) : [];
      const sold = vis.filter(p => p[2] === "s").map(p => p[1]).sort((a, b) => a - b);
      const med = sold.length ? sold[Math.floor(sold.length / 2)] : null;
      const lastSold = [...vis].reverse().find(p => p[2] === "s");
      if (!opts.bare) el.querySelector("#ms").innerHTML = [["Median sold", med ? money(med) : "n/a"], ["Sales", sold.length], ["Lowest sale", sold.length ? money(sold[0]) : "n/a"],
        ["Top sale", sold.length ? money(sold[sold.length - 1]) : "n/a"], ["Most recent", lastSold ? money(lastSold[1]) : "n/a"],
        ["Median ask", ask.length ? money(ask[ask.length - 1][1]) : "n/a"], ["For sale now", points.filter(p => p[2] === "f").length]].map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
      if (!vis.length && !av.length) { cv.innerHTML = '<p class="flat" style="padding:20px">Nothing to show for this range.</p>'; pos = []; return; }
      const prices = [...vis.map(p => p[1]), ...av.map(p => p[1])].sort((a, b) => a - b);
      const lo = prices[Math.floor(prices.length * 0.02)], hi = prices[Math.min(prices.length - 1, Math.ceil(prices.length * 0.98) - 1)];
      const ticks = niceTicks(lo * 0.9, hi * 1.08, 4);
      const min = Math.min(ticks[0], lo * 0.9), max = Math.max(ticks[ticks.length - 1], hi * 1.08);
      const ds = [...vis.map(p => p[0]), ...av.map(p => p[0])].sort();
      const t0 = Date.parse(ds[0]), t1 = Math.max(Date.parse(ds[ds.length - 1]), t0 + 864e5 * 30);
      const x = d => L + (Date.parse(d) - t0) / (t1 - t0) * (W - L - R);
      const y = v => T + (1 - (Math.min(Math.max(v, min), max) - min) / (max - min)) * (H - T - B);
      const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
      const days = (t1 - t0) / 864e5, xt = [];
      if (days > 500) { const yStep = Math.max(1, Math.ceil(days / 365 / Math.max(1, Math.floor((W - L - R) / 56)))); for (let yr = new Date(t0).getUTCFullYear() + 1; Date.UTC(yr, 0, 1) <= t1; yr += yStep) xt.push([`${yr}-01-01`, yr]); }
      else { const d0 = new Date(t0), fit = Math.max(1, Math.floor((W - L - R) / 64)), stepM = Math.max(days > 200 ? 2 : 1, Math.ceil(days / 30.4 / fit)); for (let d = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + stepM)) { const iso = d.toISOString().slice(0, 10); xt.push([iso, d.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }) + (d.getUTCMonth() === 0 ? " " + d.getUTCFullYear() : "")]); } }
      const xg = xt.map(([d, l]) => `<line class="grid-line" x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H - B}"/><text class="axis" x="${x(d)}" y="${H - 10}" text-anchor="middle">${l}</text>`).join("");
      pos = vis.map(p => [x(p[0]), y(p[1])]);
      const order = { a: 0, u: 1, f: 2, s: 3 };
      const idx = vis.map((p, i) => i).sort((i, j) => order[vis[i][2]] - order[vis[j][2]]);
      const dots = idx.map(i => {
        const p = vis[i], [cx, cy] = pos[i], me = opts.highlight && p[3] === opts.highlight;
        const r = me ? 7 : rad;
        const style = p[2] === "s" ? 'fill="var(--rosso)" fill-opacity=".8"' : p[2] === "u" ? 'fill="var(--surface)" stroke="var(--rosso)" stroke-width="1.6"'
          : p[2] === "f" ? 'fill="var(--ink)" fill-opacity=".85"' : 'fill="#9aa1a8" fill-opacity=".8"';
        return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" ${style}${me ? ' stroke="var(--giallo)" stroke-width="3"' : ""}/>`;
      }).join("");
      const sp = vis.map((p, i) => [p, i]).filter(([p]) => p[2] === "s");
      let path = "";
      if (sp.length >= 6) {
        const m = a => { const q = [...a].sort((u, v) => u - v); return q[Math.floor(q.length / 2)]; };
        path = sp.map(([p], i) => [p[0], m(sp.slice(Math.max(0, i - 8), i + 1).map(([q]) => q[1]))]).slice(4)
          .map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
      }
      // the median ask: a line once there are two days, a mark on the one day before that
      const askLine = av.length >= 2
        ? `<path d="${av.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("")}" fill="none" stroke="var(--ask)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><title>Median ask ${money(av[av.length - 1][1])}</title></path>`
        : av.length ? `<rect x="${(x(av[0][0]) - 5).toFixed(1)}" y="${(y(av[0][1]) - 1.5).toFixed(1)}" width="10" height="3" rx="1.5" fill="var(--ask)"><title>Median ask ${money(av[0][1])}</title></rect>` : "";
      cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Market")}">${grid}${xg}
        ${path ? `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-opacity=".75"/>` : ""}${dots}${askLine}<circle class="ring" r="9" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg>`;
      svg = cv.querySelector("svg");
      sel = -1; tip.hidden = true;
    }
    onWidth(cv, draw);

    function nearest(e) {
      if (!svg || !pos.length) return -1;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = -1, bd = 1e9;
      pos.forEach(([px, py], i) => { const d = (px - q.x) ** 2 + (py - q.y) ** 2; if (d < bd) { bd = d; best = i; } });
      return bd < 22 * 22 ? best : -1;
    }
    function show(i) {
      sel = i;
      const ring = svg.querySelector(".ring");
      if (i < 0) { tip.hidden = true; ring.style.display = "none"; return; }
      const p = vis[i], [cx, cy] = pos[i];
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.style.display = "";
      tip.innerHTML = `${p[5] ? photo(p[5], p[4]) : ""}<div class="tb"><b class="t">${esc(p[4] || "")}</b><span class="pr">${money(p[1])}</span>
        <span class="sub">${KINDS[p[2]][0]}${p[6] ? ", " + esc(p[6]) : ""}</span>${p[7] || p[8] ? `<span class="sub">${[p[7], p[8]].filter(Boolean).map(esc).join(" · ")}</span>` : ""}<span class="sub">${dateLong(p[0])}</span>${p[3] ? '<span class="go">Open this car →</span>' : ""}</div>`;
      tip.hidden = false;
      const sr = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
      const px = sr.left - br.left + cx / W * sr.width, py = sr.top - br.top + cy / H * sr.height;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = px + 16, top = py - h / 2;
      if (left + w > br.width - 4) left = px - w - 16;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, Math.min(top, br.height - h - 4)) + "px";
    }
    cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const i = nearest(e); if (i !== sel) show(i); } });
    cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(-1); });
    cv.addEventListener("click", e => {
      const i = nearest(e);
      if (i < 0) return show(-1);
      // mouse: the card is already showing, so a click opens the car. Touch: first tap shows it.
      if (i === sel && vis[i][3]) location.hash = "car-" + vis[i][3];
      else show(i);
    });
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { range = b.dataset.r; draw(); }));
    el.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
      shown[b.dataset.k] = !shown[b.dataset.k]; b.setAttribute("aria-pressed", shown[b.dataset.k]); draw();
    }));
    draw();
  }

  // ------------------------------------------------------------ market panel on a model page
  // Like classic.com's market tracker: one time range, the sale figures for it, and a tab per view.
  const RANGES = [["1y", "1 year"], ["3y", "3 years"], ["5y", "5 years"], ["all", "All"]];
  const MP_TABS = [["sales", "Sales"], ["mileage", "Mileage"], ["years", "Years"], ["variants", "Variants"], ["volume", "Volume"],
    ["locations", "Locations"], ["listings", "Listings"], ["colours", "Colours"]];
  const cutFor = (range, last) => { if (range === "all") return ""; const d = new Date(last + "T12:00:00Z"); d.setUTCFullYear(d.getUTCFullYear() - +range[0]); return d.toISOString().slice(0, 10); };
  const yearOf = t => { const m = /^(\d{4})\b/.exec(t || ""); return m ? +m[1] : null; };
  const pYear = p => p[9] || yearOf(p[4]);
  const medianOf = a => { if (!a.length) return null; const q = [...a].sort((x, y) => x - y), h = q.length >> 1; return q.length % 2 ? q[h] : (q[h - 1] + q[h]) / 2; };
  const SERIES = ["var(--rosso)", "var(--ink)", "var(--ask)", "#c79a00", "#2f8a57", "#7a4bb0", "#8a8f96", "#d06d1f"];

  // what a car page needs to mark the car in each view
  function carMark(c) {
    const loc = c.location || "", tail = loc.includes(",") ? loc.split(",").pop().trim() : "";
    const state = STATE_NAMES[tail] ? tail : Object.keys(STATE_NAMES).find(k => STATE_NAMES[k] === tail) || null;
    const sold = c.status === "sold" || c.status === "unsold";
    const listed = (c.history || []).find(e => e.kind === "listed");
    return { id: c.id, price: c.status === "upcoming" ? null : c.price, status: c.status, year: c.year, colour: c.colour, model: c.model.id,
      miles: c.mileage ?? (c.history.find(e => e.mileage != null) || {}).mileage, state, country: c.country, house: sold ? c.seller : null,
      sold, date: c.date, listed: listed ? listed.date : null, title: c.title };
  }

  function marketPanel(el, detail, m, car = null) {
    if (car && !car.state) car.state = ((detail.listings || []).find(l => l.car === car.id) || {}).state || null;
    const pts = detail.points || [];
    const days = pts.map(p => p[0]).concat((detail.history || []).map(p => p[0])).sort();
    const last = days.length ? days[days.length - 1] : new Date().toISOString().slice(0, 10);
    const span = days.length ? (Date.parse(last) - Date.parse(days[0])) / 864e5 : 0;
    let st = { range: span > 3 * 365 ? "3y" : "all", tab: "sales" };
    try { const t = localStorage.getItem("rm-mtab"); if (MP_TABS.some(x => x[0] === t)) st.tab = t; } catch (e) {}
    el.innerHTML = `<div class="mp-top"><div class="tabs mp-tabs" role="tablist" aria-label="Market views">${MP_TABS.map(([k, l]) => `<button type="button" role="tab" data-t="${k}">${l}</button>`).join("")}</div>
      <div class="seg" role="group" aria-label="Time range">${RANGES.map(([k, l]) => `<button type="button" data-r="${k}">${l}</button>`).join("")}</div></div>
      <div class="mkt-stats mp-stats"></div><div class="mp-body"></div>`;
    const body = el.querySelector(".mp-body");
    const draw = () => {
      cleanupCharts(body);
      el.querySelectorAll("[data-r]").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === st.range));
      el.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-selected", b.dataset.t === st.tab));
      const cut = cutFor(st.range, last);
      const sold = pts.filter(p => p[2] === "s" && p[0] >= cut);
      const prices = sold.map(p => p[1]).sort((a, b) => a - b);
      const sum = prices.reduce((a, b) => a + b, 0);
      const recent = sold[sold.length - 1];
      const ask = (detail.history || []).filter(p => p[1]);
      el.querySelector(".mp-stats").innerHTML = [["Average sale", prices.length ? money(sum / prices.length) : "n/a"], ["Sales", prices.length],
        ["Dollar volume", prices.length ? money(sum) : "n/a"], ["Lowest sale", prices.length ? money(prices[0]) : "n/a"],
        ["Top sale", prices.length ? money(prices[prices.length - 1]) : "n/a"], [recent ? "Most recent, " + dateShort(recent[0]) : "Most recent", recent ? money(recent[1]) : "n/a"],
        ["Median ask now", ask.length ? money(ask[ask.length - 1][1]) : "n/a"], ["For sale now", (detail.listings || []).length]]
        .map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
      const t = st.tab;
      // the sale figures belong to the views of sales. Mileage, listings and colours carry their own.
      el.querySelector(".mp-stats").hidden = ["mileage", "listings", "colours"].includes(t);
      el.querySelector(".mp-top .seg").style.visibility = ["mileage", "listings", "colours"].includes(t) ? "hidden" : "";
      if (t === "sales") marketChart(body, pts.length ? pts : (detail.auction_points || []).map(p => [p[0], p[1], p[2] ? "s" : "u"]), { label: `${m.name} market`, ask: detail.history, range: st.range, bare: true, highlight: car && car.id });
      else if (t === "mileage") mileageChart(body, detail.mileage, { name: m.name, highlight: car && car.id,
        me: car && car.price && car.miles != null && (car.status === "for_sale" || car.status === "sold") ? { miles: car.miles, price: car.price } : null, verb: car && car.sold ? "sold for" : "is priced" });
      else if (t === "years") yearsChart(body, pts, cut, m, car && car.status === "for_sale" ? "f" : "s", car);
      else if (t === "variants") variantsView(body, detail.variants || [], cut, m, car);
      else if (t === "volume") volumeChart(body, pts, cut, last, car);
      else if (t === "locations") locationsView(body, detail, pts, cut, m, car);
      else if (t === "listings") listingsView(body, detail.weekly || {}, m, car);
      else colorChart(body, detail.colors, m.name, car);
    };
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { st.range = b.dataset.r; draw(); }));
    el.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
      st.tab = b.dataset.t; try { localStorage.setItem("rm-mtab", st.tab); } catch (e) {} draw();
    }));
    draw();
  }
  const dateShort = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  function cleanupCharts(el) { el.innerHTML = ""; }
  const rangeWords = cut => cut ? "since " + dateShort(cut) : "on record";

  // Hover (or tap) any bar, box or line carrying data-tip to see its numbers.
  function hoverTips(box) {
    box.style.position = "relative";
    const tip = document.createElement("div");
    tip.className = "htip"; tip.hidden = true; box.appendChild(tip);
    let on = null;
    const show = e => {
      const t = e.target.closest && e.target.closest("[data-tip]");
      if (on && on !== t) on.classList.remove("hot");
      if (!t || !box.contains(t)) { tip.hidden = true; on = null; return; }
      on = t; t.classList.add("hot");
      tip.innerHTML = t.dataset.tip; tip.hidden = false;
      const br = box.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
      let left = e.clientX - br.left + 14, top = e.clientY - br.top - h - 10;
      if (left + w > br.width - 4) left = e.clientX - br.left - w - 14;
      if (top < 4) top = e.clientY - br.top + 16;
      tip.style.left = Math.max(4, left) + "px"; tip.style.top = top + "px";
    };
    box.addEventListener("pointermove", show);
    box.addEventListener("pointerdown", show);
    box.addEventListener("pointerleave", () => { tip.hidden = true; if (on) on.classList.remove("hot"); on = null; });
  }
  const tipText = (head, lines) => esc(`<b>${head}</b>` + lines.filter(Boolean).map(l => `<span>${l}</span>`).join(""));

  // A scatter with a card for the car under the pointer.
  // items: [x, y, kind s|u|f, car id, title, photo, sub line]
  function dotChart(el, items, cfg) {
    el.innerHTML = `<div class="chart-box mkt"><div class="cv"></div><div class="tip" hidden></div></div>`;
    const cv = el.querySelector(".cv"), tip = el.querySelector(".tip"), box = el.querySelector(".mkt");
    const T = 14, B = 34;
    let W, H, pos = [], svg, sel = -1;
    const render = () => {
      const s = chartSize(cv); W = s.W; H = s.H; const L = s.L, R = s.R;
      const ys = items.map(p => p[1]).concat((cfg.lines || []).flatMap(l => l.pts.map(q => q[1]))).sort((a, b) => a - b);
      const lo = ys[Math.floor(ys.length * 0.02)], hi = ys[Math.min(ys.length - 1, Math.ceil(ys.length * 0.98) - 1)];
      const ticks = niceTicks(lo * 0.9, hi * 1.08, 4);
      const min = Math.min(ticks[0], lo * 0.9), max = Math.max(ticks[ticks.length - 1], hi * 1.08);
      const [x0, x1] = cfg.xDomain;
      const x = v => L + (v - x0) / (x1 - x0 || 1) * (W - L - R);
      const y = v => T + (1 - (Math.min(Math.max(v, min), max) - min) / (max - min)) * (H - T - B);
      const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
      const every = Math.max(1, Math.ceil(cfg.xTicks.length / Math.max(2, Math.floor((W - L - R) / 46))));
      const xg = cfg.xTicks.filter((_, i) => i % every === 0).map(v => `<text class="axis" x="${x(v)}" y="${H - 10}" text-anchor="middle">${cfg.xLabel(v)}</text>`).join("");
      pos = items.map(p => [x(p[0]), y(p[1])]);
      const order = items.map((_, i) => i).sort((i, j) => (items[i][2] === "s") - (items[j][2] === "s"));
      const dots = order.map(i => { const p = items[i], [cx, cy] = pos[i];
        const style = p[2] === "s" ? 'fill="var(--rosso)" fill-opacity=".75"' : p[2] === "u" ? 'fill="var(--surface)" stroke="var(--rosso)" stroke-width="1.5"' : 'fill="var(--ink)" fill-opacity=".8"';
        return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${s.r}" ${style}/>`; }).join("");
      const lines = (cfg.lines || []).map(l => l.marks
        ? l.pts.map(([v, p]) => `<line x1="${(x(v) - l.half).toFixed(1)}" x2="${(x(v) + l.half).toFixed(1)}" y1="${y(p)}" y2="${y(p)}" stroke="${l.color}" stroke-width="3" stroke-linecap="round"><title>${esc(l.name)} ${cfg.xLabel(v)}: ${money(p)}</title></line>`).join("")
        : `<path d="${l.pts.map((q, i) => (i ? "L" : "M") + x(q[0]).toFixed(1) + " " + y(q[1]).toFixed(1)).join("")}" fill="none" stroke="${l.color}" stroke-width="2.4"/>`).join("");
      cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label)}">${grid}${xg}${dots}${lines}<circle class="ring" r="9" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg>`;
      svg = cv.querySelector("svg"); sel = -1; tip.hidden = true;
    };
    render(); onWidth(cv, render);
    const nearest = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = -1, bd = 1e9; pos.forEach(([px, py], i) => { const d = (px - q.x) ** 2 + (py - q.y) ** 2; if (d < bd) { bd = d; best = i; } }); return bd < 22 * 22 ? best : -1; };
    const show = i => {
      sel = i; const ring = svg.querySelector(".ring");
      if (i < 0) { tip.hidden = true; ring.style.display = "none"; return; }
      const p = items[i], [cx, cy] = pos[i];
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.style.display = "";
      tip.innerHTML = `${p[5] ? photo(p[5], p[4]) : ""}<div class="tb"><b class="t">${esc(p[4] || "")}</b><span class="pr">${money(p[1])}</span><span class="sub">${esc(p[6] || "")}</span>${p[3] ? '<span class="go">Open this car →</span>' : ""}</div>`;
      tip.hidden = false;
      const sr = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
      const px = sr.left - br.left + cx / W * sr.width, py = sr.top - br.top + cy / H * sr.height, w = tip.offsetWidth, h = tip.offsetHeight;
      let left = px + 16; if (left + w > br.width - 4) left = px - w - 16;
      tip.style.left = Math.max(4, left) + "px"; tip.style.top = Math.max(4, Math.min(py - h / 2, br.height - h - 4)) + "px";
    };
    cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const i = nearest(e); if (i !== sel) show(i); } });
    cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(-1); });
    cv.addEventListener("click", e => { const i = nearest(e); if (i < 0) return show(-1); if (i === sel && items[i][3]) location.hash = "car-" + items[i][3]; else show(i); });
  }

  // Years: for each model year the full range of prices, the middle half, the median and the average.
  function yearsChart(el, pts, cut, m, kind = "s", car = null) {
    const pick = k => pts.filter(p => p[2] === k && (k === "f" || p[0] >= cut) && pYear(p));
    const rows = pick(kind);
    const both = { s: pick("s").length, f: pick("f").length };
    const toggle = `<div class="seg" role="group" aria-label="Prices">${[["s", "Sold"], ["f", "For sale now"]].map(([k, l]) => `<button type="button" data-yk="${k}" aria-pressed="${k === kind}">${l} (${both[k]})</button>`).join("")}</div>`;
    if (!rows.length) {
      el.innerHTML = `<div class="mkt-controls">${toggle}</div><div class="empty">${kind === "s" ? "No sales with a model year in this range." : "No cars for sale with a model year."}</div>`;
    } else {
      const q = (a, f) => { const i = (a.length - 1) * f, lo = Math.floor(i); return a[lo] + (a[Math.min(lo + 1, a.length - 1)] - a[lo]) * (i - lo); };
      const yrs = [...new Set(rows.map(p => pYear(p)))].sort((a, b) => a - b);
      const stats = yrs.map(yr => { const v = rows.filter(p => pYear(p) === yr).map(p => p[1]).sort((a, b) => a - b);
        return { yr, n: v.length, min: v[0], max: v[v.length - 1], p25: q(v, .25), p75: q(v, .75), med: q(v, .5), avg: v.reduce((t, x) => t + x, 0) / v.length }; });
      el.innerHTML = `<div class="mkt-controls">${toggle}<div class="legend"><span><i class="yk-range"></i>Price range</span><span><i class="yk-box"></i>Middle half</span><span><i class="k" style="background:var(--ink)"></i>Median</span><span><i class="k yk-avg"></i>Average</span></div></div>
        <div class="chart-box"><div class="cv"></div></div>`;
      const cv = el.querySelector(".cv"), T = 14, B = 34;
      const render = () => {
        const { W, H, L, R } = chartSize(cv);
        const hi = Math.max(...stats.map(s => s.max)), lo = Math.min(...stats.map(s => s.min));
        const ticks = niceTicks(Math.max(0, lo * 0.85), hi * 1.05, 5), min = Math.min(ticks[0], lo * 0.85), max = Math.max(ticks[ticks.length - 1], hi);
        const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
        const bw = (W - L - R) / stats.length, every = Math.max(1, Math.ceil(stats.length / Math.max(2, Math.floor((W - L - R) / 44))));
        const boxW = Math.max(6, Math.min(110, bw * 0.62)), rngW = Math.max(4, Math.min(16, bw * 0.22));
        const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
        const cols = stats.map((st_, i) => {
          const mine = car && car.year === st_.yr;
          const cx = L + (i + 0.5) * bw, tipx = tipText(String(st_.yr) + (mine ? ", this car's year" : ""), [mine && car.price ? `This car ${money(car.price)}` : "", plural(st_.n, kind === "s" ? "sale" : "car for sale"),
            st_.n > 1 ? `Range ${short(st_.min)} to ${short(st_.max)}` : "", st_.n > 3 ? `Middle half ${short(st_.p25)} to ${short(st_.p75)}` : "", `Median ${money(st_.med)}`, st_.n > 1 ? `Average ${money(st_.avg)}` : ""]);
          const boxH = Math.max(4, y(st_.p25) - y(st_.p75));
          return `<g class="yc" data-tip="${tipx}"><rect x="${(cx - bw / 2).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H - T - B}" class="${mine ? "me-band" : ""}" fill="transparent"/>
            <rect x="${(cx - rngW / 2).toFixed(1)}" y="${(y(st_.max) - rngW / 2).toFixed(1)}" width="${rngW.toFixed(1)}" height="${(y(st_.min) - y(st_.max) + rngW).toFixed(1)}" rx="${(rngW / 2).toFixed(1)}" class="yr-range"/>
            <rect x="${(cx - boxW / 2).toFixed(1)}" y="${(y(st_.p75) - (boxH === 4 ? 2 : 0)).toFixed(1)}" width="${boxW.toFixed(1)}" height="${boxH.toFixed(1)}" rx="6" class="yr-box"/>
            ${Math.abs(y(st_.avg) - y(st_.med)) > 2 ? `<line x1="${cx}" x2="${cx}" y1="${y(st_.avg)}" y2="${y(st_.med)}" stroke="var(--ink)" stroke-width="1.5"/>` : ""}
            <circle cx="${cx.toFixed(1)}" cy="${y(st_.avg).toFixed(1)}" r="5" class="yr-avg"/><circle cx="${cx.toFixed(1)}" cy="${y(st_.med).toFixed(1)}" r="5.5" fill="var(--ink)"/>
            ${car && car.price && car.year === st_.yr ? `<circle cx="${(cx + boxW / 2 + 12).toFixed(1)}" cy="${y(Math.min(max, Math.max(min, car.price))).toFixed(1)}" r="7" class="me-dot"/>` : ""}
            ${i % every === 0 ? `<text class="axis" x="${cx.toFixed(1)}" y="${H - 10}" text-anchor="middle">${st_.yr}</text>` : ""}</g>`;
        }).join("");
        cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} prices by model year">${grid}${cols}</svg>`;
      };
      render(); onWidth(cv, render); hoverTips(el.querySelector(".chart-box"));
    }
    el.querySelectorAll("[data-yk]").forEach(b => b.addEventListener("click", () => yearsChart(el, pts, cut, m, b.dataset.yk, car)));
  }

  // Variants: the model's sibling versions side by side, each line the running median of its auction sales.
  function variantsView(el, vs, cut, m, car = null) {
    if (vs.length < 2) { el.innerHTML = '<div class="empty">No other versions of this model are tracked separately.</div>'; return; }
    const runMed = a => a.map((p, i) => [p[0], medianOf(a.slice(Math.max(0, i - 8), i + 1).map(q => q[1]))]).slice(Math.min(4, a.length - 1));
    const series = vs.map((v, i) => ({ v, color: SERIES[i % SERIES.length], pts: runMed(v.sold.filter(p => p[0] >= cut)) })).filter(s => s.pts.length >= 2);
    const tbl = `<div class="tbl-wrap" style="margin-top:16px"><table class="sheet"><thead><tr><th>Version</th><th class="r">For sale</th><th class="r">Median ask</th><th class="r">Sold, 12 months</th><th class="r">Median sale, 12 months</th><th class="r">Ask vs sale</th></tr></thead><tbody>
      ${vs.map((v, i) => `<tr class="click${v.id === m.id ? " me" : ""}" data-href="${modelLink(v.id)}"><td class="name"><i class="vk" style="background:${SERIES[i % SERIES.length]}"></i><a href="${modelLink(v.id)}">${esc(v.name)}</a></td><td class="r num">${v.listings || ""}</td><td class="r num">${v.median ? money(v.median) : "n/a"}</td><td class="r num">${v.sold_12m || ""}</td><td class="r num">${v.median_sold_12m ? money(v.median_sold_12m) : "n/a"}</td><td class="r">${v.median && v.median_sold_12m ? chg((v.median / v.median_sold_12m - 1) * 100) : ""}</td></tr>`).join("")}</tbody></table></div>`;
    if (!series.length) { el.innerHTML = '<p class="flat" style="margin:0 0 6px;font-size:14px">Too few dated sales in this range to draw the versions over time.</p>' + tbl; wireRows(); return; }
    el.innerHTML = `<div class="legend" style="margin-bottom:10px">${series.map(s => `<span><i class="vk" style="background:${s.color}"></i>${esc(s.v.name)}</span>`).join("")}</div>
      <div class="chart-box"><div class="cv"></div></div>${tbl}`;
    const cv = el.querySelector(".cv"), T = 14, B = 34;
    const render = () => {
      const { W, H, L, R } = chartSize(cv);
      const all = series.flatMap(s => s.pts), ys = all.map(p => p[1]).sort((a, b) => a - b);
      const ticks = niceTicks(ys[0] * 0.9, ys[ys.length - 1] * 1.08, 4), min = Math.min(ticks[0], ys[0] * 0.9), max = Math.max(ticks[ticks.length - 1], ys[ys.length - 1] * 1.08);
      const ds = all.map(p => p[0]).sort(), t0 = Date.parse(ds[0]), t1 = Math.max(Date.parse(ds[ds.length - 1]), t0 + 864e5 * 30);
      const x = d => L + (Date.parse(d) - t0) / (t1 - t0) * (W - L - R), y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
      const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
      const yrs = []; for (let yr = new Date(t0).getUTCFullYear() + 1; Date.UTC(yr, 0, 1) <= t1; yr++) yrs.push(yr);
      const step = Math.max(1, Math.ceil(yrs.length / Math.max(2, Math.floor((W - L - R) / 56))));
      const xg = (yrs.length ? yrs.filter((_, i) => i % step === 0).map(yr => [`${yr}-01-01`, yr]) : [[ds[0], dateShort(ds[0])], [ds[ds.length - 1], dateShort(ds[ds.length - 1])]])
        .map(([d, l]) => `<line class="grid-line" x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H - B}"/><text class="axis" x="${x(d)}" y="${H - 10}" text-anchor="middle">${l}</text>`).join("");
      const lines = series.map(s => { const d = s.pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
        return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.v.id === m.id ? 3.2 : 2}" stroke-linejoin="round"/>`
          + s.pts.map(p => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="7" fill="transparent" data-tip="${tipText(esc(s.v.name), [dateShort(p[0]), money(p[1])])}"/>`).join(""); }).join("");
      const me = car && car.price && car.date && car.date >= ds[0] ? `<circle cx="${x(car.date).toFixed(1)}" cy="${y(Math.min(max, Math.max(min, car.price))).toFixed(1)}" r="7" class="me-dot" data-tip="${tipText("This car", [dateShort(car.date), money(car.price)])}"/>` : "";
      cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Versions of the ${esc(m.name)} over time">${grid}${xg}${lines}${me}</svg>`;
    };
    render(); onWidth(cv, render); hoverTips(el.querySelector(".chart-box")); wireRows();
  }

  // Volume: auction sales and cars not sold, month by month.
  function volumeChart(el, pts, cut, last, car = null) {
    const lots = pts.filter(p => (p[2] === "s" || p[2] === "u") && p[0] >= cut);
    if (!lots.length) { el.innerHTML = '<div class="empty">No auction results in this range.</div>'; return; }
    const first = cut || lots[0][0];
    const months = []; for (let d = new Date(first.slice(0, 7) + "-01T00:00:00Z"); d.toISOString().slice(0, 7) <= last.slice(0, 7); d.setUTCMonth(d.getUTCMonth() + 1)) months.push(d.toISOString().slice(0, 7));
    const per = months.map(mo => { const a = lots.filter(p => p[0].startsWith(mo)); const s = a.filter(p => p[2] === "s"); return [mo, s.length, a.length - s.length, s.reduce((t, p) => t + p[1], 0)]; });
    const tot = per.reduce((t, r) => t + r[1], 0), unsold = per.reduce((t, r) => t + r[2], 0);
    el.innerHTML = `<div class="legend" style="margin-bottom:10px"><span><i class="bar-s"></i>Sold (${tot})</span><span><i class="bar-u"></i>Not sold (${unsold})</span>${tot + unsold ? `<span class="flat">Sell through ${Math.round(tot / (tot + unsold) * 100)}%</span>` : ""}</div><div class="chart-box"><div class="cv"></div></div>`;
    const cv = el.querySelector(".cv"), T = 14, B = 34;
    const render = () => {
      const { W, H, L, R } = chartSize(cv);
      const top = Math.max(1, ...per.map(r => r[1] + r[2])), ticks = niceTicks(0, top, 4).filter(t => Number.isInteger(t)), max = Math.max(top, ticks[ticks.length - 1]);
      const bw = (W - L - R) / per.length, y = v => T + (1 - v / max) * (H - T - B);
      const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("");
      const every = Math.max(1, Math.ceil(per.length / Math.max(2, Math.floor((W - L - R) / 52))));
      const bars = per.map(([mo, s, u, sum], i) => { const x = L + i * bw + bw * 0.14, w = Math.max(2, bw * 0.72);
        const lab = new Date(mo + "-15T12:00:00Z").toLocaleDateString("en-US", { month: "short", year: "numeric", timeZone: "UTC" });
        const mine = car && car.sold && car.date && car.date.startsWith(mo);
        return `<g class="bar${mine ? " me" : ""}" data-tip="${tipText(lab + (mine ? ", this car's sale" : ""), [`${s} sold`, u ? `${u} not sold` : "", sum ? `${money(sum)} in sales` : ""])}">${mine ? `<rect x="${(x - 3).toFixed(1)}" y="${(y(s + u) - 3).toFixed(1)}" width="${(w + 6).toFixed(1)}" height="${(y(0) - y(s + u) + 3).toFixed(1)}" class="me-outline"/>` : ""}${s ? `<rect x="${x.toFixed(1)}" y="${y(s).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(0) - y(s)).toFixed(1)}" fill="var(--rosso)" fill-opacity=".85"/>` : ""}${u ? `<rect x="${(x + .75).toFixed(1)}" y="${(y(s + u) + .75).toFixed(1)}" width="${(w - 1.5).toFixed(1)}" height="${Math.max(0, y(s) - y(s + u) - 1.5).toFixed(1)}" fill="var(--surface)" stroke="var(--rosso)" stroke-width="1.5"/>` : ""}<rect x="${(L + i * bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H - T - B}" fill="transparent"/></g>`
          + (i % every === 0 ? `<text class="axis" x="${(x + w / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${new Date(mo + "-15T12:00:00Z").toLocaleDateString("en-US", { month: "short", timeZone: "UTC" })}${mo.endsWith("-01") || i === 0 ? " " + mo.slice(2, 4) : ""}</text>` : ""); }).join("");
      cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Auction results by month">${grid}${bars}</svg>`;
    };
    render(); onWidth(cv, render); hoverTips(el.querySelector(".chart-box"));
  }

  // Locations: where the cars for sale are, and where auction sales took place.
  function locationsView(el, detail, pts, cut, m, car = null) {
    const count = list => { const c = {}; list.forEach(k => { if (k) c[k] = (c[k] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
    const bars = (title, rows, mineKey) => { const top = rows.length ? rows[0][1] : 1;
      const show = rows.slice(0, 12); const extra = mineKey && !show.some(r => r[0] === mineKey) ? rows.find(r => r[0] === mineKey) : null;
      if (extra) show.push(extra);

  const STATE_NAMES = { AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado", CT: "Connecticut", DE: "Delaware", FL: "Florida", GA: "Georgia", HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa", KS: "Kansas", KY: "Kentucky", LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan", MN: "Minnesota", MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire", NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota", OH: "Ohio", OK: "Oklahoma", OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TN: "Tennessee", TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia", WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming", DC: "Washington DC" };

`;

      const aTicks = niceTicks(alo, ahi, 3).filter(t => t >= alo && t <= ahi).map(t => `<text class="axis" x="${W - RR + 6}" y="${ya(t) + 4}">${short(t)}</text>`).join("");
      const every = Math.max(1, Math.ceil(w.length / Math.max(2, Math.floor((W - L - RR) / 52))));
      const bars = w.map((r, i) => { const x = L + i * bw + bw * 0.15, bwid = Math.max(2, bw * 0.7);
        const next = w[i + 1] ? w[i + 1][0] : "9999";
        const mine = car && car.listed && car.listed >= r[0] && car.listed < next;

          + (i % every === 0 ? `<text class="axis" x="${(x + bwid / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${wl(r[0])}</text>` : ""); }).join("");

  // ------------------------------------------------------------ car page
  const STATUS = { for_sale: "For sale", live: "Live auction", upcoming: "Upcoming auction", sold: "Sold", unsold: "Not sold", off_market: "Off market" };
  // Colour premiums: each colour family's price against an otherwise identical red car of the same model,
  // with its 90% range. c comes from the model file (pipeline/colors.py).
  const SWATCH = { red: "#c4161c", black: "#111316", white: "#f4f4f2", grey: "#6e7378", silver: "#c3c7cb", blue: "#1f4fa3",
    yellow: "#f2c200", green: "#1f5c3a", purple: "#5b2a86", brown: "#8a6a48", orange: "#e8701a" };
  // how long cars of a colour take to sell: from cars that sold once there are three, else how long those for sale have been listed
  const sellCell = f => {
    const sold = f.n_sold >= 3 && f.days_to_sell != null;
    if (!sold && f.days_listed == null) return '<div class="paint-days"></div>';
    return `<div class="paint-days" title="${esc(sold ? `${f.label}: ${f.days_to_sell} days on average to sell, ${plural(f.n_sold, "car")} sold` : `${f.label}: listed ${f.days_listed} days on average, ${plural(f.n_listed, "car")} for sale now`)}"><b>${sold ? f.days_to_sell : f.days_listed} days</b><small>${sold ? "avg to sell" : "avg listed so far"}</small></div>`;
  };
  function colorChart(el, c, name, car = null) {
    const mine = c && c.model, mkt = c && c.market;
    const pct = v => (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(1) + "%";
    const verdict = f => f.baseline ? "Baseline" : f.verdict === "premium" ? "Premium" : f.verdict === "discount" ? "Discount" : "No clear difference";
    const block = (r, who) => {
      const fams = r.families;
      const ext = Math.max(5, ...fams.map(f => Math.max(Math.abs(f.low_pct), Math.abs(f.high_pct))));
      const step = ext > 30 ? 20 : ext > 14 ? 10 : 5, lim = Math.ceil(ext / step) * step;
      const x = v => ((Math.max(-lim, Math.min(lim, v)) + lim) / (2 * lim) * 100).toFixed(2) + "%";
      const ticks = []; for (let t = -lim; t <= lim; t += step) ticks.push(t);
      const rows = fams.map(f => {
        const tip = f.baseline ? `${f.label}: the baseline, ${plural(f.n, "car")}` : `${f.label}: ${pct(f.premium_pct)} against red (90% range ${pct(f.low_pct)} to ${pct(f.high_pct)}), ${plural(f.n, "car")}`;
        const v = f.baseline ? "" : f.verdict;
        const mine = car && car.colour === f.family;
        return `<div class="paint-row${f.baseline ? " base" : ""}${mine ? " me" : ""}" title="${esc(tip)}">
          <div class="paint-name"><i class="swatch" style="background:${SWATCH[f.family] || "var(--chip)"}"></i><div>${esc(f.label)}${mine ? ' <span class="me-tag">This car</span>' : ""}<small>${esc(f.paints.map(p => p[0]).join(", "))}</small></div></div>
          <div class="paint-track" role="img" aria-label="${esc(tip)}"><i class="zero" style="left:${x(0)}"></i>${f.baseline ? "" : `<i class="rng ${v}" style="left:${x(f.low_pct)};width:calc(${x(f.high_pct)} - ${x(f.low_pct)})"></i>`}<i class="dot" style="left:${x(f.premium_pct)};background:${SWATCH[f.family] || "var(--muted)"}"></i></div>
          ${sellCell(f)}
          <div class="paint-val"><b class="${v}">${f.baseline ? "Baseline" : pct(f.premium_pct)}</b><small>${f.baseline ? "" : verdict(f) + ", "}${plural(f.n, "car")}</small></div></div>`;
      }).join("");
      const so = r.special_order;
      const spLine = so ? `<p style="font-size:14px;margin-top:12px"><b>Special order paint</b> ${so.verdict === "no clear difference" ? "shows no clear difference on top of its colour" : `adds ${pct(so.premium_pct)} on top of its colour`}, ${plural(so.n, "car")}.</p>` : "";
      const unnamed = r.special_unnamed ? `<p class="flat" style="font-size:13px;margin-top:6px">${plural(r.special_unnamed, "special order car")} left out: no site names ${r.special_unnamed === 1 ? "its" : "their"} colour yet.</p>` : "";
      const few = (r.too_few || []).length ? `<p class="flat" style="font-size:13px;margin-top:10px">Too few cars to measure: ${esc(r.too_few.map(([l, n]) => `${l} (${n})`).join(", "))}.</p>` : "";
      return `<div class="paint-head"><h3>${esc(who)}</h3><span>${plural(r.n, "car")}: ${r.for_sale.toLocaleString("en-US")} for sale now${r.sold ? `, ${r.sold.toLocaleString("en-US")} sold at auction in the last 18 months` : ""}</span></div>
        <div class="paint">${rows}
        <div class="paint-axis"><div></div><div>${ticks.map(t => `<span style="left:${x(t)}">${t ? pct(t).replace(".0", "") : "Red"}</span>`).join("")}</div><div></div><div></div></div></div>
        <div class="paint-notes">${spLine}</div>`;
    };
    if (!mine && !mkt) { el.innerHTML = '<div class="empty">Not enough cars with a known colour yet.</div>'; return; }
    el.innerHTML = (mine ? block(mine, name) : `<p class="flat" style="margin-top:16px">Not enough ${esc(name)} cars with a known colour to compare against red yet, so only the market wide figures are shown.</p>`)
      + (mkt ? block(mkt, "Every model") : "");
  }
  // Mileage curve: price against mileage for one model, cars for sale now and sales in the last 18 months,
  // with the fitted curve and its typical spread. mg comes from the model file (pipeline/mileage.py).
  function mileageChart(el, mg, opts = {}) {
    const all = (mg && mg.points) || [], f = mg && mg.fit;
    if (all.length < 3) { el.innerHTML = '<div class="empty">Not enough cars with a known mileage yet.</div>'; return; }
    const pred = m => Math.exp(f.a + f.b * (f.shape === "exp" ? m / 1000 : Math.log1p(m / 1000)));
    const mine = all.find(p => opts.highlight && p[3] === opts.highlight);
    const me = mine ? { miles: mine[0], price: mine[1] } : opts.me;
    const vs = f && me && me.price && me.miles != null ? (me.price / pred(me.miles) - 1) * 100 : null;
    const sortedMi = all.map(p => p[0]).sort((a, b) => a - b);
    let xmax = f ? f.x_max * 1.08 : sortedMi[sortedMi.length - 1] * 1.05;
    if (me && me.miles != null) xmax = Math.max(xmax, me.miles * 1.05);
    xmax = Math.max(xmax, 1000);
    const vis = all.filter(p => p[0] <= xmax), off = all.length - vis.length;
    const effect = !f ? "n/a" : f.change_pct > -1 ? '<span class="flat">little</span>' : chg(f.change_pct);
    el.innerHTML = `<div class="mkt-stats">${[
        ["Cars on the curve", f ? f.n : all.length], ["For sale now", mg.for_sale], ["Sold, last 18 months", mg.sold],
        [f ? `${Math.round(f.low_miles / 1000)}k to ${Math.round(f.high_miles / 1000)}k miles` : "Mileage effect", effect],
        ...(vs != null ? [["This car vs the curve", chg(vs)]] : [])].map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>
      <div class="legend" style="margin-bottom:10px"><span><i class="k k-f"></i>For sale now</span><span><i class="k k-s"></i>Sold</span>${f ? '<span><i class="line-med"></i>Mileage curve</span><span><i class="band"></i>Typical spread</span>' : ""}${me ? '<span><i class="k" style="box-shadow:0 0 0 3px var(--giallo)"></i>This car</span>' : ""}</div>
      <div class="chart-box mkt"><div class="cv"></div><div class="tip" hidden></div></div>`;
    const cv = el.querySelector(".cv"), tip = el.querySelector(".tip"), box = el.querySelector(".mkt");
    const T = 14, B = 34;
    let W, H, pos, svg, sel = -1;
    const render = () => {
    const { W: w0, H: h0, L, R, r: rad } = chartSize(cv);
    W = w0; H = h0;
    const prices = vis.map(p => p[1]).concat(me && me.price ? [me.price] : []).sort((a, b) => a - b);
    const lo = prices[Math.floor(prices.length * 0.02)], hi = prices[Math.min(prices.length - 1, Math.ceil(prices.length * 0.98) - 1)];
    const ticks = niceTicks(lo * 0.9, hi * 1.08, 4);
    const min = Math.min(ticks[0], lo * 0.9), max = Math.max(ticks[ticks.length - 1], hi * 1.08);
    const x = m => L + m / xmax * (W - L - R);
    const y = v => T + (1 - (Math.min(Math.max(v, min), max) - min) / (max - min)) * (H - T - B);
    const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
    const xg = niceTicks(0, xmax, W < 520 ? 4 : 6).filter(t => t <= xmax).map(t => `<line class="grid-line" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t ? (t >= 1000 ? Math.round(t / 1000) + "k" : t) + " mi" : "0"}</text>`).join("");
    let curve = "";
    if (f) {
      const ms = Array.from({ length: 61 }, (_, i) => i / 60 * xmax);
      const up = ms.map(m => [x(m), y(pred(m) * Math.exp(f.sigma))]), dn = ms.map(m => [x(m), y(pred(m) * Math.exp(-f.sigma))]).reverse();
      const band = [...up, ...dn].map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("") + "Z";
      const line = ms.map((m, i) => (i ? "L" : "M") + x(m).toFixed(1) + " " + y(pred(m)).toFixed(1)).join("");
      curve = `<path d="${band}" fill="var(--ink)" fill-opacity=".07"/><path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-opacity=".8"/>`;
    }
    pos = vis.map(p => [x(p[0]), y(p[1])]);
    const order = vis.map((p, i) => i).sort((i, j) => (vis[i][2] === "s") - (vis[j][2] === "s"));
    const dots = order.map(i => {
      const p = vis[i], [cx, cy] = pos[i], hit = opts.highlight && p[3] === opts.highlight;
      const style = p[2] === "s" ? 'fill="var(--rosso)" fill-opacity=".8"' : 'fill="var(--ink)" fill-opacity=".8"';
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${hit ? 7 : rad}" ${style}${hit ? ' stroke="var(--giallo)" stroke-width="3"' : ""}/>`;
    }).join("");
    const extra = me && !mine && me.price && me.miles != null
      ? `<circle cx="${x(me.miles).toFixed(1)}" cy="${y(me.price).toFixed(1)}" r="7" fill="var(--ink)" stroke="var(--giallo)" stroke-width="3"/>` : "";
    cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((opts.name || "") + " price against mileage")}">${grid}${xg}${curve}${dots}${extra}<circle class="ring" r="9" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg>`;
    svg = cv.querySelector("svg"); sel = -1; tip.hidden = true;
    };
    render();
    onWidth(cv, render);
    const nearest = e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = -1, bd = 1e9;
      pos.forEach(([px, py], i) => { const d = (px - q.x) ** 2 + (py - q.y) ** 2; if (d < bd) { bd = d; best = i; } });
      return bd < 22 * 22 ? best : -1;
    };
    const show = i => {
      sel = i;
      const ring = svg.querySelector(".ring");
      if (i < 0) { tip.hidden = true; ring.style.display = "none"; return; }
      const p = vis[i], [cx, cy] = pos[i];
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.style.display = "";
      const off = f ? (p[1] / pred(p[0]) - 1) * 100 : null;
      tip.innerHTML = `${p[5] ? photo(p[5], p[4]) : ""}<div class="tb"><b class="t">${esc(p[4] || "")}</b><span class="pr">${money(p[1])}</span>
        <span class="sub">${miles(p[0])}${off != null ? `, ${Math.abs(off).toFixed(0)}% ${off < 0 ? "below" : "above"} the curve` : ""}</span>
        <span class="sub">${p[2] === "s" ? "Sold" : "For sale"}${p[6] ? ", " + esc(p[6]) : ""}${p[7] ? (p[2] === "s" ? ", " : ", listed ") + dateLong(p[7]) : ""}</span>${p[3] ? '<span class="go">Open this car →</span>' : ""}</div>`;
      tip.hidden = false;
      const sr = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
      const px = sr.left - br.left + cx / W * sr.width, py = sr.top - br.top + cy / H * sr.height;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = px + 16;
      if (left + w > br.width - 4) left = px - w - 16;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, Math.min(py - h / 2, br.height - h - 4)) + "px";
    };
    cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const i = nearest(e); if (i !== sel) show(i); } });
    cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(-1); });
    cv.addEventListener("click", e => {
      const i = nearest(e);
      if (i < 0) return show(-1);
      if (i === sel && vis[i][3]) location.hash = "car-" + vis[i][3];
      else show(i);
    });
  }

    app.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
    let tq;
    document.getElementById("auc-q").addEventListener("input", e => { clearTimeout(tq); tq = setTimeout(() => { q = e.target.value; show(cur); }, 120); });
    show("live"); window.scrollTo(0, 0);
  }
  const daysAgo = n => { const d = new Date(D.as_of + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); };

  function viewNews() {
    app.innerHTML = pageHead("News", "News", "Ferrari headlines from the outlets we follow. Every story links to the original.")
      + `<section class="block"><div class="wrap">${newsList(D.news)}</div></section>`;
    window.scrollTo(0, 0);
  }

  function viewMethodology() {
    const r = D.rules;
    app.innerHTML = pageHead("Methodology", "How we count", "Where the numbers come from and what each one means.")
      + `<section class="block"><div class="wrap"><div class="prose">
        <h3>Sources</h3>
        <p>Asking prices come from the Ferrari dealer network's own used inventory, including cars certified under Ferrari Approved, and from dealer marketplaces: duPont Registry and ClassicCars.com. Cars for sale count when they are in the US: a car listed by a dealer in Canada or Europe is left out, wherever the site that lists it is based. Hypercars and limited series cars (the F40, F50, Enzo, LaFerrari, Monza, Daytona SP3, 812 Competizione, SF90 XX and the rest of that family) are the exception: so few exist that the world is one market for them, so they count for sale anywhere. Auction results come from around the world, from Bring a Trailer, Cars &amp; Bids, Sotheby's Motorsport, duPont Registry Live, RM Sotheby's, Gooding Christie's, Bonhams, Broad Arrow, PCARMARKET and Mecum, because a sale in London or Monaco is still a real price for the car. We collect once a day.</p>
        <h3>One car, one count</h3>
        <p>The same car is often listed on several sites at once. We match cars by VIN, then by chassis number for older cars, then by model, year, mileage, colour and seller. Each physical car moves the numbers once. When one car shows two prices, the selling dealer's own price wins.</p>
        <h3>Median ask</h3>
        <p>The middle asking price of every tracked car of a model on a given day. Cars listed as price on request are left out. A listing counts as gone after two successful daily checks in a row without it.</p>
        <h3>Market movers</h3>
        <p>Each model's asking prices this week against the same model a week earlier, compared model year by model year so a change in the mix of years does not look like a move. A batch of cheaper cars arriving or a round of price cuts both pull a model down, and the reverse pushes it up. A model needs at least five cars for sale in both weeks. The most active model is the one with the most cars added, sold or taken off the market over the week.</p>
        <h3>Mileage curve</h3>
        <p>Each car page plots its model's prices against mileage: every car for sale now and every auction sale in the last 18 months that gave a mileage. Older sales are left out because the market has moved since. The curve is fitted to the logarithm of price, in whichever of two shapes fits the cars better: a steady percentage per mile, or a steeper drop over the first miles that then flattens. Cars far off the curve, such as race cars or wrecks, are set aside before the final fit. The shaded band is the typical spread around the curve. Model year and specification also move prices, so the curve is a guide rather than a valuation.</p>
        <h3>Colour premiums</h3>
        <p>Each model page shows what every exterior colour is worth against red. Sites name paint their own way, so every name is first put in a family: Rosso Corsa, Rosso Scuderia and plain Red are all red, Grigio Silverstone is grey. Paint Ferrari makes outside its standard range, which Ferrari Approved lists only as "Extra Sample", is still a colour: such a car takes its colour from another site that lists the same VIN, and what the one off paint adds is measured separately, so it is not credited to the colour. A special order car no site names a colour for is left out. Year and mileage move price far more than paint, and one colour's cars may simply be newer, so we fit each model's prices to year, mileage and colour together and read off what the colour alone adds. The range shown is 90% sure. A colour needs at least three cars in the model, and red at least three, before it is shown. The figure for every model compares cars only within the same model and years, never a 296 against a Roma.</p>
        <h3>Auction results</h3>
        <p>Houses report prices differently. Bring a Trailer, Cars &amp; Bids, Sotheby's Motorsport and duPont Registry Live show the winning bid. RM Sotheby's and Mecum include the buyer's premium. Prices in pounds, euros or francs are converted to US dollars at the day's rate. A result far outside the model's asking range is kept on its model page but left out of the headline insights, because it is more often a data error than a real sale.</p>
        <h3>What these numbers are not</h3>
        <p>Asking prices are what sellers hope to get. They are not appraisals or offers, and individual cars vary with mileage, history and specification.</p>
      </div></div></section>`;
    window.scrollTo(0, 0);
  }

  function viewPrivacy() {
    app.innerHTML = pageHead("Privacy", "Privacy", "")
      + `<section class="block"><div class="wrap"><div class="prose">
        <p>Rosso Market does not ask you for an account and does not collect personal information. We do not use advertising or tracking cookies.</p>
        <p>Our host keeps standard server logs, such as IP address and pages requested, for security and to keep the site running. If we add privacy friendly visitor counts later, this page will say so.</p>
        <p>Listings and auction results shown here are about cars, gathered from public pages and licensed data. We do not publish sellers' or buyers' personal details. Links take you to the original listing, where that site's own privacy policy applies.</p>
      </div></div></section>`;
    window.scrollTo(0, 0);
  }

  function notFound() {
    app.innerHTML = `<section class="block"><div class="wrap"><h2>Page not found</h2><p><a class="link-more" href="#overview">Back to the overview</a></p></div></section>`;
  }

  function wireRows() {
    app.querySelectorAll("tr[data-href]").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a")) location.hash = tr.dataset.href.slice(1); }));
  }

  // ------------------------------------------------------------ chrome
  function buildMenu() {
    document.getElementById("menu-grid").innerHTML = D.families.map(f => `<div><h4>${esc(f.name)}</h4>
      ${f.models.map(id => byId[id]).filter(Boolean).map(m => `<a href="${modelLink(m.id)}"><span>${esc(m.name)}</span><span class="num">${m.listings || (m.auction || {}).sold_12m || ""}</span></a>`).join("")}</div>`).join("");
  }

  function buildFooter() {
    const h = D.health || [];
    document.getElementById("foot").innerHTML = `<div>
      <a class="logo" href="#overview"><span class="logo-mark" aria-hidden="true">RM</span><span class="logo-word">Rosso <span>Market</span></span></a>
      <nav aria-label="Footer"><a href="#overview">Overview</a><a href="#auctions">Auctions</a><a href="#news">News</a><a href="#methodology">Methodology</a><a href="#privacy">Privacy</a></nav>
      <p style="margin-top:18px;max-width:60ch">Rosso Market is independent and is not affiliated with or endorsed by Ferrari S.p.A. Prices are asking prices and auction results gathered from public sources and licensed data feeds. They can contain errors and are not an offer or a valuation.</p>
      <p>Data as of ${dateLong(D.as_of)}.</p></div>
      <div><div class="eyebrow" style="margin-bottom:10px">Data sources, last run</div><div class="health">
      ${h.map(s => `<div><span>${esc(s.source)}${s.accepted != null ? ` <span class="num">(${s.accepted})</span>` : ""}</span><span class="state ${s.state}">${s.state}</span></div>`).join("") || "<div>No runs yet</div>"}</div></div>`;
  }

  // ------------------------------------------------------------ search
  // Every car we have seen stays findable by its VIN (or chassis number on older cars), sold or
  // not, and models are found by name. The VIN index loads the first time the box is used.
  let SEARCH = null, sresItems = [], sresOn = -1;
  const loadSearch = () => SEARCH || (SEARCH = fetch("data/search.json").then(r => r.ok ? r.json() : []).catch(() => []));
  function searchResults(raw, index) {
    const q = raw.trim();
    const key = q.toUpperCase().replace(/[^A-Z0-9]/g, "");
    const out = [];
    if (key.length >= 4) {
      for (const [vin, id, title, status, price] of index) {
        const at = vin.indexOf(key);
        if (at >= 0) out.push({ href: "#car-" + id, title, vin, at, len: key.length, status, price, exact: vin === key });
        if (out.length >= 40) break;
      }
      out.sort((a, b) => b.exact - a.exact || (a.at === a.vin.length - a.len ? -1 : 0) - (b.at === b.vin.length - b.len ? -1 : 0));
    }
    const words = q.toLowerCase();
    if (words.length >= 2) {
      D.models.filter(m => m.name.toLowerCase().includes(words) || m.id.includes(words.replace(/\s+/g, "-")))
        .slice(0, 6).forEach(m => out.push({ href: modelLink(m.id), title: m.name, model: true, listings: m.listings }));
    }
    return out.slice(0, 12);
  }
  function showResults(list, q) {
    const box = document.getElementById("sres"), input = document.getElementById("q");
    sresItems = list; sresOn = list.length ? 0 : -1;
    if (!q.trim()) { box.hidden = true; input.setAttribute("aria-expanded", "false"); return; }
    const mark = r => esc(r.vin.slice(0, r.at)) + "<mark>" + esc(r.vin.slice(r.at, r.at + r.len)) + "</mark>" + esc(r.vin.slice(r.at + r.len));
    box.innerHTML = list.length ? list.map((r, i) => `<a href="${r.href}" role="option" class="${i === sresOn ? "on" : ""}">
        <b>${esc(r.title || "")}</b>
        ${r.model ? `<span>Model page${r.listings ? ", " + plural(r.listings, "car") + " for sale" : ""}</span>`
                  : `<span class="vin">${mark(r)}</span><span>${esc(r.status || "")}${r.price ? ", " + money(r.price) : ""}</span>`}</a>`).join("")
      : `<p>No car with that VIN in our records. Enter at least 4 characters of the VIN or chassis number, or a model name.</p>`;
    box.hidden = false; input.setAttribute("aria-expanded", "true");
  }
  function initSearch() {
    const input = document.getElementById("q"), box = document.getElementById("sres");
    input.addEventListener("focus", loadSearch, { once: true });
    input.addEventListener("input", async () => {
      const q = input.value;
      const index = await loadSearch();
      if (input.value === q) showResults(searchResults(q, index), q);
    });
    input.addEventListener("keydown", e => {
      if (box.hidden) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (!sresItems.length) return;
        sresOn = (sresOn + (e.key === "ArrowDown" ? 1 : -1) + sresItems.length) % sresItems.length;
        box.querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === sresOn));
      } else if (e.key === "Enter" && sresOn >= 0) {
        e.preventDefault();
        location.hash = sresItems[sresOn].href.slice(1);
        box.hidden = true; input.blur();
      } else if (e.key === "Escape") { box.hidden = true; }
    });
    box.addEventListener("click", e => { if (e.target.closest("a")) { box.hidden = true; input.value = ""; } });
    document.addEventListener("click", e => { if (!e.target.closest(".search")) box.hidden = true; });
  }

  function route() {
    cleanupPage();
    setTimeout(() => fitRows(), 0);
    const h = location.hash.slice(1) || "overview";
    document.getElementById("models-menu").open = false;
    document.querySelectorAll("nav.main [data-nav]").forEach(a => a.dataset.nav === h ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    // the Models menu is the current section on model and family pages (Hypercars has its own link)
    document.querySelector("#models-menu summary").classList.toggle("current", h.startsWith("model-") || (h.startsWith("family-") && h !== "family-hypercars-and-limited-series"));
    if (h === "overview") return viewOverview();
    if (h.startsWith("model-")) return viewModel(h.slice(6));
    if (h.startsWith("car-")) return viewCar(h.slice(4));
    if (h.startsWith("family-")) return viewFamily(h.slice(7));
    if (h === "auctions") return viewAuctions();
    if (h === "news") return viewNews();
    if (h === "methodology") return viewMethodology();
    if (h === "privacy") return viewPrivacy();
    notFound();
  }

  document.addEventListener("click", e => {
    const menu = document.getElementById("models-menu");
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });
  document.addEventListener("keydown", e => {
    if (!lb().hidden) {
      if (e.key === "Escape") closePhotos();
      if (e.key === "ArrowRight") showPhoto(LB.i + 1);
      if (e.key === "ArrowLeft") showPhoto(LB.i - 1);
      return;
    }
    if (e.key === "Escape") document.getElementById("models-menu").open = false;
  });
  document.getElementById("lb-close").addEventListener("click", closePhotos);
  document.getElementById("lb-prev").addEventListener("click", () => showPhoto(LB.i - 1));
  document.getElementById("lb-next").addEventListener("click", () => showPhoto(LB.i + 1));
  document.getElementById("lb-strip").addEventListener("click", e => { if (e.target.dataset.j) showPhoto(+e.target.dataset.j); });
  document.getElementById("lb-img").addEventListener("click", () => showPhoto(LB.i + 1));
  let sx = null;
  lb().addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  lb().addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) showPhoto(LB.i + (dx < 0 ? 1 : -1)); sx = null; });
  window.addEventListener("hashchange", () => { if (!lb().hidden) closePhotos(); });

  fetch("data/site.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    D = data;
    D.models.forEach(m => byId[m.id] = m);
    document.getElementById("sample-bar").hidden = !D.sample;
    buildMenu(); buildFooter(); initSearch();
    window.addEventListener("hashchange", route);
    route();
  }).catch(() => {
    app.innerHTML = '<div class="wrap loading">Market data could not be loaded. Run the pipeline to create data/site.json, then serve this folder over HTTP.</div>';
  });
})();
</script>
