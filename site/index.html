    const resTable = items => `<div class="tbl-wrap"><table class="sheet"><thead><tr><th></th><th>Lot</th><th>Sale</th><th>Country</th><th>Closed</th><th class="r">Mileage</th><th>Result</th><th class="r">Price</th></tr></thead><tbody>
      ${items.map(r => `<tr><td class="thumb">${photo(r.image, "")}</td><td class="name"><a ${carLink(r)}>${esc(r.title)}</a></td><td>${saleLink(r) || esc(r.auction_house)}<div class="flat" style="font-size:12px">${esc(r.auction_house)}</div></td><td>${esc(countryOf(r))}</td><td class="num">${r.ends_at ? dateLong(r.ends_at.slice(0, 10)) : ""}</td><td class="r num">${miles(r.mileage_mi)}</td>
      <td><span class="chip ${r.status}">${r.status === "sold" ? "Sold" : "Not sold"}</span></td><td class="r num">${money(r.price_usd)}</td></tr>`).join("")}</tbody></table></div>`;
    const mRes = document.getElementById("m-res");
    if (detail.results.length) switchable(mRes, detail.results, lotCard, resTable);
    else mRes.innerHTML = '<div class="empty">No auction results recorded yet.</div>';
  }

  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // ------------------------------------------------------------ market chart
  // Every sale and high bid for a model, the cars for sale now, and the median ask over time, on one
  // chart, like classic.com. Hover (or tap) a dot to see which car it is. Click it to open that car.
  // Asking dots are cars listed now only: past asks are carried by the median ask line (opts.ask:
  // [[day, median, cars], ...] from the daily snapshots).
  const KINDS = { s: ["Sold", "k-s"], u: ["High bid", "k-u"], f: ["For sale now", "k-f"] };
  function marketChart(el, points, opts = {}) {
    points = points.filter(p => KINDS[p[2]]);
    const ask = (opts.ask || []).filter(p => p[1]).map(p => [p[0], p[1], p[2]]);
    if (!points.length && !ask.length) { el.innerHTML = '<div class="empty">No dated sales or asking prices yet.</div>'; return; }
    const ends = [...points.map(p => p[0]), ...ask.map(p => p[0])].sort();
    const first = ends[0], last = ends[ends.length - 1];
    const span = (Date.parse(last) - Date.parse(first)) / 864e5;
    let range = span > 3 * 365 ? "3y" : "all";
    const shown = { s: true, u: true, f: true, m: true };
    const have = new Set(points.map(p => p[2]));
    el.innerHTML = `<div class="mkt-stats" id="ms"></div>
      <div class="mkt-controls">
        <div class="seg" role="group" aria-label="Time range">${[["1y", "1 year"], ["3y", "3 years"], ["5y", "5 years"], ["all", "All"]].map(([k, l]) => `<button type="button" data-r="${k}">${l}</button>`).join("")}</div>
        <div class="keys" role="group" aria-label="Show">${Object.entries(KINDS).filter(([k]) => have.has(k)).map(([k, [l, c]]) => `<button type="button" data-k="${k}" aria-pressed="true"><i class="k ${c}"></i>${l}</button>`).join("")}${ask.length ? '<button type="button" data-k="m" aria-pressed="true"><i class="line-ask"></i>Median ask</button>' : ""}<span class="legend"><span><i class="line-med"></i>Running median sold</span></span></div>
      </div>
      <div class="chart-box mkt"><div class="cv"></div><div class="tip" hidden></div></div>`;
    const cv = el.querySelector(".cv"), tip = el.querySelector(".tip"), box = el.querySelector(".mkt");
    let vis = [], pos = [], sel = -1, svg = null;
    let W = 900, H = 340, L = 64, R = 18, rad = 4.2;
    const T = 14, B = 34;

    function draw() {
      ({ W, H, L, R, r: rad } = chartSize(cv));
      el.querySelectorAll("[data-r]").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === range));
      const cut = range === "all" ? "" : (() => { const d = new Date(last + "T12:00:00Z"); d.setUTCFullYear(d.getUTCFullYear() - +range[0]); return d.toISOString().slice(0, 10); })();
      vis = points.filter(p => p[0] >= cut && shown[p[2]]);
      const av = shown.m ? ask.filter(p => p[0] >= cut) : [];
      const sold = vis.filter(p => p[2] === "s").map(p => p[1]).sort((a, b) => a - b);
      const med = sold.length ? sold[Math.floor(sold.length / 2)] : null;
      const lastSold = [...vis].reverse().find(p => p[2] === "s");
      el.querySelector("#ms").innerHTML = [["Median sold", med ? money(med) : "n/a"], ["Sales", sold.length], ["Lowest sale", sold.length ? money(sold[0]) : "n/a"],
        ["Top sale", sold.length ? money(sold[sold.length - 1]) : "n/a"], ["Most recent", lastSold ? money(lastSold[1]) : "n/a"],
        ["Median ask", ask.length ? money(ask[ask.length - 1][1]) : "n/a"], ["For sale now", points.filter(p => p[2] === "f").length]].map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("");
      if (!vis.length && !av.length) { cv.innerHTML = '<p class="flat" style="padding:20px">Nothing to show for this range.</p>'; pos = []; return; }
      const prices = [...vis.map(p => p[1]), ...av.map(p => p[1])].sort((a, b) => a - b);
      const lo = prices[Math.floor(prices.length * 0.02)], hi = prices[Math.min(prices.length - 1, Math.ceil(prices.length * 0.98) - 1)];
      const ticks = niceTicks(lo * 0.9, hi * 1.08, 4);
      const min = Math.min(ticks[0], lo * 0.9), max = Math.max(ticks[ticks.length - 1], hi * 1.08);
      const ds = [...vis.map(p => p[0]), ...av.map(p => p[0])].sort();
      const t0 = Date.parse(ds[0]), t1 = Math.max(Date.parse(ds[ds.length - 1]), t0 + 864e5 * 30);
      const x = d => L + (Date.parse(d) - t0) / (t1 - t0) * (W - L - R);
      const y = v => T + (1 - (Math.min(Math.max(v, min), max) - min) / (max - min)) * (H - T - B);
      const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
      const days = (t1 - t0) / 864e5, xt = [];
      if (days > 500) { const yStep = Math.max(1, Math.ceil(days / 365 / Math.max(1, Math.floor((W - L - R) / 56)))); for (let yr = new Date(t0).getUTCFullYear() + 1; Date.UTC(yr, 0, 1) <= t1; yr += yStep) xt.push([`${yr}-01-01`, yr]); }
      else { const d0 = new Date(t0), fit = Math.max(1, Math.floor((W - L - R) / 64)), stepM = Math.max(days > 200 ? 2 : 1, Math.ceil(days / 30.4 / fit)); for (let d = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); d.getTime() <= t1; d.setUTCMonth(d.getUTCMonth() + stepM)) { const iso = d.toISOString().slice(0, 10); xt.push([iso, d.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }) + (d.getUTCMonth() === 0 ? " " + d.getUTCFullYear() : "")]); } }
      const xg = xt.map(([d, l]) => `<line class="grid-line" x1="${x(d)}" x2="${x(d)}" y1="${T}" y2="${H - B}"/><text class="axis" x="${x(d)}" y="${H - 10}" text-anchor="middle">${l}</text>`).join("");
      pos = vis.map(p => [x(p[0]), y(p[1])]);
      const order = { a: 0, u: 1, f: 2, s: 3 };
      const idx = vis.map((p, i) => i).sort((i, j) => order[vis[i][2]] - order[vis[j][2]]);
      const dots = idx.map(i => {
        const p = vis[i], [cx, cy] = pos[i], me = opts.highlight && p[3] === opts.highlight;
        if (me) return "";
        const style = p[2] === "s" ? 'fill="var(--sold)" fill-opacity=".78"' : p[2] === "u" ? 'fill="none" stroke="var(--sold)" stroke-width="1.6"'
          : p[2] === "f" ? 'fill="var(--ask)" fill-opacity=".78"' : 'fill="var(--ink-3)" fill-opacity=".6"';
        return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad}" ${style}/>`;
      }).join("");
      const sp = vis.map((p, i) => [p, i]).filter(([p]) => p[2] === "s");
      let path = "";
      if (sp.length >= 6) {
        const m = a => { const q = [...a].sort((u, v) => u - v); return q[Math.floor(q.length / 2)]; };
        path = sp.map(([p], i) => [p[0], m(sp.slice(Math.max(0, i - 8), i + 1).map(([q]) => q[1]))]).slice(4)
          .map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
      }
      // the median ask: a line once there are two days, a mark on the one day before that
      const askLine = av.length >= 2
        ? `<path d="${av.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("")}" fill="none" stroke="var(--ask-deep)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><title>Median ask ${money(av[av.length - 1][1])}</title></path>`
        : av.length ? `<rect x="${(x(av[0][0]) - 5).toFixed(1)}" y="${(y(av[0][1]) - 1.5).toFixed(1)}" width="10" height="3" rx="1.5" fill="var(--ask-deep)"><title>Median ask ${money(av[0][1])}</title></rect>` : "";
      const meI = opts.highlight ? vis.findIndex(p => p[3] === opts.highlight) : -1;
      const meDot = meI >= 0 ? `<circle cx="${pos[meI][0].toFixed(1)}" cy="${pos[meI][1].toFixed(1)}" r="8" fill="var(--giallo)" stroke="var(--ink)" stroke-width="2.5"/>` : "";
      cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "Market")}">${grid}${xg}
        <g class="dots">${dots}</g>${path ? `<path d="${path}" fill="none" stroke="var(--sold-deep)" stroke-width="2.2"/>` : ""}${askLine}${meDot}<circle class="ring" r="10" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg>`;
      svg = cv.querySelector("svg");
      sel = -1; tip.hidden = true;
    }
    onWidth(cv, draw);

    function nearest(e) {
      if (!svg || !pos.length) return -1;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = -1, bd = 1e9;
      pos.forEach(([px, py], i) => { const d = (px - q.x) ** 2 + (py - q.y) ** 2; if (d < bd) { bd = d; best = i; } });
      return bd < 22 * 22 ? best : -1;
    }
    function show(i) {
      sel = i;
      const ring = svg.querySelector(".ring");
      if (i < 0) { tip.hidden = true; ring.style.display = "none"; return; }
      const p = vis[i], [cx, cy] = pos[i];
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.style.display = "";
      tip.innerHTML = `${p[5] ? photo(p[5], p[4]) : ""}<div class="tb"><b class="t">${esc(p[4] || "")}</b><span class="pr">${money(p[1])}</span>
        <span class="sub">${KINDS[p[2]][0]}${p[6] ? ", " + esc(p[6]) : ""}</span>${p[7] || p[8] ? `<span class="sub">${[p[7], p[8]].filter(Boolean).map(esc).join(" · ")}</span>` : ""}<span class="sub">${dateLong(p[0])}</span>${p[3] ? '<span class="go">Open this car ${ARROW}</span>' : ""}</div>`;
      tip.hidden = false;
      const sr = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
      const px = sr.left - br.left + cx / W * sr.width, py = sr.top - br.top + cy / H * sr.height;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = px + 16, top = py - h / 2;
      if (left + w > br.width - 4) left = px - w - 16;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, Math.min(top, br.height - h - 4)) + "px";
    }
    cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const i = nearest(e); if (i !== sel) show(i); } });
    cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(-1); });
    cv.addEventListener("click", e => {
      const i = nearest(e);
      if (i < 0) return show(-1);
      // mouse: the card is already showing, so a click opens the car. Touch: first tap shows it.
      if (i === sel && vis[i][3]) location.hash = "car-" + vis[i][3];
      else show(i);
    });
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => { range = b.dataset.r; draw(); }));
    el.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
      shown[b.dataset.k] = !shown[b.dataset.k]; b.setAttribute("aria-pressed", shown[b.dataset.k]); draw();
    }));
    draw();
  }

  // ------------------------------------------------------------ photos viewer
  let LB = { list: [], i: 0 };
  const lb = () => document.getElementById("lb");
  function openPhotos(list, i) {
    LB = { list, i };
    document.getElementById("lb-strip").innerHTML = list.map((u, j) => `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-j="${j}">`).join("");
    lb().hidden = false; document.body.style.overflow = "hidden";
    showPhoto(i);
    document.getElementById("lb-close").focus();
  }
  function showPhoto(i) {
    const n = LB.list.length; LB.i = (i + n) % n;
    document.getElementById("lb-img").src = LB.list[LB.i];
    document.getElementById("lb-count").textContent = `${LB.i + 1} of ${n}`;
    document.querySelectorAll("#lb-strip img").forEach((im, j) => { im.classList.toggle("on", j === LB.i); if (j === LB.i) im.scrollIntoView({ block: "nearest", inline: "center" }); });
  }
  function closePhotos() { lb().hidden = true; document.body.style.overflow = ""; }

  // ------------------------------------------------------------ car page
  const STATUS = { for_sale: "For sale", live: "Live auction", upcoming: "Upcoming auction", sold: "Sold", unsold: "Not sold", off_market: "Off market" };
  // Colour premiums: each colour family's price against an otherwise identical red car of the same model,
  // with its 90% range. c comes from the model file (pipeline/colors.py).
  const SWATCH = { red: "#c4161c", black: "#111316", white: "#f4f4f2", grey: "#6e7378", silver: "#c3c7cb", blue: "#1f4fa3",
    yellow: "#f2c200", green: "#1f5c3a", purple: "#5b2a86", brown: "#8a6a48", orange: "#e8701a" };
  function colorChart(el, c, name) {
    const mine = c && c.model, mkt = c && c.market;
    const pct = v => (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(1) + "%";
    const verdict = f => f.baseline ? "Baseline" : f.verdict === "premium" ? "Premium" : f.verdict === "discount" ? "Discount" : "No clear difference";
    const block = (r, who) => {
      const fams = r.families;
      const ext = Math.max(5, ...fams.map(f => Math.max(Math.abs(f.low_pct), Math.abs(f.high_pct))));
      const step = ext > 30 ? 20 : ext > 14 ? 10 : 5, lim = Math.ceil(ext / step) * step;
      const x = v => ((Math.max(-lim, Math.min(lim, v)) + lim) / (2 * lim) * 100).toFixed(2) + "%";
      const ticks = []; for (let t = -lim; t <= lim; t += step) ticks.push(t);
      const rows = fams.map(f => {
        const tip = f.baseline ? `${f.label}: the baseline, ${plural(f.n, "car")}` : `${f.label}: ${pct(f.premium_pct)} against red (90% range ${pct(f.low_pct)} to ${pct(f.high_pct)}), ${plural(f.n, "car")}`;
        return `<div class="paint-row" title="${esc(tip)}">
          <div class="paint-name"><i class="swatch" style="background:${SWATCH[f.family] || "var(--wash)"}"></i><div>${esc(f.label)}<small>${esc(f.paints.map(p => p[0]).join(", "))}</small></div></div>
          <div class="paint-track" role="img" aria-label="${esc(tip)}"><i class="zero" style="left:${x(0)}"></i>${f.baseline ? "" : `<i class="rng" style="left:${x(f.low_pct)};width:calc(${x(f.high_pct)} - ${x(f.low_pct)})"></i>`}<i class="dot ${f.baseline ? "base" : f.verdict}" style="left:${x(f.premium_pct)}"></i></div>
          <div class="paint-val num">${f.baseline ? "Red = 0%" : pct(f.premium_pct)}<small>${verdict(f)}</small><small>${plural(f.n, "car")}</small></div></div>`;
      }).join("");
      const so = r.special_order;
      const spLine = so ? `<p style="font-size:14px;margin-top:12px"><b>Special order paint</b> (Ferrari's Extra Sample, outside the standard range) ${so.verdict === "no clear difference" ? "shows no clear difference on top of its colour" : `adds ${pct(so.premium_pct)} on top of its colour`}: 90% range ${pct(so.low_pct)} to ${pct(so.high_pct)}, ${plural(so.n, "car")}. Each of these cars is counted in its real colour above.</p>` : "";
      const unnamed = r.special_unnamed ? `<p class="flat" style="font-size:13px;margin-top:6px">${plural(r.special_unnamed, "special order car")} left out: no site names ${r.special_unnamed === 1 ? "its" : "their"} colour yet.</p>` : "";
      const few = (r.too_few || []).length ? `<p class="flat" style="font-size:13px;margin-top:10px">Too few cars to measure: ${esc(r.too_few.map(([l, n]) => `${l} (${n})`).join(", "))}.</p>` : "";
      return `<h3 style="margin:22px 0 10px">${esc(who)}</h3><div class="paint"><div class="paint-row head"><div>Colour</div><div>Against red, with 90% range</div><div style="text-align:right">Premium</div></div>${rows}
        <div class="paint-axis"><div></div><div>${ticks.map(t => `<span style="left:${x(t)}">${t ? pct(t).replace(".0", "") : "Red"}</span>`).join("")}</div><div></div></div></div>${spLine}${unnamed}${few}
        <p class="flat" style="font-size:13px;margin-top:6px">${plural(r.n, "car")}: ${r.for_sale.toLocaleString("en-US")} for sale now${r.sold ? `, ${r.sold.toLocaleString("en-US")} sold at auction in the last 18 months` : ""}.</p>`;
    };
    if (!mine && !mkt) { el.innerHTML = '<div class="empty">Not enough cars with a known colour yet.</div>'; return; }
    el.innerHTML = `<p class="flat" style="margin:-6px 0 4px;font-size:14px;max-width:80ch">What each colour adds or takes off the price of a car that is otherwise the same: same model, same year, same mileage, painted red instead. A dot right of the line means buyers are asked to pay more than for red. Where the range crosses the line, the cars do not show a clear difference yet.</p>`
      + (mine ? block(mine, name) : `<p class="flat" style="margin-top:16px">Not enough ${esc(name)} cars with a known colour to compare against red yet, so only the market wide figures are shown.</p>`)
      + (mkt ? block(mkt, "Every model") : "");
  }
  // Mileage curve: price against mileage for one model, cars for sale now and sales in the last 18 months,
  // with the fitted curve and its typical spread. mg comes from the model file (pipeline/mileage.py).
  function mileageChart(el, mg, opts = {}) {
    const all = (mg && mg.points) || [], f = mg && mg.fit;
    if (all.length < 3) { el.innerHTML = '<div class="empty">Not enough cars with a known mileage yet.</div>'; return; }
    const pred = m => Math.exp(f.a + f.b * (f.shape === "exp" ? m / 1000 : Math.log1p(m / 1000)));
    const mine = all.find(p => opts.highlight && p[3] === opts.highlight);
    const me = mine ? { miles: mine[0], price: mine[1] } : opts.me;
    const vs = f && me && me.price && me.miles != null ? (me.price / pred(me.miles) - 1) * 100 : null;
    const sortedMi = all.map(p => p[0]).sort((a, b) => a - b);
    let xmax = f ? f.x_max * 1.08 : sortedMi[sortedMi.length - 1] * 1.05;
    if (me && me.miles != null) xmax = Math.max(xmax, me.miles * 1.05);
    xmax = Math.max(xmax, 1000);
    const vis = all.filter(p => p[0] <= xmax), off = all.length - vis.length;
    const effect = !f ? "n/a" : f.change_pct > -1 ? '<span class="flat">little</span>' : chg(f.change_pct);
    el.innerHTML = `<div class="mkt-stats">${[
        ["Cars on the curve", f ? f.n : all.length], ["For sale now", mg.for_sale], ["Sold, last 18 months", mg.sold],
        [f ? `${Math.round(f.low_miles / 1000)}k to ${Math.round(f.high_miles / 1000)}k miles` : "Mileage effect", effect],
        ...(vs != null ? [["This car vs the curve", chg(vs)]] : [])].map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>
      <div class="legend" style="margin-bottom:10px"><span><i class="k k-f"></i>For sale now</span><span><i class="k k-s"></i>Sold</span>${f ? '<span><i class="line-med" style="background:var(--ink)"></i>Mileage curve</span><span><i class="band"></i>Typical spread</span>' : ""}${me ? '<span><i class="k" style="background:var(--giallo);box-shadow:inset 0 0 0 2px var(--ink)"></i>This car</span>' : ""}</div>
      <div class="chart-box mkt"><div class="cv"></div><div class="tip" hidden></div></div>
      <p class="flat" style="font-size:13px;margin-top:10px">${f
        ? `Going from ${miles(f.low_miles)} to ${miles(f.high_miles)} moves a typical ${esc(opts.name || "car")} from ${money(f.low_price)} to ${money(f.high_price)}. `
        : "There are not enough cars with spread out mileage to fit a curve yet. "}${vs != null ? `This car ${opts.verb || "is priced"} ${Math.abs(vs).toFixed(1)}% ${vs < 0 ? "below" : "above"} what the curve expects for its mileage. ` : ""}Model year and spec also move prices, so read the curve as a guide.${off ? ` ${plural(off, "car")} above ${miles(xmax)} not shown.` : ""}</p>`;
    const cv = el.querySelector(".cv"), tip = el.querySelector(".tip"), box = el.querySelector(".mkt");
    const T = 14, B = 34;
    let W, H, pos, svg, sel = -1;
    const render = () => {
    const { W: w0, H: h0, L, R, r: rad } = chartSize(cv);
    W = w0; H = h0;
    const prices = vis.map(p => p[1]).concat(me && me.price ? [me.price] : []).sort((a, b) => a - b);
    const lo = prices[Math.floor(prices.length * 0.02)], hi = prices[Math.min(prices.length - 1, Math.ceil(prices.length * 0.98) - 1)];
    const ticks = niceTicks(lo * 0.9, hi * 1.08, 4);
    const min = Math.min(ticks[0], lo * 0.9), max = Math.max(ticks[ticks.length - 1], hi * 1.08);
    const x = m => L + m / xmax * (W - L - R);
    const y = v => T + (1 - (Math.min(Math.max(v, min), max) - min) / (max - min)) * (H - T - B);
    const grid = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
    const xg = niceTicks(0, xmax, W < 520 ? 4 : 6).filter(t => t <= xmax).map(t => `<line class="grid-line" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}"/><text class="axis" x="${x(t)}" y="${H - 10}" text-anchor="middle">${t ? (t >= 1000 ? Math.round(t / 1000) + "k" : t) + " mi" : "0"}</text>`).join("");
    let curve = "";
    if (f) {
      const ms = Array.from({ length: 61 }, (_, i) => i / 60 * xmax);
      const up = ms.map(m => [x(m), y(pred(m) * Math.exp(f.sigma))]), dn = ms.map(m => [x(m), y(pred(m) * Math.exp(-f.sigma))]).reverse();
      const band = [...up, ...dn].map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("") + "Z";
      const line = ms.map((m, i) => (i ? "L" : "M") + x(m).toFixed(1) + " " + y(pred(m)).toFixed(1)).join("");
      curve = `<path d="${band}" fill="var(--ink)" fill-opacity=".08"/><path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.2"/>`;
    }
    pos = vis.map(p => [x(p[0]), y(p[1])]);
    const order = vis.map((p, i) => i).sort((i, j) => (vis[i][2] === "s") - (vis[j][2] === "s"));
    const dots = order.map(i => {
      const p = vis[i], [cx, cy] = pos[i], hit = opts.highlight && p[3] === opts.highlight;
      if (hit) return "";
      const style = p[2] === "s" ? 'fill="var(--sold)" fill-opacity=".78"' : 'fill="var(--ask)" fill-opacity=".78"';
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad}" ${style}/>`;
    }).join("");
    const hitI = opts.highlight ? vis.findIndex(p => p[3] === opts.highlight) : -1;
    const hitDot = hitI >= 0 ? `<circle cx="${pos[hitI][0].toFixed(1)}" cy="${pos[hitI][1].toFixed(1)}" r="8" fill="var(--giallo)" stroke="var(--ink)" stroke-width="2.5"/>` : "";
    const extra = me && !mine && me.price && me.miles != null
      ? `<circle cx="${x(me.miles).toFixed(1)}" cy="${y(me.price).toFixed(1)}" r="8" fill="var(--giallo)" stroke="var(--ink)" stroke-width="2.5"/>` : "";
    cv.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((opts.name || "") + " price against mileage")}">${grid}${xg}${curve}<g class="dots">${dots}</g>${hitDot}${extra}<circle class="ring" r="10" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg>`;
    svg = cv.querySelector("svg"); sel = -1; tip.hidden = true;
    };
    render();
    onWidth(cv, render);
    const nearest = e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = -1, bd = 1e9;
      pos.forEach(([px, py], i) => { const d = (px - q.x) ** 2 + (py - q.y) ** 2; if (d < bd) { bd = d; best = i; } });
      return bd < 22 * 22 ? best : -1;
    };
    const show = i => {
      sel = i;
      const ring = svg.querySelector(".ring");
      if (i < 0) { tip.hidden = true; ring.style.display = "none"; return; }
      const p = vis[i], [cx, cy] = pos[i];
      ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.style.display = "";
      const off = f ? (p[1] / pred(p[0]) - 1) * 100 : null;
      tip.innerHTML = `${p[5] ? photo(p[5], p[4]) : ""}<div class="tb"><b class="t">${esc(p[4] || "")}</b><span class="pr">${money(p[1])}</span>
        <span class="sub">${miles(p[0])}${off != null ? `, ${Math.abs(off).toFixed(0)}% ${off < 0 ? "below" : "above"} the curve` : ""}</span>
        <span class="sub">${p[2] === "s" ? "Sold" : "For sale"}${p[6] ? ", " + esc(p[6]) : ""}${p[7] ? (p[2] === "s" ? ", " : ", listed ") + dateLong(p[7]) : ""}</span>${p[3] ? '<span class="go">Open this car ${ARROW}</span>' : ""}</div>`;
      tip.hidden = false;
      const sr = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
      const px = sr.left - br.left + cx / W * sr.width, py = sr.top - br.top + cy / H * sr.height;
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = px + 16;
      if (left + w > br.width - 4) left = px - w - 16;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = Math.max(4, Math.min(py - h / 2, br.height - h - 4)) + "px";
    };
    cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { const i = nearest(e); if (i !== sel) show(i); } });
    cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") show(-1); });
    cv.addEventListener("click", e => {
      const i = nearest(e);
      if (i < 0) return show(-1);
      if (i === sel && vis[i][3]) location.hash = "car-" + vis[i][3];
      else show(i);
    });
  }

      + `<section class="block"><div class="wrap"><div class="prose">
        <h3>Sources</h3>
        <p>Asking prices come from the Ferrari dealer network's own used inventory, including cars certified under Ferrari Approved, and from dealer marketplaces: duPont Registry and ClassicCars.com. Cars for sale count when they are in the US: a car listed by a dealer in Canada or Europe is left out, wherever the site that lists it is based. Hypercars and limited series cars (the F40, F50, Enzo, LaFerrari, Monza, Daytona SP3, 812 Competizione, SF90 XX and the rest of that family) are the exception: so few exist that the world is one market for them, so they count for sale anywhere. Auction results come from around the world, from Bring a Trailer, Cars &amp; Bids, Sotheby's Motorsport, duPont Registry Live, RM Sotheby's, Gooding Christie's, Bonhams, Broad Arrow, PCARMARKET and Mecum, because a sale in London or Monaco is still a real price for the car. We collect once a day.</p>
        <h3>One car, one count</h3>
        <p>The same car is often listed on several sites at once. We match cars by VIN, then by chassis number for older cars, then by model, year, mileage, colour and seller. Each physical car moves the numbers once. When one car shows two prices, the selling dealer's own price wins.</p>
        <h3>Median ask</h3>
        <p>The middle asking price of every tracked car of a model on a given day. Cars listed as price on request are left out. A listing counts as gone after two successful daily checks in a row without it.</p>
        <h3>Market movers</h3>
        <p>Each model's asking prices this week against the same model a week earlier, compared model year by model year so a change in the mix of years does not look like a move. A batch of cheaper cars arriving or a round of price cuts both pull a model down, and the reverse pushes it up. A model needs at least five cars for sale in both weeks. The most active model is the one with the most cars added, sold or taken off the market over the week.</p>
        <h3>Mileage curve</h3>
        <p>Each car page plots its model's prices against mileage: every car for sale now and every auction sale in the last 18 months that gave a mileage. Older sales are left out because the market has moved since. The curve is fitted to the logarithm of price, in whichever of two shapes fits the cars better: a steady percentage per mile, or a steeper drop over the first miles that then flattens. Cars far off the curve, such as race cars or wrecks, are set aside before the final fit. The shaded band is the typical spread around the curve. Model year and specification also move prices, so the curve is a guide rather than a valuation.</p>
        <h3>Colour premiums</h3>
        <p>Each model page shows what every exterior colour is worth against red. Sites name paint their own way, so every name is first put in a family: Rosso Corsa, Rosso Scuderia and plain Red are all red, Grigio Silverstone is grey. Paint Ferrari makes outside its standard range, which Ferrari Approved lists only as "Extra Sample", is still a colour: such a car takes its colour from another site that lists the same VIN, and what the one off paint adds is measured separately, so it is not credited to the colour. A special order car no site names a colour for is left out. Year and mileage move price far more than paint, and one colour's cars may simply be newer, so we fit each model's prices to year, mileage and colour together and read off what the colour alone adds. The range shown is 90% sure. A colour needs at least three cars in the model, and red at least three, before it is shown. The figure for every model compares cars only within the same model and years, never a 296 against a Roma.</p>
        <h3>Auction results</h3>
        <p>Houses report prices differently. Bring a Trailer, Cars &amp; Bids, Sotheby's Motorsport and duPont Registry Live show the winning bid. RM Sotheby's and Mecum include the buyer's premium. Prices in pounds, euros or francs are converted to US dollars at the day's rate. A result far outside the model's asking range is kept on its model page but left out of the headline insights, because it is more often a data error than a real sale.</p>
        <h3>What these numbers are not</h3>
        <p>Asking prices are what sellers hope to get. They are not appraisals or offers, and individual cars vary with mileage, history and specification.</p>
      </div></div></section>`;
    window.scrollTo(0, 0);
  }

  function viewPrivacy() {
    app.innerHTML = pageHead("Privacy", "Privacy", "")
      + `<section class="block"><div class="wrap"><div class="prose">
        <p>Rosso Market does not ask you for an account and does not collect personal information. We do not use advertising or tracking cookies.</p>
        <p>Our host keeps standard server logs, such as IP address and pages requested, for security and to keep the site running. If we add privacy friendly visitor counts later, this page will say so.</p>
        <p>Listings and auction results shown here are about cars, gathered from public pages and licensed data. We do not publish sellers' or buyers' personal details. Links take you to the original listing, where that site's own privacy policy applies.</p>
      </div></div></section>`;
    window.scrollTo(0, 0);
  }

  function notFound() {
    app.innerHTML = `<section class="block"><div class="wrap"><h2>Page not found</h2><p><a class="link-more" href="#overview">Back to the overview ${ARROW}</a></p></div></section>`;
  }

  function wireRows() {
    app.querySelectorAll("tr[data-href]").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a")) location.hash = tr.dataset.href.slice(1); }));
  }

  // ------------------------------------------------------------ chrome
  function buildMenu() {
    document.getElementById("menu-grid").innerHTML = D.families.map(f => `<div><h4><a href="#family-${f.slug}">${esc(f.name)}</a></h4>
      ${f.models.map(id => byId[id]).filter(Boolean).map(m => `<a href="${modelLink(m.id)}"><span>${esc(m.name)}</span><span class="num">${m.listings || (m.auction || {}).sold_12m || ""}</span></a>`).join("")}</div>`).join("");
  }

  function buildFooter() {
    const h = D.health || [];
    document.getElementById("foot").innerHTML = `<div>
      <a class="logo" href="#overview"><span class="mark" aria-hidden="true"><i></i><i></i></span><span class="logo-word">Rosso Market</span></a>
      <nav aria-label="Footer"><a href="#overview">Overview</a><a href="#auctions">Auctions</a><a href="#news">News</a><a href="#methodology">Methodology</a><a href="#privacy">Privacy</a></nav>
      <p style="margin-top:18px;max-width:60ch">Rosso Market is independent and is not affiliated with or endorsed by Ferrari S.p.A. Prices are asking prices and auction results gathered from public sources and licensed data feeds. They can contain errors and are not an offer or a valuation.</p>
      <p>Data as of ${dateLong(D.as_of)}.</p></div>
      <div><h2>Data sources, last run</h2><div class="health">
      ${h.map(s => `<div><span>${esc(s.source)}${s.accepted != null ? ` <span class="num">(${s.accepted})</span>` : ""}</span><span class="state ${s.state}">${s.state}</span></div>`).join("") || "<div>No runs yet</div>"}</div></div>`;
  }

  // ------------------------------------------------------------ search
  // Every car we have seen stays findable by its VIN (or chassis number on older cars), sold or
  // not, and models are found by name. The VIN index loads the first time the box is used.
  let SEARCH = null, sresItems = [], sresOn = -1;
  const loadSearch = () => SEARCH || (SEARCH = fetch("data/search.json").then(r => r.ok ? r.json() : []).catch(() => []));
  function searchResults(raw, index) {
    const q = raw.trim();
    const key = q.toUpperCase().replace(/[^A-Z0-9]/g, "");
    const out = [];
    if (key.length >= 4) {
      for (const [vin, id, title, status, price] of index) {
        const at = vin.indexOf(key);
        if (at >= 0) out.push({ href: "#car-" + id, title, vin, at, len: key.length, status, price, exact: vin === key });
        if (out.length >= 40) break;
      }
      out.sort((a, b) => b.exact - a.exact || (a.at === a.vin.length - a.len ? -1 : 0) - (b.at === b.vin.length - b.len ? -1 : 0));
    }
    const words = q.toLowerCase();
    if (words.length >= 2) {
      D.models.filter(m => m.name.toLowerCase().includes(words) || m.id.includes(words.replace(/\s+/g, "-")))
        .slice(0, 6).forEach(m => out.push({ href: modelLink(m.id), title: m.name, model: true, listings: m.listings }));
    }
    return out.slice(0, 12);
  }
  function showResults(list, q) {
    const box = document.getElementById("sres"), input = document.getElementById("q");
    sresItems = list; sresOn = list.length ? 0 : -1;
    if (!q.trim()) { box.hidden = true; input.setAttribute("aria-expanded", "false"); return; }
    const mark = r => esc(r.vin.slice(0, r.at)) + "<mark>" + esc(r.vin.slice(r.at, r.at + r.len)) + "</mark>" + esc(r.vin.slice(r.at + r.len));
    box.innerHTML = list.length ? list.map((r, i) => `<a href="${r.href}" role="option" class="${i === sresOn ? "on" : ""}">
        <b>${esc(r.title || "")}</b>
        ${r.model ? `<span>Model page${r.listings ? ", " + plural(r.listings, "car") + " for sale" : ""}</span>`
                  : `<span class="vin">${mark(r)}</span><span>${esc(r.status || "")}${r.price ? ", " + money(r.price) : ""}</span>`}</a>`).join("")
      : `<p>No car with that VIN in our records. Enter at least 4 characters of the VIN or chassis number, or a model name.</p>`;
    box.hidden = false; input.setAttribute("aria-expanded", "true");
  }
  function initSearch() {
    const input = document.getElementById("q"), box = document.getElementById("sres");
    input.addEventListener("focus", loadSearch, { once: true });
    input.addEventListener("input", async () => {
      const q = input.value;
      const index = await loadSearch();
      if (input.value === q) showResults(searchResults(q, index), q);
    });
    input.addEventListener("keydown", e => {
      if (box.hidden) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (!sresItems.length) return;
        sresOn = (sresOn + (e.key === "ArrowDown" ? 1 : -1) + sresItems.length) % sresItems.length;
        box.querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === sresOn));
      } else if (e.key === "Enter" && sresOn >= 0) {
        e.preventDefault();
        location.hash = sresItems[sresOn].href.slice(1);
        box.hidden = true; input.blur();
      } else if (e.key === "Escape") { box.hidden = true; }
    });
    box.addEventListener("click", e => { if (e.target.closest("a")) { box.hidden = true; input.value = ""; } });
    document.addEventListener("click", e => { if (!e.target.closest(".search")) box.hidden = true; });
  }

  function route() {
    cleanupPage();
    setTimeout(() => fitRows(), 0);
    const h = location.hash.slice(1) || "overview";
    document.getElementById("models-menu").open = false;
    document.querySelectorAll("nav.main [data-nav]").forEach(a => a.dataset.nav === h ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    if (h === "overview") return viewOverview();
    if (h.startsWith("model-")) return viewModel(h.slice(6));
    if (h.startsWith("car-")) return viewCar(h.slice(4));
    if (h.startsWith("family-")) return viewFamily(h.slice(7));
    if (h === "auctions") return viewAuctions();
    if (h === "news") return viewNews();
    if (h === "methodology") return viewMethodology();
    if (h === "privacy") return viewPrivacy();
    notFound();
  }

  document.addEventListener("click", e => {
    const menu = document.getElementById("models-menu");
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });
  document.addEventListener("keydown", e => {
    if (!lb().hidden) {
      if (e.key === "Escape") closePhotos();
      if (e.key === "ArrowRight") showPhoto(LB.i + 1);
      if (e.key === "ArrowLeft") showPhoto(LB.i - 1);
      return;
    }
    if (e.key === "Escape") document.getElementById("models-menu").open = false;
  });
  document.getElementById("lb-close").addEventListener("click", closePhotos);
  document.getElementById("lb-prev").addEventListener("click", () => showPhoto(LB.i - 1));
  document.getElementById("lb-next").addEventListener("click", () => showPhoto(LB.i + 1));
  document.getElementById("lb-strip").addEventListener("click", e => { if (e.target.dataset.j) showPhoto(+e.target.dataset.j); });
  document.getElementById("lb-img").addEventListener("click", () => showPhoto(LB.i + 1));
  let sx = null;
  lb().addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  lb().addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) showPhoto(LB.i + (dx < 0 ? 1 : -1)); sx = null; });
  window.addEventListener("hashchange", () => { if (!lb().hidden) closePhotos(); });

  fetch("data/site.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    D = data;
    D.models.forEach(m => byId[m.id] = m);
    document.getElementById("sample-bar").hidden = !D.sample;
    buildMenu(); buildFooter(); initSearch();
    window.addEventListener("hashchange", route);
    route();
  }).catch(() => {
    app.innerHTML = '<div class="wrap loading">Market data could not be loaded. Run the pipeline to create data/site.json, then serve this folder over HTTP.</div>';
  });
})();
</script>
